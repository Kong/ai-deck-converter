agents:
  - type: a2a
    name: booking
    config:
      targets:
        - address: booking-1.internal:8443
          weight: 200
        - address: booking-2.internal:8443
      balancer:
        algorithm: consistent-hashing
        hash_on_header: X-Session
      path: /a2a
      route:
        paths:
          - /booking
      logging:
        payloads: false
        statistics: true
        max_payload_size: 1048576
  - type: http
    name: plain
    config:
      targets:
        - address: a.internal:80
      balancer:
        algorithm: lowest-latency
      protocol: http
      route:
        paths:
          - /plain
  - type: http
    name: nobalancer
    config:
      targets:
        - address: c.internal:80
      protocol: http
      route:
        paths:
          - /nobalancer
  - type: http
    name: failover
    config:
      targets:
        - address: primary.internal:443
        - address: backup.internal:443
          failover: true
      balancer:
        algorithm: least-connections
      route:
        paths:
          - /failover
