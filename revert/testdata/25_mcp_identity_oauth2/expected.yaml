mcp_servers:
  - type: conversion-listener
    name: secure-flights-mcp
    config:
      route:
        paths:
          - /mcp/secure-flights
      logging:
        payloads: false
        statistics: true
        audits: false
    tools:
      - name: searchFlights
        description: Search available flights
        method: GET
        path: /flights
        scheme: https
        host: flights.internal
    access:
      auth_strategies:
        - openid-connect-1
      metadata:
        endpoint: /mcp/secure-flights/.well-known/oauth-protected-resource
        authorization_servers:
          - https://dev-123456.okta.com/oauth2/default
        resource: https://api.example.com/mcp/secure-flights
        scopes_supported:
          - openid
          - flights:read
  - type: listener
    name: keyed-mcp
    config:
      route:
        paths:
          - /mcp/keyed
      logging:
        payloads: false
        statistics: true
        audits: false
    tools:
      - name: ping
        description: Ping the server
        method: GET
        path: /ping
        scheme: https
        host: keyed.internal
    access:
      auth_strategies:
        - key-auth-1
  - type: passthrough-listener
    name: vendor-proxy-mcp
    config:
      route:
        paths:
          - /mcp/vendor-proxy
      logging:
        payloads: false
        statistics: true
        audits: false
    tools:
      - name: vendorTool
        description: A vendor tool
        method: GET
        path: /vendor
        scheme: https
        host: vendor.internal
    access:
      auth_strategies:
        - openid-connect-1
      metadata:
        endpoint: /mcp/vendor-proxy/.well-known/oauth-protected-resource
        authorization_servers:
          - https://dev-123456.okta.com/oauth2/default
        resource: https://api.example.com/mcp/vendor-proxy
        scopes_supported:
          - openid
          - profile
    upstream_url: https://vendor.example.com/mcp
auth_strategies:
  - type: openid-connect
    name: openid-connect-1
    config:
      cache_introspection: true
      client_alg:
        - RS256
      client_auth:
        - client_secret_post
      client_id:
        - mcp-client
      client_secret:
        - '{vault://ai-vault/okta-client-secret}'
      consumer_by:
        - username
      consumer_claims:
        - - sub
      consumer_optional: true
      credential_claim:
        - sub
      http_version: 1.1
      introspection_endpoint: https://dev-123456.okta.com/oauth2/default/v1/introspect
      keepalive: false
      leeway: 30
      timeout: 5000
  - type: key-auth
    name: key-auth-1
    config:
      key_names:
        - apikey
