_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: skills-route
        paths:
          - /ai/skills
        methods:
          - GET
          - POST
          - DELETE
        strip_path: false
      - name: ant-skills
        paths:
          - /claude/v1/skills
        methods:
          - GET
          - POST
          - DELETE
        strip_path: false
plugins:
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      model_name_header: false
      response_streaming: deny
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://env/openai-key}'
          logging:
            log_payloads: false
            log_statistics: false
          model:
            name: gpt-5.6
            provider: openai
          route_type: llm/v1/skills
    route:
      name: skills-route
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: anthropic
      model_name_header: false
      response_streaming: deny
      targets:
        - auth:
            header_name: x-api-key
            header_value: '{vault://env/anthropic-key}'
          logging:
            log_payloads: false
            log_statistics: false
          model:
            name: claude-sonnet-4-5
            options:
              anthropic_version: "2023-06-01"
            provider: anthropic
          route_type: llm/v1/skills
    route:
      name: ant-skills
