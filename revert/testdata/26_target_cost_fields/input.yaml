_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /ai/chat/completions
        methods:
          - POST
        strip_path: false
plugins:
  - name: ai-model-selector
    config:
      body_path: model
      max_request_body_size: 8388608
      source: body
    route:
      name: openai-chat
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      response_streaming: allow
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/openai-token}'
          model:
            model_alias: '@openai/gpt-5.2'
            name: gpt-5.2
            options:
              cache_read_cost: 0.125
              cache_write_cost: 1.5625
              cache_write_cost_list:
                - cost: 1.5625
                  ttl: 5m
                - cost: 2.5
                  ttl: 1h
              context_window_factor:
                - above: 128k
                  input_factor: 2
                  output_factor: 1.5
              input_cost: 1.25
              max_tokens: 1024
              output_cost: 10
              service_tier_factor:
                - factor: 2
                  tier: priority
                - factor: 0.5
                  tier: flex
              temperature: 1
            provider: openai
          route_type: llm/v1/chat
    route:
      name: openai-chat
ai_models:
  - name: gpt-5-2
    alias: '@openai/gpt-5.2'
