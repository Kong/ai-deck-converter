# The 2.3 openid-connect MCP auth lowering, reverted: an openid-connect plugin
# carrying a protected_resource_metadata block (and the strategy's principals,
# lifted verbatim) reconstructs access.metadata plus an auth strategy. A
# second, PRM-less openid-connect plugin keeps reverting as a plain strategy
# with no metadata.
_format_version: "3.0"
services:
  - name: flights-mcp
    url: https://vendor.example.com/mcp
    routes:
      - name: flights-mcp-route
        paths:
          - /mcp/flights
          - /mcp/flights/.well-known/oauth-protected-resource
        plugins:
          - name: ai-mcp-proxy
            config:
              include_consumer_groups: true
              logging:
                log_audits: false
                log_payloads: false
                log_statistics: true
              mode: passthrough-listener
              tools:
                - description: Search available flights
                  host: flights.internal
                  method: GET
                  name: searchFlights
                  path: /flights
                  scheme: https
          - name: openid-connect
            config:
              auth_methods:
                - bearer
              cache_tokens_salt: pepper
              client_id: mcp-client
              client_secret: '{vault://ai-vault/okta-client-secret}'
              hide_credentials: true
              issuer: https://dev-123456.okta.com/oauth2/default
              principals:
                enabled: true
                directory: my-directory
                principal_claim:
                  - sub
                error_on_miss: true
                jit:
                  all_claims: true
              protected_resource_metadata:
                authorization_servers:
                  - https://dev-123456.okta.com/oauth2/default
                metadata_endpoint: /mcp/flights/.well-known/oauth-protected-resource
                resource: https://api.example.com/mcp/flights
                scopes_supported:
                  - openid
                  - flights:read
              scopes:
                - openid
                - profile
  - name: plain-oidc-mcp
    host: localhost
    routes:
      - name: plain-oidc-mcp-route
        paths:
          - /mcp/plain-oidc
        plugins:
          - name: ai-mcp-proxy
            config:
              include_consumer_groups: true
              logging:
                log_audits: false
                log_payloads: false
                log_statistics: true
              mode: listener
              tools:
                - description: Ping the server
                  host: keyed.internal
                  method: GET
                  name: ping
                  path: /ping
                  scheme: https
          - name: openid-connect
            config:
              issuer: https://dev-123456.okta.com/oauth2/default
              auth_methods:
                - bearer
