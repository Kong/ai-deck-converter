models:
  - type: model
    name: openai-gpt-5-4
    capabilities:
      - generate
    formats:
      - type: openai
    targets:
      - name: gpt-5.4
        provider: openai-ai
        config:
          type: openai
    access:
      auth_strategies:
        - openid-connect-1
    config:
      route:
        paths:
          - /ai
      logging:
        payloads: false
        statistics: true
      max_request_body_size: 50000000
model_providers:
  - type: openai
    name: openai-ai
    config:
      auth:
        type: basic
        headers:
          - name: Authorization
            value: '{vault://ai/openai-token}'
datastores:
  - type: redis-ee
    name: redis-ee
    config:
      host: redis-ee.internal
      password: '{vault://env/redis-password}'
      port: 6379
      ssl: true
auth_strategies:
  - type: openid-connect
    name: openid-connect-1
    config:
      issuer: https://dev-123456.okta.com/oauth2/default
      principals:
        directory: my-directory
        enabled: true
      principals_cache:
        pepper: '{vault://env/principals-cache-pepper}'
    datastores:
      - name: redis-ee
