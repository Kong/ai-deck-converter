# The chat and embeddings plugins share one model but differ in
# conversation_state. Revert makes it a second model.
_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /ai/chat/completions
        methods:
          - POST
        strip_path: false
      - name: openai-embeddings
        paths:
          - /ai/embeddings
        methods:
          - POST
        strip_path: false
plugins:
  - name: ai-proxy-advanced
    config:
      genai_category: text/generation
      llm_format: openai
      conversation_state:
        enabled: true
        strategy: local
      targets:
        - auth:
            header_name: Authorization
            header_value: Bearer {vault://env/openai-key}
          model:
            model_alias: gpt
            name: gpt-5.2
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: gpt
  - name: ai-proxy-advanced
    config:
      genai_category: text/embeddings
      llm_format: openai
      conversation_state:
        enabled: true
        ttl: 600
        strategy: redis
        redis:
          host: redis.internal
          port: 6379
      targets:
        - auth:
            header_name: Authorization
            header_value: Bearer {vault://env/openai-key}
          model:
            model_alias: gpt
            name: text-embedding-3-large
            provider: openai
          route_type: llm/v1/embeddings
    route: openai-embeddings
    model: gpt
ai_models:
  - name: gpt
    alias: gpt
