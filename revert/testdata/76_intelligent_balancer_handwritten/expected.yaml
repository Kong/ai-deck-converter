models:
  - type: model
    name: jev
    capabilities:
      - decisions
    formats:
      - type: typesafe
    targets:
      - name: jev-latest
        provider: typesafe-env
        config:
          type: typesafe
    config:
      route:
        paths:
          - /jev
      logging:
        payloads: false
        statistics: true
  - type: model
    name: kev
    capabilities:
      - decisions
    formats:
      - type: typesafe
    targets:
      - name: kev-latest
        provider: typesafe-1
        config:
          type: typesafe
          upstream_url: http://kev.internal:8009/v1/systemone
    config:
      route:
        paths:
          - /kev
      logging:
        payloads: false
        statistics: true
  - type: model
    name: near
    capabilities:
      - generate
    formats:
      - type: openai
    targets:
      - name: gpt-5-mini
        provider: openai-env
        config:
          type: openai
      - name: gpt-5
        provider: openai-env
        config:
          type: openai
    config:
      route:
        paths:
          - /near
      logging:
        payloads: false
        statistics: true
      balancer:
        algorithm: intelligent
        classifier:
          context_window: 32768
          model: jev
  - type: model
    name: margin
    capabilities:
      - generate
    formats:
      - type: openai
    targets:
      - name: gpt-5-mini
        provider: openai-env
        config:
          type: openai
    config:
      route:
        paths:
          - /margin
      logging:
        payloads: false
        statistics: true
      balancer:
        algorithm: intelligent
        classifier:
          context_window: 32768
          model: kev
          timeout: 2000
        cost_quality_tradeoff: cost
        strategy: margin
  - type: model
    name: orphan
    capabilities:
      - generate
    formats:
      - type: openai
    targets:
      - name: gpt-5-mini
        provider: openai-env
        config:
          type: openai
    config:
      route:
        paths:
          - /orphan
      logging:
        payloads: false
        statistics: true
      balancer:
        algorithm: intelligent
        cost_quality_tradeoff: quality
model_providers:
  - type: typesafe
    name: typesafe-env
    config:
      auth:
        type: basic
        headers:
          - name: Authorization
            value: '{vault://env/typesafe-token}'
  - type: typesafe
    name: typesafe-1
    config:
      auth:
        type: basic
        headers:
          - name: x-api-key
            value: '{vault://env/kev-key}'
  - type: openai
    name: openai-env
    config:
      auth:
        type: basic
        headers:
          - name: Authorization
            value: '{vault://env/openai-key}'
