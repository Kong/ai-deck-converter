_format_version: "3.0"
services:
  - name: vaulted-vendor-mcp
    url: https://mcp.internal.kongair.com
    routes:
      - name: vaulted-vendor-mcp-route
        plugins:
          - name: ai-mcp-proxy
            config:
              auth:
                provider: token_vault
                token_vault:
                  directory: my-directory
                  encryption_secrets:
                    - '{vault://env/TOKEN_VAULT_ENC_SECRET}'
                    - '{vault://env/TOKEN_VAULT_ENC_SECRET_OLD}'
                  provider: my-upstream-provider
                  redis:
                    connect_timeout: 2000
                    database: 0
                    host: redis.internal
                    keepalive_pool_size: 256
                    port: 6379
                    sentinel_master: mymaster
                    sentinel_nodes:
                      - host: sentinel-1.internal
                        port: 6379
                    sentinel_role: any
              include_consumer_groups: true
              logging:
                log_audits: false
                log_payloads: false
                log_statistics: true
              mode: passthrough-listener
              tools:
                - description: A vendor tool
                  name: vendorTool
  - name: bare-vaulted-vendor-mcp
    url: https://bare-mcp.internal.kongair.com
    routes:
      - name: bare-vaulted-vendor-mcp-route
        plugins:
          - name: ai-mcp-proxy
            config:
              auth:
                provider: token_vault
                token_vault:
                  directory: my-directory
                  provider: my-other-upstream-provider
              include_consumer_groups: true
              logging:
                log_audits: false
                log_payloads: false
                log_statistics: true
              mode: passthrough-listener
              tools:
                - description: A bare vendor tool
                  name: bareVendorTool
