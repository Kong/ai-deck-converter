models:
  - type: model
    name: gemini-chat
    capabilities:
      - generate
    formats:
      - type: openai
      - type: gemini
    targets:
      - name: gemini-2.5-pro
        provider: gemini-ai
        config:
          type: gemini
    config:
      route:
        paths:
          - /ai
      logging:
        payloads: false
        statistics: true
model_providers:
  - type: gemini
    name: gemini-ai
    config:
      auth:
        type: basic
        headers:
          - name: x-goog-api-key
            value: '{vault://ai/gemini-key}'
