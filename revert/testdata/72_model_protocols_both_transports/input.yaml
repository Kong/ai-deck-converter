# HTTP routes with https and a realtime route with wss revert to one model
# with protocols [https, wss].
_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /ai/chat/completions
        methods:
          - POST
          - OPTIONS
        protocols:
          - https
        strip_path: false
  - name: ai-gateway-websocket
    url: ws://ai-gateway.upstream.local
    routes:
      - name: openai-realtime
        paths:
          - /ai/realtime
        protocols:
          - wss
        strip_path: false
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - description: gpt-5.4
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: chat-and-realtime
            name: gpt-5.4
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: chat-and-realtime
  - name: ai-proxy-advanced
    protocols:
      - wss
    config:
      balancer:
        algorithm: round-robin
      genai_category: realtime/generation
      llm_format: openai
      targets:
        - description: gpt-5.4
          logging:
            log_payloads: false
            log_statistics: true
          model:
            name: gpt-5.4
            provider: openai
          route_type: realtime/v1/realtime
    route: openai-realtime
    tags:
      - ai-gateway-realtime-model:chat-and-realtime
ai_models:
  - name: chat-and-realtime
