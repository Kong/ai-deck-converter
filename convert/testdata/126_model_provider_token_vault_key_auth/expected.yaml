_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: anthropic-messages
        paths:
          - /ai/claude/v1/messages
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: anthropic-messages-2
        paths:
          - /ai/claude-custom/v1/messages
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: anthropic-messages-3
        paths:
          - /ai/claude-explicit/v1/messages
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: anthropic-messages-4
        paths:
          - /ai/claude-body/v1/messages
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: anthropic-messages-5
        paths:
          - /ai/claude-outbound/v1/messages
        methods:
          - POST
          - OPTIONS
        strip_path: false
routes:
  - name: token-vault-callback-handler
    paths:
      - /_vault
    protocols:
      - http
      - https
    plugins:
      - name: token-vault-callback-handler
        config:
          directory: my-directory
          storage:
            backend: konnect
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: anthropic-messages
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: anthropic
      targets:
        - description: claude-sonnet
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: claude
            name: claude-sonnet
            options:
              anthropic_version: "2023-06-01"
            provider: anthropic
          route_type: llm/v1/chat
    route: anthropic-messages
    model: claude
  - name: token-vault-exchange
    config:
      credential:
        inbound:
          location: header
          name: apikey
          prefix: ""
      directory: my-directory
      provider: anthropic
      storage:
        backend: konnect
      subject_token_type: api_key
    route: anthropic-messages
    model: claude
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: anthropic-messages-2
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: anthropic
      targets:
        - description: claude-sonnet
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: claude-custom
            name: claude-sonnet
            options:
              anthropic_version: "2023-06-01"
            provider: anthropic
          route_type: llm/v1/chat
    route: anthropic-messages-2
    model: claude-custom
  - name: token-vault-exchange
    config:
      credential:
        inbound:
          location: header
          name: x-custom-key
          prefix: ""
      directory: my-directory
      provider: anthropic
      storage:
        backend: konnect
      subject_token_type: api_key
    route: anthropic-messages-2
    model: claude-custom
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: anthropic-messages-3
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: anthropic
      targets:
        - description: claude-sonnet
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: claude-explicit
            name: claude-sonnet
            options:
              anthropic_version: "2023-06-01"
            provider: anthropic
          route_type: llm/v1/chat
    route: anthropic-messages-3
    model: claude-explicit
  - name: token-vault-exchange
    config:
      credential:
        inbound:
          location: header
          name: Authorization
          prefix: Bearer
      directory: my-directory
      provider: anthropic
      storage:
        backend: konnect
      subject_token_type: api_key
    route: anthropic-messages-3
    model: claude-explicit
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: anthropic-messages-4
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: anthropic
      targets:
        - description: claude-sonnet
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: claude-body
            name: claude-sonnet
            options:
              anthropic_version: "2023-06-01"
            provider: anthropic
          route_type: llm/v1/chat
    route: anthropic-messages-4
    model: claude-body
  - name: token-vault-exchange
    config:
      directory: my-directory
      provider: anthropic
      storage:
        backend: konnect
      subject_token_type: api_key
    route: anthropic-messages-4
    model: claude-body
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: anthropic-messages-5
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: anthropic
      targets:
        - description: claude-sonnet
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: claude-outbound
            name: claude-sonnet
            options:
              anthropic_version: "2023-06-01"
            provider: anthropic
          route_type: llm/v1/chat
    route: anthropic-messages-5
    model: claude-outbound
  - name: token-vault-exchange
    config:
      credential:
        inbound:
          location: header
          name: apikey
          prefix: ""
        outbound:
          location: header
          name: X-Upstream-Key
          prefix: ""
      directory: my-directory
      provider: anthropic
      storage:
        backend: konnect
      subject_token_type: api_key
    route: anthropic-messages-5
    model: claude-outbound
  - name: key-auth
    route: anthropic-messages
  - name: key-auth
    config:
      key_names:
        - x-custom-key
    route: anthropic-messages-2
  - name: key-auth
    route: anthropic-messages-3
  - name: key-auth
    config:
      key_in_body: true
      key_in_header: false
    route: anthropic-messages-4
  - name: key-auth
    route: anthropic-messages-5
ai_models:
  - name: claude
  - name: claude-custom
  - name: claude-explicit
  - name: claude-body
  - name: claude-outbound
