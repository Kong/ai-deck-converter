- code: BEHAVIOR_MAY_DIFFER
  reason: 'Model "claude-body": no key-auth strategy reads its key from the headers, so token_vault.credential.inbound cannot be derived from one. The data plane keeps the default inbound (Authorization: Bearer), which the exchange will not find.'
  source:
    kind: model
    name: claude-body
    fields:
      - targets[0].provider.token_vault.credential.inbound
  severity: WARNING
- code: CONFIG_FIELD_OVERRIDDEN
  reason: auth strategy "api-key-hidden" sets config.hide_credentials to true. On a route that uses a Token Vault, hide_credentials will be overridden to false, because the Token Vault reads the credential of the caller from the request.
  source:
    kind: auth_strategy
    name: api-key-hidden
    fields:
      - config.hide_credentials
  severity: WARNING
