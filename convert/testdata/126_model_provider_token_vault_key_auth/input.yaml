# The anthropic provider gets its credential from the Token Vault. A key-auth
# model derives the inbound in its token-vault-exchange plugin. The models
# cover the derived names, an explicit inbound, a body-only key, an empty
# inbound block, and an outbound-only credential.
datastores:
  - name: vault-konnect-prod
    type: token-vault
    config:
      directory: my-directory

auth_strategies:
  # no config: the key-auth default key name (apikey) is derived
  - name: api-key-default
    type: key-auth
    display_name: API Key Default
  - name: api-key-custom
    type: key-auth
    display_name: API Key Custom
    config:
      key_names: [x-custom-key]
  - name: api-key-body
    type: key-auth
    display_name: API Key Body
    config:
      key_in_header: false
      key_in_body: true
  - name: api-key-multi
    type: key-auth
    display_name: API Key Multi
    config:
      key_names: [multi-first, multi-second]
  # hide_credentials: true would strip the derived header before the exchange
  # reads it, so the plugin reveals the credential
  - name: api-key-hidden
    type: key-auth
    display_name: API Key Hidden
    config:
      key_names: [hidden-key]
      hide_credentials: true

models:
  - name: claude
    type: model
    capabilities: [generate]
    formats:
      - type: anthropic
    config:
      route:
        paths: [/ai/claude]
    targets:
      - name: claude-sonnet
        provider: anthropic-vault
        config:
          type: anthropic
    access:
      auth_strategies: [api-key-default]
  - name: claude-custom
    type: model
    capabilities: [generate]
    formats:
      - type: anthropic
    config:
      route:
        paths: [/ai/claude-custom]
    targets:
      - name: claude-sonnet
        provider: anthropic-vault
        config:
          type: anthropic
    access:
      auth_strategies: [api-key-custom]
  # the explicit inbound wins; nothing is derived or warned
  - name: claude-explicit
    type: model
    capabilities: [generate]
    formats:
      - type: anthropic
    config:
      route:
        paths: [/ai/claude-explicit]
    targets:
      - name: claude-sonnet
        provider: anthropic-explicit
        config:
          type: anthropic
    access:
      auth_strategies: [api-key-default]
  # the strategy reads its key from the body, so nothing can be derived
  - name: claude-body
    type: model
    capabilities: [generate]
    formats:
      - type: anthropic
    config:
      route:
        paths: [/ai/claude-body]
    targets:
      - name: claude-sonnet
        provider: anthropic-vault
        config:
          type: anthropic
    access:
      auth_strategies: [api-key-body]
  # several key names: the first one is derived
  - name: claude-multi
    type: model
    capabilities: [generate]
    formats:
      - type: anthropic
    config:
      route:
        paths: [/ai/claude-multi]
    targets:
      - name: claude-sonnet
        provider: anthropic-vault
        config:
          type: anthropic
    access:
      auth_strategies: [api-key-multi]
  # the inbound block is empty: it counts as unset, so the derivation applies
  - name: claude-empty
    type: model
    capabilities: [generate]
    formats:
      - type: anthropic
    config:
      route:
        paths: [/ai/claude-empty]
    targets:
      - name: claude-sonnet
        provider: anthropic-empty
        config:
          type: anthropic
    access:
      auth_strategies: [api-key-default]
  # only the outbound is set: the inbound is derived and the outbound survives
  - name: claude-outbound
    type: model
    capabilities: [generate]
    formats:
      - type: anthropic
    config:
      route:
        paths: [/ai/claude-outbound]
    targets:
      - name: claude-sonnet
        provider: anthropic-outbound
        config:
          type: anthropic
    access:
      auth_strategies: [api-key-default]
  # the strategy hides its key: the derived inbound survives only when the
  # plugin reveals the credential
  - name: claude-hidden
    type: model
    capabilities: [generate]
    formats:
      - type: anthropic
    config:
      route:
        paths: [/ai/claude-hidden]
    targets:
      - name: claude-sonnet
        provider: anthropic-vault
        config:
          type: anthropic
    access:
      auth_strategies: [api-key-hidden]
  # the exchange reads an explicit inbound elsewhere, so the hidden key-auth
  # header is unconsumed: the plugin keeps hide_credentials and warns nothing
  - name: claude-explicit-hidden
    type: model
    capabilities: [generate]
    formats:
      - type: anthropic
    config:
      route:
        paths: [/ai/claude-explicit-hidden]
    targets:
      - name: claude-sonnet
        provider: anthropic-explicit
        config:
          type: anthropic
    access:
      auth_strategies: [api-key-hidden]

model_providers:
  - name: anthropic-vault
    type: anthropic
    datastores: [{name: vault-konnect-prod}]
    token_vault:
      provider: anthropic
      subject_token_type: api_key
  # the explicit inbound wins; nothing is derived
  - name: anthropic-explicit
    type: anthropic
    datastores: [{name: vault-konnect-prod}]
    token_vault:
      provider: anthropic
      subject_token_type: api_key
      credential:
        inbound: {location: header, name: Authorization, prefix: Bearer}
  # only the outbound is set: the inbound is derived and the outbound survives
  - name: anthropic-outbound
    type: anthropic
    datastores: [{name: vault-konnect-prod}]
    token_vault:
      provider: anthropic
      subject_token_type: api_key
      credential:
        outbound: {location: header, name: X-Upstream-Key, prefix: ""}
  # the inbound block is empty: the derivation applies
  - name: anthropic-empty
    type: anthropic
    datastores: [{name: vault-konnect-prod}]
    token_vault:
      provider: anthropic
      subject_token_type: api_key
      credential:
        inbound: {}
