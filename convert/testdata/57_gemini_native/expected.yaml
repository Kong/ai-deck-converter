_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: gemini-generate
        paths:
          - ~/ai/v1beta/models/(?<model_name>[^:/]+):(?:generateContent|streamGenerateContent)
        methods:
          - GET
          - POST
        strip_path: false
      - name: gemini-embeddings
        paths:
          - ~/ai/v1beta/models/(?<model_name>[^:/]+):(?:embedContent|batchEmbedContents)
        methods:
          - GET
          - POST
        strip_path: false
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - path_pattern: 'models/([%w%.%-]+):'
          source: path
    route: gemini-generate
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: gemini
      targets:
        - description: gemini-2.5-pro-a
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: gemini-2-5-pro
            name: gemini-2.5-pro-a
            options:
              max_tokens: 4096
              temperature: 1
            provider: gemini
          route_type: llm/v1/chat
        - description: gemini-2.5-pro-b
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: gemini-2-5-pro
            name: gemini-2.5-pro-b
            options:
              max_tokens: 4096
              temperature: 1
            provider: gemini
          route_type: llm/v1/chat
    route: gemini-generate
    model: gemini-2-5-pro
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - path_pattern: 'models/([%w%.%-]+):'
          source: path
    route: gemini-embeddings
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/embeddings
      llm_format: gemini
      targets:
        - description: text-embedding-005-a
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: text-embedding-005
            name: text-embedding-005-a
            provider: gemini
          route_type: llm/v1/embeddings
        - description: text-embedding-005-b
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: text-embedding-005
            name: text-embedding-005-b
            provider: gemini
          route_type: llm/v1/embeddings
    route: gemini-embeddings
    model: text-embedding-005
ai_models:
  - name: gemini-2-5-pro
  - name: text-embedding-005
