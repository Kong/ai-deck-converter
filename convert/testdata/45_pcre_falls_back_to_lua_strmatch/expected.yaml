_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - ~/openai/(?<openai_model>[^:/]+)/chat/completions
          - ~/alternative/path/(?<openai_model>[^:/]+)/chat/completions
        methods:
          - POST
        strip_path: false
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      path_pattern: /openai/([%w%.%-:]+)
      source: path
    route: openai-chat
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      max_request_body_size: 2097152
      response_streaming: deny
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/openai-token}'
          description: gpt-4o
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: full-model
            name: gpt-4o
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: full-model
ai_models:
  - name: full-model
