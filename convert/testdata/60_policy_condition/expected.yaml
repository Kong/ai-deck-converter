_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /ai/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-chat-2
        paths:
          - /team/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-ai
        paths:
          - /ai/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-team
        paths:
          - /team/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
plugins:
  - name: rate-limiting
    condition: http.request.path ~ "^/ai"
    config:
      minute: 1000
      policy: local
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - id: 5d587cb8-26e8-59db-a6e9-e995ee3e4199
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://env/openai-key}'
          description: gpt-4o
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: guarded-gpt
            name: gpt-4o
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: guarded-gpt
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat-2
  - id: 4510e3df-d7ea-5ede-8e9d-d82a51609c2b
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://env/openai-key}'
          description: gpt-4o
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: team-gpt
            name: gpt-4o
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat-2
    model: team-gpt
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 4510e3df-d7ea-5ede-8e9d-d82a51609c2b
          - plugin_id: 5d587cb8-26e8-59db-a6e9-e995ee3e4199
      route_type: llm/v1/models
    route: models
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 5d587cb8-26e8-59db-a6e9-e995ee3e4199
      route_type: llm/v1/models
    route: models-ai
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 4510e3df-d7ea-5ede-8e9d-d82a51609c2b
      route_type: llm/v1/models
    route: models-team
  - name: ai-prompt-guard
    condition: http.request.headers.x_tier == "premium"
    config:
      allow_patterns:
        - ^safe
    route: openai-chat
    model: guarded-gpt
  - name: ai-rate-limiting-advanced
    expressions:
      custom_key: http.request.headers.x_tenant
    config:
      strategy: local
    route: openai-chat
    model: guarded-gpt
  - name: ai-rate-limiting-advanced
    expressions:
      custom_key: http.request.headers.x_team
    config:
      strategy: local
    route: openai-chat-2
    model: team-gpt
ai_models:
  - name: guarded-gpt
  - name: team-gpt
