_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-batches
        paths:
          - /bedrock-first/batches
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-batches-2
        paths:
          - /openai-first/batches
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-batches-3
        paths:
          - /azure-first/batches
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
plugins:
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      max_request_body_size: 20000000
      model_name_header: false
      targets:
        - auth:
            aws_access_key_id: '{vault://ai/aws-access-key-id}'
            aws_secret_access_key: '{vault://ai/aws-secret-access-key}'
          description: batch-api
          logging:
            log_payloads: false
            log_statistics: false
          model:
            name: batch-api
            options:
              bedrock:
                aws_region: us-east-1
                batch_bucket_prefix: s3://kong-bedrock-batches/jobs/
            provider: bedrock
          route_type: llm/v1/batches
        - description: gpt-5.4
          logging:
            log_payloads: false
            log_statistics: false
          model:
            name: gpt-5.4
            provider: openai
          route_type: llm/v1/batches
    route: openai-batches
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      max_request_body_size: 20000000
      model_name_header: false
      targets:
        - description: gpt-5.4
          logging:
            log_payloads: false
            log_statistics: false
          model:
            name: gpt-5.4
            provider: openai
          route_type: llm/v1/batches
        - auth:
            aws_access_key_id: '{vault://ai/aws-access-key-id}'
            aws_secret_access_key: '{vault://ai/aws-secret-access-key}'
          description: batch-api
          logging:
            log_payloads: false
            log_statistics: false
          model:
            name: batch-api
            options:
              bedrock:
                aws_region: us-east-1
                batch_bucket_prefix: s3://kong-bedrock-batches/jobs/
            provider: bedrock
          route_type: llm/v1/batches
    route: openai-batches-2
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      max_request_body_size: 50000000
      model_name_header: false
      targets:
        - description: gpt-5.4
          logging:
            log_payloads: false
            log_statistics: false
          model:
            name: gpt-5.4
            options:
              azure_deployment_id: gpt-5.4
              instance: kong-ai
            provider: azure
          route_type: llm/v1/batches
        - description: gpt-5.4
          logging:
            log_payloads: false
            log_statistics: false
          model:
            name: gpt-5.4
            provider: openai
          route_type: llm/v1/batches
    route: openai-batches-3
ai_models:
  - name: bedrock-first
  - name: openai-second
  - name: openai-first
  - name: bedrock-second
  - name: azure-first
  - name: openai-after-azure
