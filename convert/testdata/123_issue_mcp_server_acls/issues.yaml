- code: CONFIG_FIELD_INVALID
  reason: acl policy sets allow and deny, but a Kong acl plugin permits exactly one of allow, deny, allow_when, or deny_when
  source:
    kind: mcp_server
    name: two-fields-mcp
    fields:
      - access.acls.allow
      - access.acls.deny
  severity: ERROR
- code: CONFIG_FIELD_INVALID
  reason: MCP server "source-mcp" has type "upstream-server"; access.acls is only supported for listener, conversion-listener, and passthrough-listener
  source:
    kind: mcp_server
    name: source-mcp
    fields:
      - access.acls
  severity: ERROR
