_format_version: "3.0"
services:
  - name: valid-mcp
    url: https://flights.internal.kongair.com
    routes:
      - name: valid-mcp-route
        paths:
          - /mcp/valid
        plugins:
          - name: ai-mcp-proxy
            config:
              include_consumer_groups: true
              logging:
                log_audits: false
                log_payloads: false
                log_statistics: true
              mode: conversion-listener
              tools:
                - description: Search flights
                  method: GET
                  name: search_flights
                  path: /flights
          - name: acl
            config:
              always_use_authenticated_groups: true
              deny:
                - interns
              include_consumer_groups: true
