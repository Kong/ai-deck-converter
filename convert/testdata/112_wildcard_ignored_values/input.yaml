# A list with "*" ignores its other values, with no issue. The passthrough
# value does not make a passthrough model.
models:
  - name: everything
    type: model
    capabilities: [generate, "*", embedings]
    formats: [{type: passthrough}, {type: "*"}]
    config:
      route: {paths: [/ai]}
    targets:
      - name: gpt-5.4
        provider: openai-prod
model_providers:
  - name: openai-prod
    type: openai
    config:
      auth:
        type: bearer
        token: "{vault://ai/openai-key}"
