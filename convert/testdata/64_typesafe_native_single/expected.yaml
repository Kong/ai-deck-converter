_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: typesafe-decisions
        paths:
          - ~/ai/v1/systemone
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-ai
        paths:
          - /ai/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: typesafe-decisions
  - id: e0d3afaa-a237-55d4-8530-6f20fc353a35
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: typesafe
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/typesafe-token}'
          description: jev-latest
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: jev-hosted-on-typesafe
            name: jev-latest
            provider: typesafe
          route_type: llm/v1/chat
    route: typesafe-decisions
    model: jev-hosted-on-typesafe
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: e0d3afaa-a237-55d4-8530-6f20fc353a35
      route_type: llm/v1/models
    route: models
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: e0d3afaa-a237-55d4-8530-6f20fc353a35
      route_type: llm/v1/models
    route: models-ai
ai_models:
  - name: jev-hosted-on-typesafe
