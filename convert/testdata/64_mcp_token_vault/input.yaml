datastores:
  - name: vault-konnect-prod
    type: token-vault
    config:
      directory: my-directory

mcp_servers:
  # passthrough MCP server resolving its upstream credential per request via
  # Kong's Token Vault, with an explicit subject token type.
  - type: passthrough-listener
    display_name: Vaulted Vendor MCP
    name: vaulted-vendor-mcp
    upstream_url: https://mcp.internal.kongair.com
    config: {route: {paths: [/mcp/vaulted-vendor-mcp]}}
    datastores: [{name: vault-konnect-prod}]
    token_vault:
      provider: my-upstream-provider
      subject_token_type: access_token
    tools:
      - name: vendorTool
        description: A vendor tool
  # bare token_vault: only the required provider.
  - type: passthrough-listener
    display_name: Bare Vaulted Vendor MCP
    name: bare-vaulted-vendor-mcp
    upstream_url: https://bare-mcp.internal.kongair.com
    config: {route: {paths: [/mcp/bare-vaulted-vendor-mcp]}}
    datastores: [{name: vault-konnect-prod}]
    token_vault:
      provider: my-other-upstream-provider
    tools:
      - name: bareVendorTool
        description: A bare vendor tool
