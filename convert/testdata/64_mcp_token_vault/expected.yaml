_format_version: "3.0"
services:
  - name: vaulted-vendor-mcp
    url: https://mcp.internal.kongair.com
    routes:
      - name: vaulted-vendor-mcp-route
        paths:
          - /mcp/vaulted-vendor-mcp
        plugins:
          - name: ai-mcp-proxy
            config:
              auth:
                provider: token_vault
                token_vault:
                  directory: my-directory
                  provider: my-upstream-provider
                  storage:
                    backend: konnect
                  subject_token_type: access_token
              include_consumer_groups: true
              logging:
                log_audits: false
                log_payloads: false
                log_statistics: true
              mode: passthrough-listener
              tools:
                - description: A vendor tool
                  name: vendorTool
  - name: bare-vaulted-vendor-mcp
    url: https://bare-mcp.internal.kongair.com
    routes:
      - name: bare-vaulted-vendor-mcp-route
        paths:
          - /mcp/bare-vaulted-vendor-mcp
        plugins:
          - name: ai-mcp-proxy
            config:
              auth:
                provider: token_vault
                token_vault:
                  directory: my-directory
                  provider: my-other-upstream-provider
                  storage:
                    backend: konnect
              include_consumer_groups: true
              logging:
                log_audits: false
                log_payloads: false
                log_statistics: true
              mode: passthrough-listener
              tools:
                - description: A bare vendor tool
                  name: bareVendorTool
routes:
  - name: token-vault-callback-handler
    paths:
      - /_vault
    protocols:
      - http
      - https
    plugins:
      - name: token-vault-callback-handler
        config:
          directory: my-directory
          storage:
            backend: konnect
