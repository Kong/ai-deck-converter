auth_strategies:
  - display_name: Okta OIDC
    name: okta-oidc
    type: openid-connect
    config:
      issuer: https://dev-123456.okta.com/oauth2/default
      client_id: [mcp-client]
      client_secret: ["{vault://ai-vault/okta-client-secret}"]
      scopes: [openid, profile]
      # Mapped identity fields (Gap 1 & 2 clean subset).
      client_auth: [client_secret_post]
      client_alg: [RS256]
      introspection_endpoint: https://dev-123456.okta.com/oauth2/default/v1/introspect
      cache_introspection: true
      leeway: 30
      timeout: 5000
      keepalive: false
      http_version: 1.1
      consumer_by: [username]
      consumer_claims: [[sub]]
      consumer_optional: true
      credential_claim: [sub]
      # OIDC-only field with no ai-mcp-oauth2 target: must stay dropped.
      cache_tokens_salt: pepper
  - display_name: MCP Key Auth
    name: mcp-key-auth
    type: key-auth
    config:
      key_names: [apikey]
mcp_servers:
  - type: conversion-listener
    display_name: Secure Flights MCP
    name: secure-flights-mcp
    config:
      route:
        paths: [/mcp/secure-flights]
    access:
      auth_strategies: [okta-oidc]
      metadata:
        endpoint: /mcp/secure-flights/.well-known/oauth-protected-resource
        resource: https://api.example.com/mcp/secure-flights
        authorization_servers:
          - https://dev-123456.okta.com/oauth2/default
        scopes_supported: [openid, flights:read]
    tools:
      - name: searchFlights
        description: Search available flights
        method: GET
        path: /flights
        scheme: https
        host: flights.internal
  - type: listener
    display_name: Keyed MCP
    name: keyed-mcp
    config:
      route:
        paths: [/mcp/keyed]
    access:
      auth_strategies: [mcp-key-auth]
    tools:
      - name: ping
        description: Ping the server
        method: GET
        path: /ping
        scheme: https
        host: keyed.internal
  - type: passthrough-listener
    display_name: Vendor Proxy MCP
    name: vendor-proxy-mcp
    upstream_url: https://vendor.example.com/mcp
    config:
      route:
        paths: [/mcp/vendor-proxy]
    access:
      auth_strategies: [okta-oidc]
      metadata:
        endpoint: /mcp/vendor-proxy/.well-known/oauth-protected-resource
        resource: https://api.example.com/mcp/vendor-proxy
        authorization_servers:
          - https://dev-123456.okta.com/oauth2/default
    tools:
      - name: vendorTool
        description: A vendor tool
        method: GET
        path: /vendor
        scheme: https
        host: vendor.internal
