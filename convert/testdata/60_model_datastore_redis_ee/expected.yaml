_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /ai/chat/completions
        methods:
          - POST
        strip_path: false
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: semantic
        slots: 10000
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://env/openai-key}'
          description: gpt-4o
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: semantic-redis
            name: gpt-4o
            provider: openai
          route_type: llm/v1/chat
      vectordb:
        dimensions: 1536
        distance_metric: cosine
        redis:
          database: 2
          host: redis-ee.internal
          password: '{vault://env/redis-password}'
          port: 6379
          sentinel_master: mymaster
          sentinel_nodes:
            - host: sentinel-a.internal
              port: 26379
          ssl: true
          ssl_verify: true
          username: semantic
        strategy: redis
        threshold: 0.8
    route: openai-chat
    model: semantic-redis
ai_models:
  - name: semantic-redis
