_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - ~^/deployments/(?<id>[^/]+)/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-deployments-id
        paths:
          - ~^/deployments/(?<id>[^/]+)/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - id: d924abbd-5e45-54e1-8831-0feb0ae8d661
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            header_name: Authorization
            header_value: Bearer test
          description: gpt-4o
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: azure-chat
            name: gpt-4o
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: azure-chat
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: d924abbd-5e45-54e1-8831-0feb0ae8d661
      route_type: llm/v1/models
    route: models
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: d924abbd-5e45-54e1-8831-0feb0ae8d661
      route_type: llm/v1/models
    route: models-deployments-id
ai_models:
  - name: azure-chat
