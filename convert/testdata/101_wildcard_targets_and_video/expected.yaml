_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /ai/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-responses
        paths:
          - /ai/responses
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-audio-speech
        paths:
          - /ai/audio/speech
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-audio-transcribe
        paths:
          - /ai/audio/transcriptions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-audio-translate
        paths:
          - /ai/audio/translations
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-embeddings
        paths:
          - /ai/embeddings
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-images
        paths:
          - /ai/images/generations
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-skills
        paths:
          - /ai/skills
        methods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        strip_path: false
      - name: openai-videos
        paths:
          - /ai/videos
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: anthropic-messages
        paths:
          - /ai/v1/messages
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-ai
        paths:
          - /ai/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: openai-videos-lifecycle
        paths:
          - /ai/videos
        methods:
          - GET
          - DELETE
        strip_path: false
        tags:
          - aigw:video-lifecycle
      - name: openai-videos-lifecycle-2
        paths:
          - /ai/videos
        methods:
          - GET
          - DELETE
        strip_path: false
        tags:
          - aigw:video-lifecycle
  - name: ai-gateway-websocket
    url: ws://ai-gateway.upstream.local
    routes:
      - name: openai-realtime
        paths:
          - /ai/realtime
        protocols:
          - ws
          - wss
        strip_path: false
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - id: 003f3c45-1163-5a43-b6e6-e1ad4ef8aef7
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - description: primary
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: a
            name: primary
            provider: openai
          route_type: llm/v1/chat
        - auth:
            header_name: api-key
            header_value: '{vault://ai/azure-key}'
          description: fallback
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: a
            name: fallback
            options:
              azure_api_version: "2024-10-21"
              azure_deployment_id: fallback
              azure_instance: kong-prod
            provider: azure
          route_type: llm/v1/chat
    route: openai-chat
    model: a
  - name: ai-model-selector
