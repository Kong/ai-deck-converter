_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /mantle/v1/chat/completions
          - /mantle/openai/v1/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-responses
        paths:
          - /mantle/v1/responses
          - /mantle/openai/v1/responses
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: anthropic-messages
        paths:
          - /mantle/v1/messages
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-files
        paths:
          - /mantle-files/v1/files
          - /mantle-files/openai/v1/files
        methods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-mantle-files
        paths:
          - /mantle-files/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-mantle
        paths:
          - /mantle/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - id: d5c80b48-5f02-5dca-bef0-513c34f37b77
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            aws_access_key_id: '{vault://ai/aws-access-key-id}'
            aws_secret_access_key: '{vault://ai/aws-secret-access-key}'
          description: openai.gpt-oss-120b
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: mantle
            name: openai.gpt-oss-120b
            options:
              bedrock:
                aws_region: us-east-1
                endpoint_type: mantle
                mantle_openai_path_prefix: /v1
            provider: bedrock
          route_type: llm/v1/chat
    route: openai-chat
    model: mantle
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-responses
  - id: b203783d-5b68-5c91-9d46-de8a4f2e936f
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            aws_access_key_id: '{vault://ai/aws-access-key-id}'
            aws_secret_access_key: '{vault://ai/aws-secret-access-key}'
          description: openai.gpt-oss-120b
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: mantle
            name: openai.gpt-oss-120b
            options:
              bedrock:
                aws_region: us-east-1
                endpoint_type: mantle
                mantle_openai_path_prefix: /v1
            provider: bedrock
          route_type: llm/v1/responses
    route: openai-responses
    model: mantle
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: anthropic-messages
  - id: 1fa06e58-c803-5807-b42f-9aa0f32c1422
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
