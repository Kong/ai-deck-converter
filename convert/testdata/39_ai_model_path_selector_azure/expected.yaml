_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - ~/azure/path/prefix/(?<my_cool_model>)/pathsuffix/chat/completions
        methods:
          - POST
        strip_path: false
plugins:
  - name: ai-model-selector
    config:
      path_pattern: /azure/path/prefix/([%w%.%-:]+)/pathsuffix/chat/completions
      source: path
    route: openai-chat
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            param_location: query
            param_name: api-key
            param_value: '{vault://env/azure-key}'
          description: gpt-4o-azure
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: gpt-4o
            name: gpt-4o-azure
            options:
              azure_api_version: "2024-02-01"
              azure_deployment_id: gpt4o-dep
              azure_instance: kong-az-east
            provider: azure
          route_type: llm/v1/chat
          weight: 30
    route: openai-chat
    model: gpt-4o
ai_models:
  - name: gpt-4o
