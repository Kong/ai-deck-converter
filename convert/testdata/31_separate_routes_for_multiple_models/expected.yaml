_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-audio-transcribe
        paths:
          - /transcribev0/audio/transcriptions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-audio-transcribe-2
        paths:
          - /transcribev1/audio/transcriptions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-transcribev0
        paths:
          - /transcribev0/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-transcribev1
        paths:
          - /transcribev1/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-audio-transcribe
  - id: c8fea922-b5bd-5506-8c5d-c69fff7ceb71
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: audio/transcription
      llm_format: openai
      response_streaming: allow
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/openai-token}'
          description: gpt-4o-transcribe
          logging:
            log_payloads: false
            log_statistics: false
          model:
            model_alias: gpt-5-2
            name: gpt-4o-transcribe
            options:
              max_tokens: 1024
              temperature: 1
            provider: openai
          route_type: audio/v1/audio/transcriptions
    route: openai-audio-transcribe
    model: gpt-5-2
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-audio-transcribe-2
  - id: 8021ce1b-361f-5ffe-b93b-96ebc85efd9e
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: audio/transcription
      llm_format: openai
      response_streaming: allow
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/openai-token}'
          description: gpt-4o-transcribe
          logging:
            log_payloads: false
            log_statistics: false
          model:
            model_alias: gpt-5-2.1
            name: gpt-4o-transcribe
            options:
              max_tokens: 1024
              temperature: 1
            provider: openai
          route_type: audio/v1/audio/transcriptions
    route: openai-audio-transcribe-2
    model: gpt-5-2.1
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: c8fea922-b5bd-5506-8c5d-c69fff7ceb71
          - plugin_id: 8021ce1b-361f-5ffe-b93b-96ebc85efd9e
      route_type: llm/v1/models
    route: models
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: c8fea922-b5bd-5506-8c5d-c69fff7ceb71
      route_type: llm/v1/models
    route: models-transcribev0
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 8021ce1b-361f-5ffe-b93b-96ebc85efd9e
      route_type: llm/v1/models
    route: models-transcribev1
ai_models:
  - name: gpt-5-2
  - name: gpt-5-2.1
