_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /ai/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 50000000
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      max_request_body_size: 50000000
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/openai-token}'
          description: gpt-5.4
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: openai-gpt-5-4
            name: gpt-5.4
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: openai-gpt-5-4
  - name: openid-connect
    config:
      issuer: https://dev-123456.okta.com/oauth2/default
      principals:
        directory: my-directory
        enabled: true
      principals_cache:
        pepper: '{vault://env/principals-cache-pepper}'
        strategy: redis
      redis:
        host: redis-ee.internal
        password: '{vault://env/redis-password}'
        port: 6379
        ssl: true
    route: openai-chat
ai_models:
  - name: openai-gpt-5-4
