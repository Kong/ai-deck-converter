_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /ai/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-ai
        paths:
          - /ai/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - id: aedf3f67-5b32-5b7f-9af2-03a1319ecc62
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: semantic
        slots: 10000
      embeddings:
        auth:
          gcp_service_account_json: '{vault://ai/gcp-service-account-json}'
          gcp_use_service_account: true
        model:
          name: text-embedding-004
          options:
            gemini:
              api_endpoint: us-central1-aiplatform.googleapis.com
              location_id: us-central1
              project_id: my-project-id
            upstream_url: https://generativelanguage.googleapis.com
          provider: gemini
      genai_category: text/generation
      llm_format: openai
      targets:
        - description: gpt-4o
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: semantic-lb
            name: gpt-4o
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: semantic-lb
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: aedf3f67-5b32-5b7f-9af2-03a1319ecc62
      route_type: llm/v1/models
    route: models
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: aedf3f67-5b32-5b7f-9af2-03a1319ecc62
      route_type: llm/v1/models
    route: models-ai
ai_models:
  - name: semantic-lb
