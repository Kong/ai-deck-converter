_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /ai/a/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-chat-2
        paths:
          - /ai/b/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-ai-a
        paths:
          - /ai/a/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-ai-b
        paths:
          - /ai/b/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - id: 1da42369-665f-5086-9ca1-7e9a6866dab4
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/openai-token}'
          description: gpt-5.2-a
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: gpt-5-2-a
            name: gpt-5.2-a
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: gpt-5-2-a
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat-2
  - id: 8f11b55c-d710-54dd-bdcb-61065658e265
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/openai-token}'
          description: gpt-5.2-b
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: gpt-5-2-b
            name: gpt-5.2-b
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat-2
    model: gpt-5-2-b
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 1da42369-665f-5086-9ca1-7e9a6866dab4
          - plugin_id: 8f11b55c-d710-54dd-bdcb-61065658e265
      route_type: llm/v1/models
    route: models
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 1da42369-665f-5086-9ca1-7e9a6866dab4
      route_type: llm/v1/models
    route: models-ai-a
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 8f11b55c-d710-54dd-bdcb-61065658e265
      route_type: llm/v1/models
    route: models-ai-b
ai_models:
  - name: gpt-5-2-a
  - name: gpt-5-2-b
