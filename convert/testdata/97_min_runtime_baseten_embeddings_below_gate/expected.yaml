_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /openai/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: semantic
      embeddings:
        auth:
          header_name: Authorization
          header_value: '{vault://ai/openai-token}'
        model:
          name: text-embedding-3-small
          provider: openai
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/openai-token}'
          description: gpt-4o
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: openai-embeddings
            name: gpt-4o
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: openai-embeddings
ai_models:
  - name: openai-embeddings
