_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /ai/chat/completions
        methods:
          - POST
        strip_path: false
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: semantic
        slots: 10000
      embeddings:
        auth:
          header_name: Authorization
          header_value: '{vault://env/openai-key}'
        model:
          name: text-embedding-3-small
          provider: openai
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://env/openai-key}'
          description: gpt-4o
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: semantic-lb
            name: gpt-4o
            provider: openai
          route_type: llm/v1/chat
      vectordb:
        dimensions: 1024
        distance_metric: cosine
        pgvector:
          database: kong-pgvector
          host: 127.0.0.1
          password: my-password
          port: 5432
          ssl: true
          ssl_cert: /path/to/cert.pem
          ssl_cert_key: /path/to/cert.key
          ssl_required: true
          ssl_verify: true
          ssl_version: any
          timeout: 5000
          user: my-user
        strategy: pgvector
        threshold: 0.7
    route: openai-chat
    model: semantic-lb
ai_models:
  - name: semantic-lb
