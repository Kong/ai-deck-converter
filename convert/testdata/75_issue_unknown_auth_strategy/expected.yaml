_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /protected/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-protected
        paths:
          - /protected/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - id: 620a7642-44d4-5515-9ccd-4c4344127e4a
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - description: gpt-4o
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: protected
            name: gpt-4o
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: protected
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 620a7642-44d4-5515-9ccd-4c4344127e4a
      route_type: llm/v1/models
    route: models
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 620a7642-44d4-5515-9ccd-4c4344127e4a
      route_type: llm/v1/models
    route: models-protected
  - name: key-auth
    config:
      key_names:
        - apikey
    route: openai-chat
  - name: key-auth
    config:
      key_names:
        - apikey
    route: models
  - name: key-auth
    config:
      key_names:
        - apikey
    route: models-protected
ai_models:
  - name: protected
