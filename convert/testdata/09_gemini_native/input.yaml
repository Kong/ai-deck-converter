model_providers:
  - name: gemini-prod
    type: gemini
    display_name: Google Gemini AI (Prod)
    config:
      auth:
        type: gcp
        service_account_json: "{vault://ai/gcp-service-account-json}"
models:
  - display_name: Gemini 2.5 Pro
    name: gemini-2-5-pro
    type: model
    capabilities: [generate]
    formats:
      - type: gemini
    config:
      route:
        paths: [/ai]
    targets:
      - name: gemini-2.5-pro-with-gcp-env
        provider: gemini-prod
        config:
          type: gemini
          gcp_environment:
            api_endpoint: https://us-central1-aiplatform.googleapis.com
            location_id: us-central1
            project_id: kong-gemini-project
          max_tokens: 4096
          temperature: 1.0
      - name: gemini-2.6-pro-without-gcp-env
        provider: gemini-prod
        config:
          type: gemini
          max_tokens: 4096
          temperature: 1.0
    policies: []
    access:
      acls: {allow: [], deny: []}
  - display_name: Text Embedding 005
    name: text-embedding-005
    type: model
    capabilities: [embeddings]
    formats:
      - type: gemini
    config:
      route:
        paths: [/ai]
    targets:
      - name: text-embedding-005-with-gcp-env
        provider: gemini-prod
        config:
          type: gemini
          gcp_environment:
            endpoint_id: "my-endpoint-id"
            api_endpoint: https://us-central2-aiplatform.googleapis.com
            location_id: us-central2
            project_id: other-gemini-project
      - name: text-embedding-006-without-gcp-env
        provider: gemini-prod
        config:
          type: gemini
    policies: []
    access:
      acls: {allow: [], deny: []}
