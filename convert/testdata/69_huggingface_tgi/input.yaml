model_providers:
  - name: huggingface-prod
    type: huggingface
    display_name: "Hugging Face (Prod)"
    config:
      auth:
        type: basic
        headers:
          - name: Authorization
            value: "Bearer {vault://ai/hf-token}"
models:
  - display_name: Llama 3.3 70B Instruct (TGI)
    name: hf-llama-3-3-70b-tgi
    type: model
    enabled: true
    capabilities: [generate]
    formats:
      - type: huggingface
    config:
      route:
        paths: [/ai]
        model:
          values: ["@huggingface/llama-3.3-70b-instruct"]
      response_streaming: allow
    targets:
      - name: meta-llama/Llama-3.3-70B-Instruct
        provider: huggingface-prod
        config:
          type: huggingface
          upstream_url: "https://kong-hf-tgi.huggingface.cloud"
          max_tokens: 4096
          temperature: 1.0
    policies: []
    access:
      acls: {allow: [], deny: []}
