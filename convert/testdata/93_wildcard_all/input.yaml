# "*" in both lists serves every endpoint of a type model model. The gemini
# realtime endpoint has the path of the openai one, so it is left out with no
# issue.
models:
  - name: everything
    capabilities: ["*"]
    formats: [{type: "*"}]
    config:
      route: {paths: [/ai]}
    targets:
      - name: gpt-5.6
        provider: openai-prod
        config: {type: openai}
model_providers:
  - name: openai-prod
    type: openai
    config:
      auth:
        type: basic
        headers:
          - name: Authorization
            value: "{vault://ai/openai-token}"
