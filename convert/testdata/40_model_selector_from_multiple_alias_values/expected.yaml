_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /openai-with-multiple-alias-values/chat/completions
        methods:
          - POST
        strip_path: false
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: some_model
          source: body
    route: openai-chat
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - description: gpt-5
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: '@kong/openai'
            name: gpt-5
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: '@kong/openai'
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - description: gpt-5
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: '@kong/the-openai-model'
            name: gpt-5
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: '@kong/the-openai-model'
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - description: gpt-5
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: '@kong/openai-model'
            name: gpt-5
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: '@kong/openai-model'
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - description: gpt-5
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: '@kong/chat-gpt'
            name: gpt-5
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: '@kong/chat-gpt'
ai_models:
  - name: '@kong/openai'
    tags:
      - ai-gateway-model-alias-group:@kong/openai
  - name: '@kong/the-openai-model'
    tags:
      - ai-gateway-model-alias-group:@kong/openai
  - name: '@kong/openai-model'
    tags:
      - ai-gateway-model-alias-group:@kong/openai
  - name: '@kong/chat-gpt'
    tags:
      - ai-gateway-model-alias-group:@kong/openai
