_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: anthropic-messages
        paths:
          - /ai/v1/messages
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-chat
        paths:
          - /ai/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
routes:
  - name: token-vault-callback-handler
    paths:
      - /_vault
    protocols:
      - http
      - https
    plugins:
      - name: token-vault-callback-handler
        config:
          directory: my-directory
          storage:
            backend: konnect
            current_version: v1
            keys:
              - key: '{vault://hcv/vault-enc-key}'
                version: v1
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: anthropic-messages
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: anthropic
      targets:
        - description: claude-sonnet
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: claude
            name: claude-sonnet
            options:
              anthropic_version: "2023-06-01"
            provider: anthropic
          route_type: llm/v1/chat
    route: anthropic-messages
    model: claude
  - name: token-vault-exchange
    config:
      credential:
        inbound:
          location: header
          name: x-api-key
          prefix: ""
        outbound:
          location: header
          name: x-api-key
          prefix: ""
      directory: my-directory
      provider: anthropic
      storage:
        backend: konnect
        current_version: v1
        keys:
          - key: '{vault://hcv/vault-enc-key}'
            version: v1
      subject_token_type: api_key
    route: anthropic-messages
    model: claude
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/openai-token}'
          description: gpt-5.2
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: gpt
            name: gpt-5.2
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: gpt
ai_models:
  - name: claude
  - name: gpt
