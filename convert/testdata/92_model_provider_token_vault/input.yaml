# The anthropic provider gets its credential from the Token Vault. Each model
# that targets it gets a token-vault-exchange plugin with the scope of its
# ai-proxy-advanced plugin. The callback route comes from the datastore.
datastores:
  - name: vault-konnect-prod
    type: token-vault
    config:
      directory: my-directory
      current_version: v1
      keys:
        - version: v1
          key: "{vault://hcv/vault-enc-key}"

models:
  - name: claude
    type: model
    capabilities: [generate]
    formats:
      - type: anthropic
    config:
      route:
        paths: [/ai]
    targets:
      - name: claude-sonnet
        provider: anthropic-vault
        config:
          type: anthropic
  - name: gpt
    type: model
    capabilities: [generate]
    formats:
      - type: openai
    config:
      route:
        paths: [/ai]
    targets:
      - name: gpt-5.2
        provider: openai-static
        config:
          type: openai

model_providers:
  # Anthropic takes the raw key in x-api-key. The empty prefix replaces the
  # plugin default "Bearer ".
  - name: anthropic-vault
    type: anthropic
    datastores: [{name: vault-konnect-prod}]
    token_vault:
      provider: anthropic
      subject_token_type: api_key
      credential:
        inbound:
          location: header
          name: x-api-key
          prefix: ""
        outbound:
          location: header
          name: x-api-key
          prefix: ""
  - name: openai-static
    type: openai
    config:
      auth:
        type: basic
        headers:
          - name: Authorization
            value: "{vault://ai/openai-token}"
