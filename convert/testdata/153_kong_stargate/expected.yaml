_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /ai/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-responses
        paths:
          - /ai/responses
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: anthropic-messages
        paths:
          - /ai/v1/messages
        methods:
          - POST
          - OPTIONS
        strip_path: false
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      response_streaming: allow
      targets:
        - description: kong/model
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: inference
            name: kong/model
            options:
              upstream_url: https://us.inference.konghq.com/v1/chat/completions
            provider: kong-stargate
          route_type: llm/v1/chat
    route: openai-chat
    model: inference
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-responses
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      response_streaming: allow
      targets:
        - description: kong/model
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: inference
            name: kong/model
            options:
              upstream_url: https://us.inference.konghq.com/v1/responses
            provider: kong-stargate
          route_type: llm/v1/responses
    route: openai-responses
    model: inference
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: anthropic-messages
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: anthropic
      response_streaming: allow
      targets:
        - description: kong/model
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: inference
            name: kong/model
            options:
              upstream_url: https://us.inference.konghq.com/v1/messages
            provider: kong-stargate
          route_type: llm/v1/chat
    route: anthropic-messages
    model: inference
ai_models:
  - name: inference
