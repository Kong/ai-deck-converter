_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-videos
        paths:
          - /ai/videos
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-ai
        paths:
          - /ai/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: openai-videos-lifecycle
        paths:
          - /ai/videos
        methods:
          - GET
          - DELETE
        strip_path: false
        tags:
          - aigw:video-lifecycle
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-videos
  - id: c6cf42eb-cc1d-5cf2-bada-61a03ec7c0ac
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: video/generation
      llm_format: openai
      targets:
        - auth:
            header_name: Authorization
            header_value: Bearer ${OPENAI_API_KEY}
          description: sora-2
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: sora
            name: sora-2
            provider: openai
          route_type: video/v1/videos/generations
    route: openai-videos
    model: sora
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: c6cf42eb-cc1d-5cf2-bada-61a03ec7c0ac
      route_type: llm/v1/models
    route: models
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: c6cf42eb-cc1d-5cf2-bada-61a03ec7c0ac
      route_type: llm/v1/models
    route: models-ai
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: video/generation
      llm_format: openai
      model_name_header: false
      targets:
        - auth:
            header_name: Authorization
            header_value: Bearer ${OPENAI_API_KEY}
          description: sora-2
          logging:
            log_payloads: false
            log_statistics: true
          model:
            name: sora-2
            provider: openai
          route_type: video/v1/videos/generations
    route: openai-videos-lifecycle
ai_models:
  - name: sora
