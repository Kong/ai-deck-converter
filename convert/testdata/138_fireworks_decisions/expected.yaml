_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: typesafe-decisions
        paths:
          - ~/fireworks-decisions/v1/systemone
        methods:
          - POST
          - OPTIONS
        strip_path: false
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: typesafe-decisions
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: typesafe
      targets:
        - auth:
            header_name: Authorization
            header_value: Bearer {vault://ai/fireworks-token}
          description: accounts/fireworks/models/rune
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: fireworks-rune
            name: accounts/fireworks/models/rune
            provider: fireworks
          route_type: llm/v1/chat
    route: typesafe-decisions
    model: fireworks-rune
ai_models:
  - name: fireworks-rune
