_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /good/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
plugins:
  - name: ai-llm-as-judge
    config:
      llm:
        model:
          name: gemini-2.5-pro
          options:
            gemini:
              api_endpoint: aiplatform.eu.rep.googleapis.com
              location_id: eu
              project_id: my-project
          provider: gemini
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: semantic
      embeddings:
        auth:
          header_name: Authorization
          header_value: '{vault://ai/gemini-token}'
        model:
          name: text-embedding-004
          options:
            gemini:
              api_endpoint: us-central1-aiplatform.googleapis.com
              location_id: us-central1
              project_id: my-project
          provider: gemini
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://env/openai-key}'
          description: gpt-4o
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: semantic-lb-good
            name: gpt-4o
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: semantic-lb-good
ai_models:
  - name: semantic-lb-good
