plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - description: gpt-5.4
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: default-protocols
            name: gpt-5.4
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: default-protocols
