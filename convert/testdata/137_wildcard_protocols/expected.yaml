_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /default/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-responses
        paths:
          - /default/responses
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-responses-lifecycle
        paths:
          - ~/default/responses/.+
        methods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        strip_path: false
        tags:
          - aigw:responses-lifecycle
      - name: openai-audio-speech
        paths:
          - /default/audio/speech
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-audio-transcribe
