          - /default/audio/translations
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-embeddings
        paths:
          - /default/embeddings
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-images
