# A mantle target on a listed model gets its base path prefix.
# An unlisted model gets auto_detect (see case 76).
model_providers:
  - name: bedrock-prod
    type: bedrock
    display_name: Bedrock Prod
    config:
      auth:
        type: aws
        access_key_id: "{vault://ai/aws-access-key-id}"
        secret_access_key: "{vault://ai/aws-secret-access-key}"
models:
  - display_name: Claude Bedrock
    name: claude-bedrock
    type: model
    capabilities: [generate]
    formats: [{type: openai}]
    config:
      route: {paths: [/ai]}
    targets:
      - name: openai.gpt-oss-120b
        provider: bedrock-prod
        config: {type: bedrock, region: us-east-1, max_tokens: 1024, endpoint_type: mantle}
    policies: []
    access:
      acls: {allow: [], deny: []}
