_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /ai/v1/chat/completions
          - /ai/openai/v1/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            aws_access_key_id: '{vault://ai/aws-access-key-id}'
            aws_secret_access_key: '{vault://ai/aws-secret-access-key}'
          description: openai.gpt-oss-120b
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: claude-bedrock
            name: openai.gpt-oss-120b
            options:
              bedrock:
                aws_region: us-east-1
                endpoint_type: mantle
                mantle_openai_path_prefix: /v1
              max_tokens: 1024
            provider: bedrock
          route_type: llm/v1/chat
    route: openai-chat
    model: claude-bedrock
ai_models:
  - name: claude-bedrock
