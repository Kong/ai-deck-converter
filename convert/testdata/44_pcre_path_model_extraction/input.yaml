models:
  - name: full-model
    type: model
    capabilities: [generate]
    formats:
      - type: openai
    config:
      route:
        # In this new setup (from AIGW 2.0.2) we will allow PCRE
        # based extraction of the model name from the route path.
        paths:
          - '~/openai/(?<openai_model>[^:/]+)'
          - '~/alternative/path/(?<openai_model>[^:/]+)'
        model:
          # This is used to select the capture group name from
          # the PCRE extraction. This is kinda tentative.
          path:
            path_param: openai_model
      response_streaming: deny
      max_request_body_size: 2097152
    targets:
      - name: gpt-4o
        provider: openai-prod
        config:
          type: openai
    policies: []
    access:
      acls: {allow: [], deny: []}
model_providers:
  - name: openai-prod
    type: openai
    display_name: OpenAI Prod
    config:
      auth:
        type: basic
        headers:
          - name: Authorization
            value: "{vault://ai/openai-token}"
