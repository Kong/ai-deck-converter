model_providers:
  - name: openai
    type: openai
models:
  - type: model
    name: disabled-chat
    enabled: false
    capabilities:
      - agentic
      - generate
      - image
    formats:
      - type: openai
    targets:
      - name: gpt-5
        provider: openai
        config:
          type: openai
    config:
      route:
        paths:
          - /disabled-chat
  # The disabled model above makes no output. This model uses its alias and
  # its route without a conflict.
  - type: model
    name: enabled-chat
    capabilities:
      - generate
    targets:
      - name: gpt-5
        provider: openai
    config:
      route:
        paths:
          - /disabled-chat
        model:
          values:
            - disabled-chat
