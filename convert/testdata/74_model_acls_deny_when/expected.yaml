_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /ai/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-ai
        paths:
          - /ai/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - id: 04919120-736c-55b5-8837-c35688614d6e
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      response_streaming: allow
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/openai-token}'
          description: gpt-5.2
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: gpt-5-2
            name: gpt-5.2
            options:
              max_tokens: 1024
              temperature: 1
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: gpt-5-2
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - access:
              deny_when:
                - principal.metadata.admin != 'true'
            plugin_id: 04919120-736c-55b5-8837-c35688614d6e
      route_type: llm/v1/models
    route: models
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - access:
              deny_when:
                - principal.metadata.admin != 'true'
            plugin_id: 04919120-736c-55b5-8837-c35688614d6e
      route_type: llm/v1/models
    route: models-ai
  - name: acl
    config:
      deny_when:
        - principal.metadata.admin != 'true'
      include_consumer_groups: true
    route: openai-chat
    model: gpt-5-2
ai_models:
  - id: 5b3e8cba-2cb7-4fd4-888e-20a6727230f2
    name: gpt-5-2
