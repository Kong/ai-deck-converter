_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: anthropic-passthrough
        paths:
          - /ai
        strip_path: false
plugins:
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: anthropic
      targets:
        - auth:
            header_name: x-api-key
            header_value: '{vault://ai/anthropic-token}'
          description: claude-sonnet-4-5
          logging:
            log_payloads: false
            log_statistics: true
          model:
            name: claude-sonnet-4-5
            provider: anthropic
          route_type: passthrough
    route: anthropic-passthrough
ai_models:
  - name: claude-native
