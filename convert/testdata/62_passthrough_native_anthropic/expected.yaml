_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: anthropic-passthrough
        paths:
          - /ai
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-ai
        paths:
          - /ai/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
plugins:
  - id: 73027a98-50f9-5f1d-bf6e-e8c20ee46968
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: anthropic
      targets:
        - auth:
            header_name: x-api-key
            header_value: '{vault://ai/anthropic-token}'
          description: claude-sonnet-4-5
          logging:
            log_payloads: false
            log_statistics: true
          model:
            name: claude-sonnet-4-5
            provider: anthropic
          route_type: passthrough
    route: anthropic-passthrough
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 73027a98-50f9-5f1d-bf6e-e8c20ee46968
      route_type: llm/v1/models
    route: models
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 73027a98-50f9-5f1d-bf6e-e8c20ee46968
      route_type: llm/v1/models
    route: models-ai
ai_models:
  - name: claude-native
