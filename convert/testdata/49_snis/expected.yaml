_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /chat/completions
        methods:
          - POST
        strip_path: false
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - description: gpt-4o
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: chat
            name: gpt-4o
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: chat
certificates:
  - cert: |
      -----BEGIN CERTIFICATE-----
      MIIBrsBgNVBAMMCnVwc3RyZWFtLTE=
      -----END CERTIFICATE-----
    key: |
      -----BEGIN PRIVATE KEY-----
      MIIBVAIBADANBgkqhkiG9w0BAQEFAA==
      -----END PRIVATE KEY-----
    snis:
      - name: upstream.example.com
        tags:
          - env:prod
          - team:ai-platform
      - name: '*.upstream.example.com'
  - cert: |
      -----BEGIN CERTIFICATE-----
      MIIBrsBgNVBAMMCmR1YWwtcnNhLTE=
      -----END CERTIFICATE-----
    key: |
      -----BEGIN PRIVATE KEY-----
      MIIBVAIBADANBgkqhkiG9w0BAQEFAB==
      -----END PRIVATE KEY-----
    snis:
      - name: dual.example.com
ai_models:
  - name: chat
