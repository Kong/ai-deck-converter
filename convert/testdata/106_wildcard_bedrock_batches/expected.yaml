_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: bedrock-batches
        paths:
          - ~/with-prefix/model-invocation-jobs?(?:/[^/]+(?:/stop)?)?
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-batches
        paths:
          - /without-prefix/batches
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-files
        paths:
          - /without-prefix/files
        methods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        strip_path: false
      - name: openai-batches-2
        paths:
          - /explicit/batches
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
plugins:
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: bedrock
      model_name_header: false
      targets:
        - auth:
            aws_access_key_id: '{vault://ai/aws-access-key-id}'
            aws_secret_access_key: '{vault://ai/aws-secret-access-key}'
          description: batch-api
          logging:
            log_payloads: false
            log_statistics: true
          model:
            name: batch-api
            options:
              bedrock:
                aws_region: us-east-1
                batch_bucket_prefix: s3://kong-bedrock-batches/jobs/
            provider: bedrock
          route_type: llm/v1/batches
    route: bedrock-batches
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      model_name_header: false
      targets:
        - description: gpt-5.4
          logging:
            log_payloads: false
            log_statistics: false
          model:
            name: gpt-5.4
            provider: openai
          route_type: llm/v1/batches
    route: openai-batches
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      model_name_header: false
      targets:
        - description: gpt-5.4
          logging:
            log_payloads: false
            log_statistics: true
          model:
            name: gpt-5.4
            provider: openai
          route_type: llm/v1/files
    route: openai-files
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      model_name_header: false
      targets:
        - description: gpt-5.4
          logging:
            log_payloads: false
            log_statistics: false
          model:
            name: gpt-5.4
            provider: openai
          route_type: llm/v1/batches
    route: openai-batches-2
ai_models:
  - name: with-prefix
  - name: without-prefix
  - name: explicit
