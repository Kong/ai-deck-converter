_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: bedrock-batches
        paths:
          - ~/with-prefix/model-invocation-jobs?(?:/[^/]+(?:/stop)?)?
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-batches
        paths:
          - /without-prefix/batches
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-files
        paths:
          - /without-prefix/files
        methods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        strip_path: false
      - name: openai-batches-2
        paths:
          - /explicit/batches
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-explicit
        paths:
          - /explicit/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-with-prefix
        paths:
          - /with-prefix/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-without-prefix
        paths:
          - /without-prefix/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
plugins:
  - id: a68490bd-48d5-5bde-9990-c89554b37bbf
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: bedrock
      model_name_header: false
      targets:
        - auth:
            aws_access_key_id: '{vault://ai/aws-access-key-id}'
            aws_secret_access_key: '{vault://ai/aws-secret-access-key}'
          description: batch-api
          logging:
            log_payloads: false
            log_statistics: true
          model:
            name: batch-api
            options:
              bedrock:
                aws_region: us-east-1
                batch_bucket_prefix: s3://kong-bedrock-batches/jobs/
            provider: bedrock
          route_type: llm/v1/batches
    route: bedrock-batches
  - id: 0bd6f0d8-5869-5957-a257-a6987c2b4aa8
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      model_name_header: false
      targets:
        - description: gpt-5.4
          logging:
            log_payloads: false
            log_statistics: false
          model:
            name: gpt-5.4
            provider: openai
          route_type: llm/v1/batches
    route: openai-batches
  - id: 44c3bb4a-6076-5149-88a3-36203518bb20
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      model_name_header: false
      targets:
        - description: gpt-5.4
          logging:
            log_payloads: false
            log_statistics: true
          model:
            name: gpt-5.4
            provider: openai
          route_type: llm/v1/files
    route: openai-files
  - id: 1e7a9113-b2a2-51a4-8f5d-a12653f0c0b0
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      model_name_header: false
      targets:
        - description: gpt-5.4
          logging:
            log_payloads: false
            log_statistics: false
          model:
            name: gpt-5.4
            provider: openai
          route_type: llm/v1/batches
    route: openai-batches-2
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 0bd6f0d8-5869-5957-a257-a6987c2b4aa8
          - plugin_id: 1e7a9113-b2a2-51a4-8f5d-a12653f0c0b0
          - plugin_id: 44c3bb4a-6076-5149-88a3-36203518bb20
          - plugin_id: a68490bd-48d5-5bde-9990-c89554b37bbf
      route_type: llm/v1/models
    route: models
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 1e7a9113-b2a2-51a4-8f5d-a12653f0c0b0
      route_type: llm/v1/models
    route: models-explicit
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: a68490bd-48d5-5bde-9990-c89554b37bbf
      route_type: llm/v1/models
    route: models-with-prefix
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 0bd6f0d8-5869-5957-a257-a6987c2b4aa8
          - plugin_id: 44c3bb4a-6076-5149-88a3-36203518bb20
      route_type: llm/v1/models
    route: models-without-prefix
ai_models:
  - name: with-prefix
  - name: without-prefix
  - name: explicit
