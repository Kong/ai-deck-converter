- code: BEHAVIOR_MAY_DIFFER
  reason: 'model "smart" shares route "openai-responses-lifecycle" with model "fast", which has different policies or ACLs. That route serves every Responses request, including the create that carries a model. No ai-model-selector runs on it, so its policies and ACLs cannot be scoped per model: model "fast" has none, so no policy or ACL is enforced there.'
  source:
    kind: model
    name: smart
    fields:
