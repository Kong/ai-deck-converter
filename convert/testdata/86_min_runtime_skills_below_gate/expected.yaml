_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-files
        paths:
          - /files/files
        methods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        strip_path: false
plugins:
  - id: 5cd102e7-3ff7-5e45-8aac-2442352e3605
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      model_name_header: false
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/openai-token}'
          description: gpt-5.6
          logging:
            log_payloads: false
            log_statistics: true
          model:
            name: gpt-5.6
            provider: openai
          route_type: llm/v1/files
    route: openai-files
ai_models:
  - name: openai-files-api
