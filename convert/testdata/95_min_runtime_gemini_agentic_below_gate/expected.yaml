_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: gemini-generate
        paths:
          - ~/generate/v1beta/models/(?<model_name>[^:/]+):(?:generateContent|streamGenerateContent)
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: gemini-enterprise-generate
        paths:
          - ~/generate/v1/projects/(?<project_id>[^/]+)/locations/(?<location_id>[^/]+)/publishers/(?<publisher>[^/]+)/models/(?<model_name>[^:/]+):(?:generateContent|streamGenerateContent)
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - path_pattern: 'models/([%w%.%-]+):'
          source: path
    route: gemini-generate
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: gemini
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/gemini-token}'
          description: gemini-2.5-pro
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: gemini-generate
            name: gemini-2.5-pro
            provider: gemini
          route_type: llm/v1/chat
    route: gemini-generate
    model: gemini-generate
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - path_pattern: 'models/([%w%.%-]+):'
          source: path
    route: gemini-enterprise-generate
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: gemini
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/gemini-token}'
          description: gemini-2.5-pro
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: gemini-generate
            name: gemini-2.5-pro
            provider: gemini
          route_type: llm/v1/chat
    route: gemini-enterprise-generate
    model: gemini-generate
ai_models:
  - name: gemini-generate
