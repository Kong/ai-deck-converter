# Gemini's agentic capability needs 2.3. At 2.2 the agentic model is absent
# with an error. The generate model still converts.
models:
  - name: gemini-agentic
    type: model
    capabilities: [agentic]
    formats: [{type: gemini}]
    config:
      route: {paths: [/agentic]}
    targets:
      - name: gemini-2.5-pro
        provider: gemini-prod
        config: {type: gemini}
  - name: gemini-generate
    type: model
    capabilities: [generate]
    formats: [{type: gemini}]
    config:
      route: {paths: [/generate]}
    targets:
      - name: gemini-2.5-pro
        provider: gemini-prod
        config: {type: gemini}
model_providers:
  - name: gemini-prod
    type: gemini
    config:
      auth:
        type: basic
        headers:
          - name: Authorization
            value: "{vault://ai/gemini-token}"
