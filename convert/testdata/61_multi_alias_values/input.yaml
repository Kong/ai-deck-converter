models:
  # A model with multiple config.route.model.values aliases: every alias is a
  # name a client can use to select the model. The converter fans the model
  # out into one ai-models entry and one ai-proxy-advanced plugin per alias.
  - name: multi-alias-model
    type: model
    capabilities: [generate]
    formats: [{type: openai}]
    config:
      route:
        paths: [/ai]
        model:
          values:
            - "@kong/openai"
            - "@kong/the-openai-model"
            - "@kong/openai-model"
            - "@kong/chat-gpt"
    targets:
      - name: gpt-5
        provider: openai-provider
        config: {type: openai}

model_providers:
  - name: openai-provider
    type: openai
