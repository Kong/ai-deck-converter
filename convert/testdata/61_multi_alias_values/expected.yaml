_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /ai/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-ai
        paths:
          - /ai/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - id: 54cf58c1-d63f-500a-882f-7fd69f541128
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - description: gpt-5
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: '@kong/openai'
            name: gpt-5
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: '@kong/openai'
  - id: a75b02d2-678c-5380-8758-526c599726f1
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - description: gpt-5
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: '@kong/the-openai-model'
            name: gpt-5
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: '@kong/the-openai-model'
  - id: 2915bafc-7a41-5499-bc3c-bad1a748816f
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - description: gpt-5
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: '@kong/openai-model'
            name: gpt-5
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: '@kong/openai-model'
  - id: cc9a9af5-f234-5a23-886a-5ddb77e1fdf2
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - description: gpt-5
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: '@kong/chat-gpt'
            name: gpt-5
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: '@kong/chat-gpt'
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 2915bafc-7a41-5499-bc3c-bad1a748816f
          - plugin_id: 54cf58c1-d63f-500a-882f-7fd69f541128
          - plugin_id: a75b02d2-678c-5380-8758-526c599726f1
          - plugin_id: cc9a9af5-f234-5a23-886a-5ddb77e1fdf2
      route_type: llm/v1/models
    route: models
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 2915bafc-7a41-5499-bc3c-bad1a748816f
          - plugin_id: 54cf58c1-d63f-500a-882f-7fd69f541128
          - plugin_id: a75b02d2-678c-5380-8758-526c599726f1
          - plugin_id: cc9a9af5-f234-5a23-886a-5ddb77e1fdf2
      route_type: llm/v1/models
    route: models-ai
ai_models:
  - name: '@kong/openai'
    tags:
      - ai-gateway-model-alias-group:@kong/openai
  - name: '@kong/the-openai-model'
    tags:
      - ai-gateway-model-alias-group:@kong/openai
  - name: '@kong/openai-model'
    tags:
      - ai-gateway-model-alias-group:@kong/openai
  - name: '@kong/chat-gpt'
    tags:
      - ai-gateway-model-alias-group:@kong/openai
