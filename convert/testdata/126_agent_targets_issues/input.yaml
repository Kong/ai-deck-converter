agents:
  - name: both
    type: http
    display_name: Both
    config:
      url: http://a.internal
      targets:
        - address: a.internal:80
      route:
        paths: [/both]
  - name: tls
    type: http
    display_name: Tls
    config:
      targets:
        - address: b.internal:443
      route:
        paths: [/tls]
