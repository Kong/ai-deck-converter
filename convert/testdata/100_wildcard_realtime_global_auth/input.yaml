# A global authentication policy cannot protect a WebSocket route. Under
# "*", the model loses only its realtime endpoint, with no issue. Its
# protocols include ws and wss, so only the auth policy leaves it out.
models:
  - name: everything
    type: model
    capabilities: ["*"]
    formats: [{type: openai}]
    config:
      route: {paths: [/ai], protocols: [http, https, ws, wss]}
    targets:
      - name: gpt-5.4
        provider: openai-prod
model_providers:
  - name: openai-prod
    type: openai
    config:
      auth:
        type: bearer
        token: "{vault://ai/openai-key}"
policies:
  - type: key-auth
    name: org-key-auth
    global: true
    config:
      key_names: [x-api-key]
