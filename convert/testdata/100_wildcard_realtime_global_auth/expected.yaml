_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /ai/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-responses
        paths:
          - /ai/responses
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-audio-speech
        paths:
          - /ai/audio/speech
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-audio-transcribe
        paths:
          - /ai/audio/transcriptions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-audio-translate
        paths:
          - /ai/audio/translations
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-embeddings
        paths:
          - /ai/embeddings
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-images
        paths:
          - /ai/images/generations
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-skills
        paths:
          - /ai/skills
        methods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        strip_path: false
      - name: openai-videos
        paths:
          - /ai/videos
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-ai
        paths:
          - /ai/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: openai-videos-lifecycle
        paths:
          - /ai/videos
        methods:
          - GET
          - DELETE
        strip_path: false
        tags:
          - aigw:video-lifecycle
plugins:
  - name: key-auth
    config:
      key_names:
        - x-api-key
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - id: 481cafde-a96a-5112-8a4a-2f47bfaef0d0
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - description: gpt-5.4
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: everything
            name: gpt-5.4
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: everything
  - name: ai-model-selector
    config:
