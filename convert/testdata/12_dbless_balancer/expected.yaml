_format_version: "3.0"
_transform: false
services:
  - id: 947a4e23-b483-5a65-8165-da9aed24565b
    name: ai-gateway
    url: http://ai-gateway.upstream.local
    host: ai-gateway.upstream.local
    port: 80
    protocol: http
routes:
  - id: 8ae36805-da7a-55b9-b056-72bde6bb937d
    name: openai-chat
    service:
      id: 947a4e23-b483-5a65-8165-da9aed24565b
    paths:
      - /v1/chat/completions/chat/completions
      - /v1/embeddings/chat/completions
    hosts:
      - ai.example.com
      - ai-internal.example.com
    methods:
      - GET
      - POST
    protocols:
      - http
      - https
    headers:
      x-api-version:
        - v1
        - v2
    snis:
      - ai.example.com
      - ai-internal.example.com
    sources:
      - ip: 192.168.1.0/24
        port: 8080
      - ip: 192.168.2.0/24
        port: 8081
    destinations:
      - ip: 10.1.0.0/16
        port: 443
      - ip: 10.2.0.0/16
        port: 8443
    strip_path: true
    preserve_host: false
    https_redirect_status_code: 426
    regex_priority: 0
    path_handling: v0
    request_buffering: true
    response_buffering: true
    tags:
      - team-ai
      - env-production
  - id: 0da1097c-6edc-5c9c-a032-cd042d0db5e4
    name: openai-embeddings
    service:
      id: 947a4e23-b483-5a65-8165-da9aed24565b
    paths:
      - /v1/chat/completions/embeddings
      - /v1/embeddings/embeddings
    hosts:
      - ai.example.com
      - ai-internal.example.com
    methods:
      - GET
      - POST
    protocols:
      - http
      - https
    headers:
      x-api-version:
        - v1
        - v2
    snis:
      - ai.example.com
      - ai-internal.example.com
    sources:
      - ip: 192.168.1.0/24
        port: 8080
      - ip: 192.168.2.0/24
        port: 8081
    destinations:
      - ip: 10.1.0.0/16
        port: 443
      - ip: 10.2.0.0/16
        port: 8443
    strip_path: true
    preserve_host: false
    https_redirect_status_code: 426
    regex_priority: 0
    path_handling: v0
    request_buffering: true
    response_buffering: true
    tags:
      - team-ai
      - env-production
  - id: aeea4f5f-1d07-59ad-98b1-be41cf62b11c
    name: models
    service:
      id: 947a4e23-b483-5a65-8165-da9aed24565b
    paths:
      - /v1/models
    methods:
      - GET
    protocols:
      - http
      - https
  - id: 6d810826-945f-50ac-af3f-e5a6ba04aea0
    name: models-v1-chat-completions
    service:
      id: 947a4e23-b483-5a65-8165-da9aed24565b
    paths:
      - /v1/chat/completions/v1/models
    methods:
      - GET
    protocols:
      - http
      - https
  - id: 1a1f2026-c208-5e16-b362-ba671f49fb59
    name: models-v1-embeddings
    service:
      id: 947a4e23-b483-5a65-8165-da9aed24565b
    paths:
      - /v1/embeddings/v1/models
    methods:
      - GET
    protocols:
      - http
      - https
plugins:
  - id: 17fa8192-4b9f-5b5a-8379-20ad8bc836a7
    name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route:
      id: 8ae36805-da7a-55b9-b056-72bde6bb937d
  - id: 9b2540c9-6620-5bbe-b947-d6127fb24c17
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: consistent-hashing
        connect_timeout: 60000
        fail_timeout: 10000
        failover_criteria:
          - error
          - timeout
          - http_429
          - http_500
        hash_on_header: X-Kong-LLM-Request-ID
        max_fails: 0
        read_timeout: 60000
        retries: 5
        slots: 10000
        write_timeout: 60000
      genai_category: text/generation
      llm_format: openai
      max_request_body_size: 8388608
      model_name_header: true
      response_streaming: allow
      targets:
        - description: gpt-4o
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: my-balancer-ch-model
            name: gpt-4o
            provider: openai
          route_type: llm/v1/chat
    route:
      id: 8ae36805-da7a-55b9-b056-72bde6bb937d
    model:
      id: aab20033-7c80-5942-aadc-52357371dbeb
  - id: dcebfb31-cc0f-5469-b6d7-9d8807a4e8d2
