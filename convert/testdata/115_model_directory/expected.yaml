_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /team-a/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-chat-2
        paths:
          - /team-b/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-team-a
        paths:
          - /team-a/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-team-b
        paths:
          - /team-b/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - id: c32e7c3e-b43c-56b9-bf90-d660df5cd572
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://env/openai-token}'
          description: gpt-5
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: alpha
            name: gpt-5
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: alpha
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat-2
  - id: 1f250e76-8c30-5683-ae6f-3fa719592a11
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://env/openai-token}'
          description: gpt-5-mini
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: beta
            name: gpt-5-mini
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat-2
    model: beta
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - access:
              deny:
                - contractors
            plugin_id: c32e7c3e-b43c-56b9-bf90-d660df5cd572
          - plugin_id: 1f250e76-8c30-5683-ae6f-3fa719592a11
      route_type: llm/v1/models
    route: models
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - access:
              deny:
                - contractors
            plugin_id: c32e7c3e-b43c-56b9-bf90-d660df5cd572
      route_type: llm/v1/models
    route: models-team-a
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 1f250e76-8c30-5683-ae6f-3fa719592a11
      route_type: llm/v1/models
    route: models-team-b
  - name: acl
    config:
      deny:
        - contractors
      include_consumer_groups: true
    route: openai-chat
    model: alpha
ai_models:
  - name: alpha
  - name: beta
