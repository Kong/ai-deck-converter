models:
  - type: model
    display_name: Derived Strategy Model
    name: derived-strategy-model
    capabilities: [generate]
    formats: [{type: openai}]
    targets:
      - name: gpt-4o
        provider: openai-main
        config: {type: openai}
    policies: [semantic-cache]
    config:
      route: {paths: [/derived-strategy]}
model_providers:
  - type: openai
    display_name: OpenAI Main
    name: openai-main
    config:
      auth:
        type: basic
        headers: [{name: Authorization, value: "{vault://env/openai-key}"}]
policies:
  - type: ai-semantic-cache
    name: semantic-cache
    config:
      vectordb:
        dimensions: 1536
        distance_metric: cosine
        threshold: 0.9
    datastore: [pgvector-ds]
datastores:
  - type: vectordb
    name: pgvector-ds
    config:
      database: kong-pgvector
      host: pgvector.internal
      password: "{vault://env/pgvector-password}"
      port: 5432
      ssl: true
      user: kong
vaults:
  - type: env
    name: env-vault
    description: Environment secrets
    config:
      prefix: KONG_
