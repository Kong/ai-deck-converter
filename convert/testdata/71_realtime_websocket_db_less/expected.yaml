_format_version: "3.0"
_transform: false
services:
  - id: 947a4e23-b483-5a65-8165-da9aed24565b
    name: ai-gateway
    url: http://ai-gateway.upstream.local
    host: ai-gateway.upstream.local
    port: 80
    protocol: http
  - id: 81558bc1-3a1b-5dd1-b985-f764a06e74c3
    name: ai-gateway-websocket
    url: ws://ai-gateway.upstream.local
    host: ai-gateway.upstream.local
    port: 80
    protocol: ws
routes:
  - id: 8ae36805-da7a-55b9-b056-72bde6bb937d
    name: openai-chat
    service:
      id: 947a4e23-b483-5a65-8165-da9aed24565b
    paths:
      - /mixed/chat/completions
    methods:
      - POST
      - OPTIONS
    protocols:
      - http
      - https
    strip_path: false
  - id: aeea4f5f-1d07-59ad-98b1-be41cf62b11c
    name: models
    service:
      id: 947a4e23-b483-5a65-8165-da9aed24565b
    paths:
      - /v1/models
    methods:
      - GET
    protocols:
      - http
      - https
  - id: e0980ed9-920f-5cc8-9415-3b9feb54f7f3
    name: models-mixed
    service:
      id: 947a4e23-b483-5a65-8165-da9aed24565b
    paths:
      - /mixed/v1/models
    methods:
      - GET
    protocols:
      - http
      - https
  - id: b2ed74bc-70de-5c05-98a5-1ff4f804ad51
    name: openai-realtime
    service:
      id: 81558bc1-3a1b-5dd1-b985-f764a06e74c3
    paths:
      - /mixed/realtime
    protocols:
      - ws
      - wss
    strip_path: false
plugins:
  - id: 17fa8192-4b9f-5b5a-8379-20ad8bc836a7
    name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route:
      id: 8ae36805-da7a-55b9-b056-72bde6bb937d
  - id: 21dd5f7e-9940-5537-9812-76fb7738f1ce
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://env/openai-key}'
          description: gpt-realtime
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: mixed-realtime
            name: gpt-realtime
            provider: openai
          route_type: llm/v1/chat
    route:
      id: 8ae36805-da7a-55b9-b056-72bde6bb937d
    model:
      id: bdb67c7a-33a3-5664-a801-be7b64f9516e
  - id: ca80bae8-9d95-5ded-89a1-7c644275b69d
    name: ai-proxy-advanced
    protocols:
      - ws
      - wss
    config:
      balancer:
        algorithm: round-robin
      genai_category: realtime/generation
      llm_format: openai
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://env/openai-key}'
          description: gpt-realtime
          logging:
            log_payloads: false
            log_statistics: true
          model:
            name: gpt-realtime
            provider: openai
          route_type: realtime/v1/realtime
    route:
      id: b2ed74bc-70de-5c05-98a5-1ff4f804ad51
    tags:
      - ai-gateway-realtime-model:mixed-realtime
  - id: 75ff22ed-6245-594b-895f-6a9fa36f4581
    name: ai-proxy-advanced
    config:
      models:
        sources:
          - access:
              allow:
                - premium-users
            plugin_id: 21dd5f7e-9940-5537-9812-76fb7738f1ce
          - access:
              allow:
                - premium-users
            plugin_id: ca80bae8-9d95-5ded-89a1-7c644275b69d
      route_type: llm/v1/models
    route:
      id: aeea4f5f-1d07-59ad-98b1-be41cf62b11c
  - id: 12106a5c-cbd2-5942-8432-ef9bc4adca1b
    name: ai-proxy-advanced
    config:
      models:
        sources:
          - access:
              allow:
                - premium-users
            plugin_id: 21dd5f7e-9940-5537-9812-76fb7738f1ce
          - access:
              allow:
                - premium-users
            plugin_id: ca80bae8-9d95-5ded-89a1-7c644275b69d
      route_type: llm/v1/models
    route:
      id: e0980ed9-920f-5cc8-9415-3b9feb54f7f3
  - id: 686423ce-18e4-505b-8697-73b683a022da
    name: acl
    config:
      allow:
        - premium-users
      include_consumer_groups: true
    route:
      id: 8ae36805-da7a-55b9-b056-72bde6bb937d
    model:
      id: bdb67c7a-33a3-5664-a801-be7b64f9516e
  - id: 509b86a4-d650-5125-8f69-105b25bd0f9e
    name: acl
    protocols:
      - ws
      - wss
    config:
      allow:
        - premium-users
      include_consumer_groups: true
    route:
      id: b2ed74bc-70de-5c05-98a5-1ff4f804ad51
ai_models:
  - id: bdb67c7a-33a3-5664-a801-be7b64f9516e
    name: mixed-realtime
