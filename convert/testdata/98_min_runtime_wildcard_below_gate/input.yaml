# At 2.1, "*" leaves out the typesafe format and the skills capability with
# one warning per model, although each model has two targets. An explicit
# capability that only a gated format serves fails its model.
models:
  - name: all-formats
    capabilities: [generate]
    formats: [{type: "*"}]
    config:
      route: {paths: [/ai]}
    targets:
      - name: gpt-5.6
        provider: openai-prod
        config: {type: openai}
      - name: gpt-5.6-mini
        provider: openai-prod
        config: {type: openai}
  - name: api
    type: api
    capabilities: ["*"]
    formats: [{type: anthropic}]
    config:
      route: {paths: [/api]}
    targets:
      - name: claude-opus-5
        provider: anthropic-prod
        config: {type: anthropic}
      - name: claude-sonnet-5
        provider: anthropic-prod
        config: {type: anthropic}
  - name: decisions
    capabilities: [decisions]
    formats: [{type: "*"}]
    config:
      route: {paths: [/decisions]}
    targets:
      - name: gpt-5.6
        provider: openai-prod
        config: {type: openai}
model_providers:
  - name: openai-prod
    type: openai
    config:
      auth:
        type: basic
        headers:
          - name: Authorization
            value: "{vault://ai/openai-token}"
  - name: anthropic-prod
    type: anthropic
    config:
      auth:
        type: basic
        headers:
          - name: x-api-key
            value: "{vault://ai/anthropic-key}"
