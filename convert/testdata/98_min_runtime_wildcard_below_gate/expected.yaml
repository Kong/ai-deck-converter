_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /ai/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: anthropic-messages
        paths:
          - /ai/v1/messages
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: bedrock-converse
        paths:
          - ~/ai/model/(?<model_name>[^/]+)/converse(?:-stream)?
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: bedrock-invoke
        paths:
          - ~/ai/model/(?<model_name>[^/]+)/invoke(?:-with-response-stream)?
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: bedrock-chat
        paths:
          - /ai/openai/v1/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: bedrock-messages
        paths:
          - /ai/anthropic/v1/messages
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: gemini-generate
        paths:
          - ~/ai/v1beta/models/(?<model_name>[^:/]+):(?:generateContent|streamGenerateContent)
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: gemini-enterprise-generate
        paths:
          - ~/ai/v1/projects/(?<project_id>[^/]+)/locations/(?<location_id>[^/]+)/publishers/(?<publisher>[^/]+)/models/(?<model_name>[^:/]+):(?:generateContent|streamGenerateContent)
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: huggingface-generate
        paths:
          - /ai/v1/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: anthropic-batches
        paths:
          - /api/v1/messages/batches
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/openai-token}'
          description: gpt-5.6
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: all-formats
            name: gpt-5.6
            provider: openai
          route_type: llm/v1/chat
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/openai-token}'
          description: gpt-5.6-mini
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: all-formats
            name: gpt-5.6-mini
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: all-formats
