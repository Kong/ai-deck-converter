_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /ai/chat/completions
        methods:
          - POST
        strip_path: false
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            aws_access_key_id: '{vault://env/aws-key-id}'
            aws_secret_access_key: '{vault://env/aws-secret}'
            aws_session_token: '{vault://env/aws-session-token}'
            gcp_workload_identity_federation_auth_json: '{vault://ai/gcp-auth-json}'
            gcp_workload_identity_federation_source: aws-iam
          description: gpt-4o-on-gemini
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: gemini-federated-aws-iam
            name: gpt-4o-on-gemini
            options:
              bedrock:
                aws_assume_role_arn: arn:aws:iam::123:role/bedrock
                aws_region: us-east-1
                aws_role_session_name: kong-session
                aws_sts_endpoint_url: https://sts.us-east-1.amazonaws.com
              gemini:
                api_endpoint: us-central1-aiplatform.googleapis.com
                location_id: us-central1
                project_id: my-project-id
              upstream_url: https://generativelanguage.googleapis.com
            provider: gemini
          route_type: llm/v1/chat
    route: openai-chat
    model: gemini-federated-aws-iam
ai_models:
  - name: gemini-federated-aws-iam
