_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /mantle/v1/chat/completions
          - /mantle/openai/v1/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: bedrock-converse
        paths:
          - ~/runtime/model/(?<model_name>[^/]+)/converse(?:-stream)?
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: bedrock-invoke
        paths:
          - ~/runtime/model/(?<model_name>[^/]+)/invoke(?:-with-response-stream)?
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: bedrock-chat
        paths:
          - /runtime/openai/v1/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: bedrock-messages
        paths:
          - /runtime/anthropic/v1/messages
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-mantle
        paths:
          - /mantle/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-runtime
        paths:
          - /runtime/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - id: 90a4e109-b00a-5864-9571-fdeff0195414
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            aws_access_key_id: '{vault://ai/aws-access-key-id}'
            aws_secret_access_key: '{vault://ai/aws-secret-access-key}'
          description: anthropic.claude-sonnet-4-5
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: claude-mantle
            name: anthropic.claude-sonnet-4-5
            options:
              anthropic_version: bedrock-2023-05-31
              bedrock:
                aws_region: us-east-1
                endpoint_type: mantle
                mantle_openai_path_prefix: auto_detect
                vpc_endpoint: vpce-0abc123-xyz.bedrock-mantle.us-east-1.vpce.amazonaws.com
            provider: bedrock
          route_type: llm/v1/chat
    route: openai-chat
    model: claude-mantle
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - path_pattern: model/([^/]+)/
          source: path
    route: bedrock-converse
  - id: 8bae2929-09c2-569a-97ed-c8901e76f4f3
