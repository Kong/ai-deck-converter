_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /mantle/chat/completions
        methods:
          - POST
        strip_path: false
      - name: bedrock-converse
        paths:
          - ~/runtime/model/(?<model_name>[^/]+)/converse(?:-stream)?
        methods:
          - GET
          - POST
        strip_path: false
      - name: bedrock-invoke
        paths:
          - ~/runtime/model/(?<model_name>[^/]+)/invoke(?:-with-response-stream)?
        methods:
          - GET
          - POST
        strip_path: false
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            aws_access_key_id: '{vault://ai/aws-access-key-id}'
            aws_secret_access_key: '{vault://ai/aws-secret-access-key}'
          description: anthropic.claude-sonnet-4-5
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: claude-mantle
            name: anthropic.claude-sonnet-4-5
            options:
              anthropic_version: bedrock-2023-05-31
              bedrock:
                aws_region: us-east-1
                endpoint_type: mantle
                vpc_endpoint: vpce-0abc123-xyz.bedrock-mantle.us-east-1.vpce.amazonaws.com
            provider: bedrock
          route_type: llm/v1/chat
    route: openai-chat
    model: claude-mantle
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - path_pattern: model/([^/]+)/
          source: path
    route: bedrock-converse
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: bedrock
      targets:
        - auth:
            aws_access_key_id: '{vault://ai/aws-access-key-id}'
            aws_secret_access_key: '{vault://ai/aws-secret-access-key}'
          description: anthropic.claude-sonnet-4-5
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: claude-runtime
            name: anthropic.claude-sonnet-4-5
            options:
              anthropic_version: bedrock-2023-05-31
              bedrock:
                aws_region: us-east-1
                endpoint_type: runtime
                vpc_endpoint: vpce-0abc123-xyz.bedrock-runtime.us-east-1.vpce.amazonaws.com
            provider: bedrock
          route_type: llm/v1/chat
    route: bedrock-converse
    model: claude-runtime
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - path_pattern: model/([^/]+)/
          source: path
    route: bedrock-invoke
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: bedrock
      targets:
        - auth:
            aws_access_key_id: '{vault://ai/aws-access-key-id}'
            aws_secret_access_key: '{vault://ai/aws-secret-access-key}'
          description: anthropic.claude-sonnet-4-5
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: claude-runtime
            name: anthropic.claude-sonnet-4-5
            options:
              anthropic_version: bedrock-2023-05-31
              bedrock:
                aws_region: us-east-1
                endpoint_type: runtime
                vpc_endpoint: vpce-0abc123-xyz.bedrock-runtime.us-east-1.vpce.amazonaws.com
            provider: bedrock
          route_type: llm/v1/chat
    route: bedrock-invoke
    model: claude-runtime
ai_models:
  - name: claude-mantle
  - name: claude-runtime
