# An MCP server's openid-connect strategy + access.metadata lowers to the
# openid-connect plugin itself: strategy config verbatim (the
# principals block in particular, which ai-mcp-oauth2 cannot represent), the
# metadata becoming the plugin's protected_resource_metadata block, and
# auth_methods forced to bearer (ai-mcp-oauth2 parity). The strategy's full
# auth_methods list and the metadata discovery_endpoint are warned and dropped.
auth_strategies:
  - display_name: Okta OIDC
    name: okta-oidc
    type: openid-connect
    config:
      issuer: https://dev-123456.okta.com/oauth2/default
      client_id: [mcp-client]
      client_secret: ["{vault://ai-vault/okta-client-secret}"]
      scopes: [openid, profile]
      # Interactive flows are warned and overridden to [bearer] on MCP routes.
      auth_methods: [authorization_code, bearer, client_credentials, password, introspection, userinfo, kong_oauth2, refresh_token, session]
      # Carried verbatim.
      cache_tokens_salt: pepper
      principals:
        enabled: true
        directory: my-directory
        principal_claim: [sub]
        error_on_miss: true
        jit:
          all_claims: true
mcp_servers:
  - type: passthrough-listener
    display_name: Flights MCP
    name: flights-mcp
    upstream_url: https://vendor.example.com/mcp
    config:
      route:
        paths: [/mcp/flights]
    access:
      auth_strategies: [okta-oidc]
      metadata:
        endpoint: /mcp/flights/.well-known/oauth-protected-resource
        # No openid-connect target: warned and dropped.
        discovery_endpoint: https://as.example.com/.well-known/oauth-protected-resource
        resource: https://api.example.com/mcp/flights
        authorization_servers:
          - https://dev-123456.okta.com/oauth2/default
        scopes_supported: [openid, flights:read]
    tools:
      - name: searchFlights
        description: Search available flights
        method: GET
        path: /flights
        scheme: https
        host: flights.internal
