_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - ~/openai/(?<openai_model>[^:/]+)/chat/completions
          - ~/alternative/path/(?<openai_model>[^:/]+)/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-responses
        paths:
          - ~/openai/(?<openai_model>[^:/]+)/responses
          - ~/alternative/path/(?<openai_model>[^:/]+)/responses
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-alternative-path-openai-model
        paths:
          - ~/alternative/path/(?<openai_model>[^:/]+)/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-openai-openai-model
        paths:
          - ~/openai/(?<openai_model>[^:/]+)/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - pcre_capture_name: openai_model
          pcre_pattern: ~/openai/(?<openai_model>[^:/]+)
          source: path
        - pcre_capture_name: openai_model
          pcre_pattern: ~/alternative/path/(?<openai_model>[^:/]+)
          source: path
    route: openai-chat
  - id: 78fcb6e1-6d9a-5c47-8b05-bd178d922d4b
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      max_request_body_size: 2097152
      response_streaming: deny
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/openai-token}'
          description: gpt-4o
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: full-model
            name: gpt-4o
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: full-model
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - pcre_capture_name: openai_model
          pcre_pattern: ~/openai/(?<openai_model>[^:/]+)
          source: path
        - pcre_capture_name: openai_model
          pcre_pattern: ~/alternative/path/(?<openai_model>[^:/]+)
          source: path
    route: openai-responses
  - id: ac143bf3-cb10-58fe-89b1-90354ce8fabb
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      max_request_body_size: 2097152
      response_streaming: deny
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/openai-token}'
          description: gpt-4o
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: full-model
            name: gpt-4o
            provider: openai
          route_type: llm/v1/responses
    route: openai-responses
    model: full-model
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 78fcb6e1-6d9a-5c47-8b05-bd178d922d4b
          - plugin_id: ac143bf3-cb10-58fe-89b1-90354ce8fabb
      route_type: llm/v1/models
    route: models
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 78fcb6e1-6d9a-5c47-8b05-bd178d922d4b
          - plugin_id: ac143bf3-cb10-58fe-89b1-90354ce8fabb
      route_type: llm/v1/models
    route: models-alternative-path-openai-model
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 78fcb6e1-6d9a-5c47-8b05-bd178d922d4b
          - plugin_id: ac143bf3-cb10-58fe-89b1-90354ce8fabb
      route_type: llm/v1/models
    route: models-openai-openai-model
ai_models:
  - name: full-model
