_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /ai/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
plugins:
  - name: ai-sanitizer
    config:
      anonymize:
        - all_and_credentials
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/openai-token}'
          description: gpt-4o
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: sanitized-gpt
            name: gpt-4o
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: sanitized-gpt
  - name: ai-sanitizer
    config:
      anonymize:
        - email
        - all_and_credentials
        - phone
    route: openai-chat
    model: sanitized-gpt
  - name: ai-sanitizer
    config:
      anonymize:
        - all
        - email
    route: openai-chat
    model: sanitized-gpt
ai_models:
  - name: sanitized-gpt
