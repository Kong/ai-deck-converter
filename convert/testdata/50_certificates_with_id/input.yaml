models:
  - type: model
    name: chat
    capabilities: [generate]
    formats: [{type: openai}]
    targets:
      - {name: gpt-4o, provider: openai-main, config: {type: openai}}

model_providers:
  - name: openai-main
    type: openai
    config:
      auth:
        header_name: Authorization
        header_value: Bearer sk-test

certificates:
  - id: cert-1-id
    name: upstream-tls
    cert: |
      -----BEGIN CERTIFICATE-----
      MIIBrsBgNVBAMMCnVwc3RyZWFtLTE=
      -----END CERTIFICATE-----
    key: |
      -----BEGIN PRIVATE KEY-----
      MIIBVAIBADANBgkqhkiG9w0BAQEFAA==
      -----END PRIVATE KEY-----
