# Two agentic models on one base path. The create route is shared, and the
# ai-model-selector tells their model-scoped plugins apart by the body model.
# The lifecycle route is shared too: its requests carry no model, so one
# route-scoped plugin merges both models' targets into the "<default>" pool.
# Both models resolve to the same provider, so a stored response ID is valid
# whichever target the balancer picks and nothing is reported.
models:
  - name: fast
    type: model
    capabilities: [agentic]
    formats: [{type: openai}]
    config:
      route: {paths: [/ai]}
    targets:
      - name: gpt-4.1-mini
        provider: openai-prod
  - name: smart
    type: model
    capabilities: [agentic]
    formats: [{type: openai}]
    config:
      route: {paths: [/ai]}
    targets:
      - name: gpt-4.1
        provider: openai-prod
model_providers:
  - name: openai-prod
    type: openai
    config:
      auth:
        type: bearer
        token: "{vault://ai/openai-key}"
