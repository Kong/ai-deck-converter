_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: bedrock-converse
        paths:
          - ~/ai/model/(?<model_name>[^/]+)/converse(?:-stream)?
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: bedrock-invoke
        paths:
          - ~/ai/model/(?<model_name>[^/]+)/invoke(?:-with-response-stream)?
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: bedrock-chat
        paths:
          - /ai/openai/v1/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: bedrock-messages
        paths:
          - /ai/anthropic/v1/messages
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: bedrock-retrieve
        paths:
          - ~/ai/model/(?<model_name>[^/]+)/retrieveAndGenerate(?:Stream)?
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: bedrock-rerank
        paths:
          - ~/ai/model/(?<model_name>[^/]+)/rerank
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - path_pattern: model/([^/]+)/
          source: path
    route: bedrock-converse
  - id: e9247dff-033e-5c66-96ff-83585d3ece96
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: bedrock
      targets:
        - auth:
            aws_access_key_id: '{vault://ai/aws-access-key-id}'
            aws_secret_access_key: '{vault://ai/aws-secret-access-key}'
          description: anthropic.claude-3-5-sonnet
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: claude-bedrock
            name: anthropic.claude-3-5-sonnet
            options:
              anthropic_version: bedrock-2023-05-31
              bedrock:
                aws_region: us-east-1
              max_tokens: 1024
            provider: bedrock
          route_type: llm/v1/chat
    route: bedrock-converse
    model: claude-bedrock
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - path_pattern: model/([^/]+)/
          source: path
    route: bedrock-invoke
