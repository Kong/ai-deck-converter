_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: gemini-batches
        paths:
          - /gm/v1beta/batches
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: gemini-enterprise-batches
        paths:
          - ~/gm/v1/projects/(?<project_id>[^/]+)/locations/(?<location_id>[^/]+)/batchPredictionJobs
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: gemini-batches-2
        paths:
          - /gm2/v1beta/batches
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: gemini-enterprise-batches-2
        paths:
          - ~/gm2/v1/projects/(?<project_id>[^/]+)/locations/(?<location_id>[^/]+)/batchPredictionJobs
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-gm
        paths:
          - /gm/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-gm2
        paths:
          - /gm2/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
plugins:
  - id: 2f02d5c7-5d88-55a0-91c2-43023c2fadfd
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: gemini
      model_name_header: false
      targets:
        - description: gemini-batch-target
          logging:
            log_payloads: false
            log_statistics: true
          model:
            name: gemini-batch-target
            provider: gemini
          route_type: llm/v1/batches
    route: gemini-batches
  - id: 0aa0cf08-ba3a-578b-b74c-b6380350194d
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: gemini
      model_name_header: false
      targets:
        - description: gemini-batch-target
          logging:
            log_payloads: false
            log_statistics: true
          model:
            name: gemini-batch-target
            provider: gemini
          route_type: llm/v1/batches
    route: gemini-enterprise-batches
  - id: 4a2caab4-f1c4-5a02-97cb-1c469599a177
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: gemini
      model_name_header: false
      targets:
        - auth:
            gcp_service_account_json: '{vault://ai/gcp-service-account-json}'
            gcp_use_service_account: true
          description: gemini-batch-target-2
          logging:
            log_payloads: false
            log_statistics: true
          model:
            name: gemini-batch-target-2
            provider: gemini
          route_type: llm/v1/batches
    route: gemini-batches-2
  - id: 2cfe906d-e7c1-5e62-a267-2361660f34d9
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: gemini
      model_name_header: false
      targets:
        - auth:
            gcp_service_account_json: '{vault://ai/gcp-service-account-json}'
            gcp_use_service_account: true
          description: gemini-batch-target-2
          logging:
            log_payloads: false
            log_statistics: true
          model:
            name: gemini-batch-target-2
            provider: gemini
          route_type: llm/v1/batches
    route: gemini-enterprise-batches-2
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 0aa0cf08-ba3a-578b-b74c-b6380350194d
          - plugin_id: 2cfe906d-e7c1-5e62-a267-2361660f34d9
          - plugin_id: 2f02d5c7-5d88-55a0-91c2-43023c2fadfd
          - plugin_id: 4a2caab4-f1c4-5a02-97cb-1c469599a177
      route_type: llm/v1/models
    route: models
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 0aa0cf08-ba3a-578b-b74c-b6380350194d
          - plugin_id: 2f02d5c7-5d88-55a0-91c2-43023c2fadfd
      route_type: llm/v1/models
    route: models-gm
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 2cfe906d-e7c1-5e62-a267-2361660f34d9
          - plugin_id: 4a2caab4-f1c4-5a02-97cb-1c469599a177
      route_type: llm/v1/models
    route: models-gm2
ai_models:
  - name: gemini-batches
  - name: gemini-batches-2
