_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: gemini-predict
        paths:
          - ~/img/v1/projects/(?<project_id>[^/]+)/locations/(?<location_id>[^/]+)/publishers/(?<publisher>[^/]+)/models/(?<model_name>[^:/]+):predict
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: gemini-predict-long-running
        paths:
          - ~/img/v1/projects/(?<project_id>[^/]+)/locations/(?<location_id>[^/]+)/publishers/(?<publisher>[^/]+)/models/(?<model_name>[^:/]+):predictLongRunning
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: gemini-generate
        paths:
          - ~/mix/v1beta/models/(?<model_name>[^:/]+):(?:generateContent|streamGenerateContent)
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: gemini-enterprise-generate
        paths:
          - ~/mix/v1/projects/(?<project_id>[^/]+)/locations/(?<location_id>[^/]+)/publishers/(?<publisher>[^/]+)/models/(?<model_name>[^:/]+):(?:generateContent|streamGenerateContent)
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: gemini-predict-2
        paths:
          - ~/mix/v1/projects/(?<project_id>[^/]+)/locations/(?<location_id>[^/]+)/publishers/(?<publisher>[^/]+)/models/(?<model_name>[^:/]+):predict
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: gemini-ranking
        paths:
          - ~/mix/v1/projects/(?<project_id>[^/]+)/locations/(?<location_id>[^/]+)/rankingConfigs/(?<config_name>[^:/]+):rank
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-img
        paths:
          - /img/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-mix
        paths:
          - /mix/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - path_pattern: 'models/([%w%.%-]+):'
          source: path
    route: gemini-predict
  - id: 269ee252-1236-504b-9e79-af134227282a
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: image/generation
      llm_format: gemini
      targets:
        - auth:
            gcp_service_account_json: '{vault://ai/gcp}'
            gcp_use_service_account: true
          description: imagen-4
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: imagen
            name: imagen-4
            provider: gemini
          route_type: image/v1/images/generations
    route: gemini-predict
    model: imagen
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - path_pattern: 'models/([%w%.%-]+):'
