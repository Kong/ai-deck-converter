# Gemini Enterprise-only gemini capabilities. image renders on :predict and video on
# :predictLongRunning — distinct routes, since one route's ai-proxy-advanced
# carries a single genai_category. rerank renders on the rankingConfigs :rank
# path, and generate emits both its Gemini and Gemini Enterprise routes. On revert, the
# image/video model's target appears only on Gemini Enterprise paths and comes back as a
# vertex provider; the mixed model's target is also on the Gemini generate
# route, so it comes back as gemini.
model_providers:
  - name: vx
    type: vertex
    config:
      auth:
        type: gcp
        service_account_json: "{vault://ai/gcp}"
models:
  - name: imagen
    type: model
    capabilities: [image, video]
    formats: [{type: gemini}]
    config: {route: {paths: [/img]}}
    targets: [{name: imagen-4, provider: vx, config: {type: vertex}}]
  - name: mixed
    type: model
    capabilities: [generate, image, rerank]
    formats: [{type: gemini}]
    config: {route: {paths: [/mix]}}
    targets: [{name: gemini-2.5, provider: vx, config: {type: vertex}}]
