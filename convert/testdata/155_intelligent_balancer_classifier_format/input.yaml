# The data plane adds the classifier format to the url. A host can serve
# System One at any path, so a given format passes through without a change.
# A block with no format gets /v1/systemone, the API default.
model_providers:
  - name: openai
    type: openai
    config:
      auth:
        type: basic
        headers:
          - name: Authorization
            value: "{vault://env/openai-key}"
models:
  - name: auto-openrouter
    capabilities: [generate]
    config:
      route: {paths: [/auto-openrouter]}
      balancer:
        algorithm: intelligent
        classifier:
          type: custom
          url: https://openrouter.ai
          format: /api/alpha/decisions
          name: typesafe/jev-1.13-20260917
          context_window: 32768
          auth:
            type: basic
            headers:
              - name: Authorization
                value: "{vault://env/openrouter-token}"
    targets:
      - {name: gpt-5-mini, provider: openai}
      - {name: gpt-5, provider: openai}
  - name: auto-bare-host
    capabilities: [generate]
    config:
      route: {paths: [/auto-bare-host]}
      balancer:
        algorithm: intelligent
        cost_quality_tradeoff: quality
        classifier:
          type: custom
          url: http://kev.internal:8009
          name: kev-latest
          context_window: 32768
    targets:
      - {name: gpt-5-mini, provider: openai}
      - {name: gpt-5, provider: openai}
