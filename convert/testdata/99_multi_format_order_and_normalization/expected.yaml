_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /order/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: gemini-generate
        paths:
          - ~/order/v1beta/models/(?<model_name>[^:/]+):(?:generateContent|streamGenerateContent)
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: gemini-enterprise-generate
        paths:
          - ~/order/v1/projects/(?<project_id>[^/]+)/locations/(?<location_id>[^/]+)/publishers/(?<publisher>[^/]+)/models/(?<model_name>[^:/]+):(?:generateContent|streamGenerateContent)
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: gemini-generate-2
        paths:
          - ~/vertex/v1beta/models/(?<model_name>[^:/]+):(?:generateContent|streamGenerateContent)
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: gemini-enterprise-generate-2
        paths:
          - ~/vertex/v1/projects/(?<project_id>[^/]+)/locations/(?<location_id>[^/]+)/publishers/(?<publisher>[^/]+)/models/(?<model_name>[^:/]+):(?:generateContent|streamGenerateContent)
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: gemini-embeddings
        paths:
          - ~/vertex/v1beta/models/(?<model_name>[^:/]+):(?:embedContent|batchEmbedContents)
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: gemini-enterprise-embeddings
        paths:
          - ~/vertex/v1/projects/(?<project_id>[^/]+)/locations/(?<location_id>[^/]+)/publishers/(?<publisher>[^/]+)/models/(?<model_name>[^:/]+):embedContent
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: gemini-predict
        paths:
          - ~/vertex/v1/projects/(?<project_id>[^/]+)/locations/(?<location_id>[^/]+)/publishers/(?<publisher>[^/]+)/models/(?<model_name>[^:/]+):predict
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: gemini-ranking
        paths:
          - ~/vertex/v1/projects/(?<project_id>[^/]+)/locations/(?<location_id>[^/]+)/rankingConfigs/(?<config_name>[^:/]+):rank
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: gemini-predict-long-running
        paths:
          - ~/vertex/v1/projects/(?<project_id>[^/]+)/locations/(?<location_id>[^/]+)/publishers/(?<publisher>[^/]+)/models/(?<model_name>[^:/]+):predictLongRunning
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-chat-2
        paths:
          - /skills/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: anthropic-messages
        paths:
          - /skills/v1/messages
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: anthropic-skills
        paths:
          - /skills/v1/skills
        methods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        strip_path: false
  - name: ai-gateway-websocket
    url: ws://ai-gateway.upstream.local
    routes:
      - name: gemini-realtime
        paths:
          - /vertex/realtime
        protocols:
          - ws
          - wss
        strip_path: false
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/openai-token}'
          description: gpt-5.6
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: order
            name: gpt-5.6
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: order
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - path_pattern: 'models/([%w%.%-]+):'
