# AG-2140. The OpenAI Responses API addresses retrieve, delete, input_items,
# cancel and compact by stored response ID, using GET and DELETE as well as
# POST, and sends no model with any of them. The agentic capability therefore
# emits two routes: the create route keeps the ai-model-selector, its model FK
# and its aliased target; the generated lifecycle route carries none of them,
# so its target stays in the balancer's "<default>" pool that a model-less
# request falls back to.
models:
  - name: gpt
    type: model
    capabilities: [generate, agentic]
    formats: [{type: openai}]
    config:
      route: {paths: [/ai]}
    targets:
      - name: gpt-4.1-mini
        provider: openai-prod
model_providers:
  - name: openai-prod
    type: openai
    config:
      auth:
        type: bearer
        token: "{vault://ai/openai-key}"
