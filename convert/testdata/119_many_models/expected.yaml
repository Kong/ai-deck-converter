        methods:
          - POST
          - OPTIONS
        protocols:
          - http
          - https
        strip_path: true
        preserve_host: false
        https_redirect_status_code: 426
        regex_priority: 0
        request_buffering: true
        response_buffering: true
      - name: typesafe-decisions
