          - ~/v1/systemone
        methods:
          - POST
          - OPTIONS
        protocols:
          - http
          - https
        headers:
          X-Client:
            - internal
        strip_path: true
        preserve_host: false
        https_redirect_status_code: 426
        regex_priority: 0
        request_buffering: true
        response_buffering: true
      - name: openai-chat-2
        paths:
          - /compat/chat/completions
        methods:
          - POST
          - OPTIONS
        protocols:
          - http
          - https
        strip_path: true
        preserve_host: false
        https_redirect_status_code: 426
        regex_priority: 0
        request_buffering: true
        response_buffering: true
      - name: openai-responses-2
        paths:
          - /compat/responses
        methods:
          - POST
          - OPTIONS
        protocols:
          - http
          - https
        strip_path: true
        preserve_host: false
