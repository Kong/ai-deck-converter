_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: anthropic-messages
        paths:
          - /v1/messages
        methods:
          - POST
          - OPTIONS
        protocols:
          - http
          - https
        strip_path: true
        preserve_host: false
        https_redirect_status_code: 426
        regex_priority: 0
        request_buffering: true
        response_buffering: true
      - name: anthropic-messages-2
        paths:
          - /v1/messages
        methods:
          - POST
          - OPTIONS
        protocols:
          - http
          - https
        headers:
          X-Client:
            - internal
        strip_path: true
        preserve_host: false
        https_redirect_status_code: 426
        regex_priority: 0
        request_buffering: true
        response_buffering: true
      - name: openai-chat
        paths:
          - /chat/completions
        methods:
          - POST
          - OPTIONS
        protocols:
          - http
          - https
        strip_path: true
        preserve_host: false
        https_redirect_status_code: 426
        regex_priority: 0
        request_buffering: true
        response_buffering: true
