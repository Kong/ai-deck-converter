          - https
      - name: models-team-b
        paths:
          - /team-b/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
consumers:
  - username: anonymous
    custom_id: anonymous
    plugins:
      - name: request-termination
        enabled: true
        config:
          message: Unauthorized
          status_code: 401
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: anthropic-messages
  - id: 3b7f795e-8e99-544b-8b8e-6bda269cd8c2
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: anthropic
      max_request_body_size: 8388608
      model_name_header: true
      response_streaming: allow
      targets:
        - auth:
            allow_override: false
            header_name: Authorization
            header_value: Bearer {vault://ai/provider-a-token}
          description: model-02
          logging:
            log_payloads: true
            log_statistics: true
          model:
            model_alias: model-02
            name: model-02
            options:
              anthropic_version: "2023-06-01"
            provider: anthropic
          route_type: llm/v1/chat
          weight: 100
    route: anthropic-messages
    model: model-02
