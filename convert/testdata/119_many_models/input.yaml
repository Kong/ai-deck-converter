# Many models on shared and header-split routes. They once gave false
# ROUTING_CONFLICT warnings. All names, hosts, and costs are placeholders.
model_providers:
  - name: provider-a
    type: anthropic
    config:
      auth:
        type: basic
        headers:
          - name: Authorization
            value: Bearer {vault://ai/provider-a-token}
  - name: provider-b
    type: anthropic
    config:
      auth:
        type: basic
        headers:
          - name: Authorization
            value: Bearer {vault://ai/provider-b-token}
  - name: provider-c
    type: openai
    config:
      auth:
        type: basic
        headers:
          - name: Authorization
            value: Bearer {vault://ai/provider-c-token}
  - name: provider-d
    type: typesafe
    config:
      auth:
        type: basic
        headers:
          - name: Authorization
            value: Bearer {vault://ai/provider-d-token}
  - name: provider-e
    type: openai
    config:
