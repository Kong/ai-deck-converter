            value: Bearer {vault://ai/provider-f-token}
  - name: provider-g
    type: xai
    config:
      auth:
        type: basic
        headers:
          - name: Authorization
            value: Bearer {vault://ai/provider-g-token}
  - name: provider-h
    type: anthropic
    config:
      auth:
        type: basic
        headers:
          - name: Authorization
            value: Bearer {vault://ai/provider-h-token}
auth_strategies:
  - name: api-key-auth
    type: key-auth
    config:
      key_names:
        - x-api-key
  - name: ci-oidc
    type: openid-connect
    config:
      issuer: https://ci.example.com
  - name: corp-sso
    type: openid-connect
    config:
      issuer: https://sso.example.com/oauth2/default
policies:
  - name: model-log
    type: pre-function
    config:
      access:
        - kong.log.info('model-auth')
  - name: health-check
    type: request-termination
    config:
      status_code: 200
      message: ok
models:
  - name: model-01
    display_name: model-01
    type: model
    enabled: true
    capabilities:
      - generate
    formats:
      - type: anthropic
    targets:
      - name: model-02
        provider: provider-a
        weight: 100
        allow_auth_override: false
        config:
          type: anthropic
          version: "2023-06-01"
    access:
      auth_strategies:
        - api-key-auth
        - corp-sso
    config:
      logging:
        payloads: true
      max_request_body_size: 8388608
      model:
        name_header: true
      response_streaming: allow
      route:
        https_redirect_status_code: 426
        model:
          body_param: model
          values:
            - model-02
        paths:
          - /
        preserve_host: false
        protocols:
          - http
          - https
        regex_priority: 0
        request_buffering: true
        response_buffering: true
        strip_path: true
