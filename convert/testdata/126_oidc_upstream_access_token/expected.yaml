_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /ai/self-hosted/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-chat-2
        paths:
          - /ai/hidden-token/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
  - name: booking-agent
    url: https://booking.internal/a2a
    routes:
      - name: booking-agent-route
        paths:
          - /agents/booking
        plugins:
          - name: openid-connect
            config:
              anonymous: anonymous
              issuer: https://dev-123456.okta.com/oauth2/default
              upstream_access_token_header: null
          - name: ai-a2a-proxy
            config:
              logging:
                log_payloads: false
                log_statistics: true
                max_payload_size: 1048576
consumers:
  - username: anonymous
    custom_id: anonymous
    plugins:
      - name: request-termination
        enabled: true
        config:
          message: Unauthorized
          status_code: 401
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/openai-token}'
          description: llama
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: self-hosted
            name: llama
            options:
              upstream_url: https://llm.internal/v1/chat/completions
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: self-hosted
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat-2
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/openai-token}'
          description: gpt-5.4
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: hidden-token
            name: gpt-5.4
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat-2
    model: hidden-token
  - name: openid-connect
    config:
      issuer: https://dev-123456.okta.com/oauth2/default
    route: openai-chat
  - name: openid-connect
    config:
      issuer: https://dev-123456.okta.com/oauth2/default
      upstream_access_token_header: null
    route: openai-chat-2
ai_models:
  - name: self-hosted
  - name: hidden-token
