_format_version: "3.0"
services:
  - name: ai-gateway-websocket
    url: ws://ai-gateway.upstream.local
    routes:
      - name: gemini-realtime
        paths:
          - /ai/realtime
        protocols:
          - ws
          - wss
        strip_path: false
plugins:
  - name: ai-proxy-advanced
    protocols:
      - ws
      - wss
    config:
      balancer:
        algorithm: round-robin
      genai_category: realtime/generation
      llm_format: gemini
      targets:
        - auth:
            header_name: x-goog-api-key
            header_value: '{vault://ai/gemini-key}'
          description: gemini-3.1-flash-live-preview
          logging:
            log_payloads: false
            log_statistics: true
          model:
            name: gemini-3.1-flash-live-preview
            provider: gemini
          route_type: realtime/v1/realtime
    route: gemini-realtime
    tags:
      - ai-gateway-realtime-model:gemini-live
ai_models:
  - name: gemini-live
