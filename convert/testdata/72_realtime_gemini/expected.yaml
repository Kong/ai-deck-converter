_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-ai
        paths:
          - /ai/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
  - name: ai-gateway-websocket
    url: ws://ai-gateway.upstream.local
    routes:
      - name: gemini-realtime
        paths:
          - /ai/realtime
        protocols:
          - ws
          - wss
        strip_path: false
plugins:
  - id: 18d87ee7-0791-5691-9eba-fd52c8dfd8dd
    name: ai-proxy-advanced
    protocols:
      - ws
      - wss
    config:
      balancer:
        algorithm: round-robin
      genai_category: realtime/generation
      llm_format: gemini
      targets:
        - auth:
            header_name: x-goog-api-key
            header_value: '{vault://ai/gemini-key}'
          description: gemini-3.1-flash-live-preview
          logging:
            log_payloads: false
            log_statistics: true
          model:
            name: gemini-3.1-flash-live-preview
            provider: gemini
          route_type: realtime/v1/realtime
    route: gemini-realtime
    tags:
      - ai-gateway-realtime-model:gemini-live
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 18d87ee7-0791-5691-9eba-fd52c8dfd8dd
      route_type: llm/v1/models
    route: models
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 18d87ee7-0791-5691-9eba-fd52c8dfd8dd
      route_type: llm/v1/models
    route: models-ai
ai_models:
  - name: gemini-live
