_format_version: "3.0"
services:
  - name: secure-flights-mcp
    host: localhost
    routes:
      - name: secure-flights-mcp-route
        paths:
          - /mcp/secure-flights
          - /mcp/secure-flights/.well-known/oauth-protected-resource
        plugins:
          - name: ai-mcp-proxy
            config:
              include_consumer_groups: true
              logging:
                log_audits: false
                log_payloads: false
                log_statistics: true
              mode: conversion-listener
              tools:
                - description: Search available flights
                  host: flights.internal
                  method: GET
                  name: searchFlights
                  path: /flights
                  scheme: https
          - name: ai-mcp-oauth2
            config:
              authorization_servers:
                - https://dev-123456.okta.com/oauth2/default
              cache_introspection: true
              client_alg: RS256
              client_auth: client_secret_post
              client_id: mcp-client
              client_secret: '{vault://ai-vault/okta-client-secret}'
              consumer_by:
                - username
              consumer_claim:
                - sub
              consumer_optional: true
              credential_claim:
                - sub
              http_version: 1.1
              insecure_relaxed_audience_validation: true
              introspection_endpoint: https://dev-123456.okta.com/oauth2/default/v1/introspect
              jwt_claims_leeway: 30
              keepalive: false
              metadata_endpoint: /mcp/secure-flights/.well-known/oauth-protected-resource
              resource: https://api.example.com/mcp/secure-flights
              scopes_supported:
                - openid
                - flights:read
              timeout: 5000
  - name: keyed-mcp
    host: localhost
    routes:
      - name: keyed-mcp-route
        paths:
          - /mcp/keyed
        plugins:
          - name: ai-mcp-proxy
            config:
              include_consumer_groups: true
              logging:
                log_audits: false
                log_payloads: false
                log_statistics: true
              mode: listener
              tools:
                - description: Ping the server
                  host: keyed.internal
                  method: GET
                  name: ping
                  path: /ping
                  scheme: https
          - name: key-auth
            config:
              key_names:
                - apikey
  - name: vendor-proxy-mcp
    url: https://vendor.example.com/mcp
    routes:
      - name: vendor-proxy-mcp-route
        paths:
          - /mcp/vendor-proxy
          - /mcp/vendor-proxy/.well-known/oauth-protected-resource
        plugins:
          - name: ai-mcp-proxy
            config:
              include_consumer_groups: true
              logging:
                log_audits: false
                log_payloads: false
                log_statistics: true
              mode: passthrough-listener
              tools:
                - description: A vendor tool
                  host: vendor.internal
                  method: GET
                  name: vendorTool
                  path: /vendor
                  scheme: https
          - name: ai-mcp-oauth2
            config:
              authorization_servers:
                - https://dev-123456.okta.com/oauth2/default
              cache_introspection: true
              client_alg: RS256
              client_auth: client_secret_post
              client_id: mcp-client
              client_secret: '{vault://ai-vault/okta-client-secret}'
              consumer_by:
                - username
              consumer_claim:
                - sub
              consumer_optional: true
              credential_claim:
                - sub
              http_version: 1.1
              insecure_relaxed_audience_validation: true
              introspection_endpoint: https://dev-123456.okta.com/oauth2/default/v1/introspect
              jwt_claims_leeway: 30
              keepalive: false
              metadata_endpoint: /mcp/vendor-proxy/.well-known/oauth-protected-resource
              resource: https://api.example.com/mcp/vendor-proxy
              scopes_supported:
                - openid
                - profile
              timeout: 5000
