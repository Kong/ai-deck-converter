_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /ai/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-embeddings
        paths:
          - /ai/embeddings
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-ai
        paths:
          - /ai/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - id: 1f992701-63e8-5f80-8d20-391fd9769941
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      max_request_body_size: 2097152
      model_name_header: false
      response_streaming: deny
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/openai-token}'
          description: gpt-4o
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: full-model
            name: gpt-4o
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: full-model
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-embeddings
  - id: ca003cdb-c65d-5673-b0a6-036144fa8fe7
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/embeddings
      llm_format: openai
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/openai-token}'
          description: text-embedding-3-small
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: bare-model
            name: text-embedding-3-small
            provider: openai
          route_type: llm/v1/embeddings
    route: openai-embeddings
    model: bare-model
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 1f992701-63e8-5f80-8d20-391fd9769941
          - plugin_id: ca003cdb-c65d-5673-b0a6-036144fa8fe7
      route_type: llm/v1/models
    route: models
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 1f992701-63e8-5f80-8d20-391fd9769941
          - plugin_id: ca003cdb-c65d-5673-b0a6-036144fa8fe7
      route_type: llm/v1/models
    route: models-ai
ai_models:
  - name: full-model
  - name: bare-model
