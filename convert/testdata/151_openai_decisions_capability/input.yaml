# Many models on shared and header-split routes. They once gave false
# ROUTING_CONFLICT warnings. All names, hosts, and costs are placeholders.
model_providers:
  - name: openai-prod
    type: openai
    config:
      auth:
        type: basic
        headers:
          - name: Authorization
            value: Bearer {vault://ai/openai-token}
models:
  - name: gpt-6-luna-decisions
    display_name: gpt-6-luna-decisions
    type: model
    enabled: true
    capabilities:
      - decisions
    formats:
      - type: openai
    targets:
      - name: gpt-6-luna
        provider: openai-prod
        weight: 100
        allow_auth_override: false
        config:
          type: openai
    config:
      balancer:
        algorithm: round-robin
        connect_timeout: 60000
        fail_timeout: 10000
        failover_criteria:
          - error
          - timeout
        max_fails: 0
        read_timeout: 60000
        retries: 5
        slots: 10000
        write_timeout: 60000
      max_request_body_size: 8388608
      model:
        name_header: true
      response_streaming: allow
      route:
        https_redirect_status_code: 426
        model:
          values:
            - gpt-6-luna
        paths:
          - /openai
        preserve_host: false
        protocols:
          - http
          - https
        regex_priority: 0
        request_buffering: true
        response_buffering: true
        strip_path: true
