_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /embeddings/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-embeddings
        paths:
          - /embeddings/embeddings
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-skills
        paths:
          - /skills/skills
        methods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-embeddings
        paths:
          - /embeddings/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-skills
        paths:
          - /skills/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - id: 9ffd3fba-597f-56ef-9f44-76016596c155
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - description: text-embedding-3-large
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: embeddings
            name: text-embedding-3-large
            provider: openai
          route_type: llm/v1/chat
        - description: claude-sonnet-4-5
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: embeddings
            name: claude-sonnet-4-5
            options:
              anthropic_version: "2023-06-01"
            provider: anthropic
          route_type: llm/v1/chat
        - description: llama3
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: embeddings
            name: llama3
            options:
              llama2_format: raw
              upstream_url: http://llama.local:8080/v1/chat
            provider: llama2
          route_type: llm/v1/chat
    route: openai-chat
    model: embeddings
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-embeddings
  - id: 9d52e068-0110-5d4a-acf4-e8d5a8edac7f
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/embeddings
      llm_format: openai
      targets:
        - description: text-embedding-3-large
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: embeddings
            name: text-embedding-3-large
            provider: openai
          route_type: llm/v1/embeddings
    route: openai-embeddings
    model: embeddings
  - id: 53df3c43-84be-5d5e-bf8d-623373be2d59
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      model_name_header: false
      targets:
        - description: gpt-5.4
          logging:
            log_payloads: false
            log_statistics: false
          model:
            name: gpt-5.4
            provider: openai
          route_type: llm/v1/skills
    route: openai-skills
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 53df3c43-84be-5d5e-bf8d-623373be2d59
          - plugin_id: 9d52e068-0110-5d4a-acf4-e8d5a8edac7f
          - plugin_id: 9ffd3fba-597f-56ef-9f44-76016596c155
      route_type: llm/v1/models
    route: models
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 9d52e068-0110-5d4a-acf4-e8d5a8edac7f
          - plugin_id: 9ffd3fba-597f-56ef-9f44-76016596c155
      route_type: llm/v1/models
    route: models-embeddings
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 53df3c43-84be-5d5e-bf8d-623373be2d59
      route_type: llm/v1/models
    route: models-skills
ai_models:
  - name: embeddings
  - name: skills
