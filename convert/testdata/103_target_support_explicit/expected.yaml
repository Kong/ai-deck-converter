_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /embeddings/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-embeddings
        paths:
          - /embeddings/embeddings
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-skills
        paths:
          - /skills/skills
        methods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        strip_path: false
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - description: text-embedding-3-large
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: embeddings
            name: text-embedding-3-large
            provider: openai
          route_type: llm/v1/chat
        - description: claude-sonnet-4-5
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: embeddings
            name: claude-sonnet-4-5
            options:
              anthropic_version: "2023-06-01"
            provider: anthropic
          route_type: llm/v1/chat
        - description: llama3
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: embeddings
            name: llama3
            options:
              llama2_format: raw
              upstream_url: http://llama.local:8080/v1/chat
            provider: llama2
          route_type: llm/v1/chat
    route: openai-chat
    model: embeddings
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-embeddings
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/embeddings
      llm_format: openai
      targets:
        - description: text-embedding-3-large
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: embeddings
            name: text-embedding-3-large
            provider: openai
          route_type: llm/v1/embeddings
    route: openai-embeddings
    model: embeddings
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      model_name_header: false
      targets:
        - description: gpt-5.4
          logging:
            log_payloads: false
            log_statistics: false
          model:
            name: gpt-5.4
            provider: openai
          route_type: llm/v1/skills
    route: openai-skills
ai_models:
  - name: embeddings
  - name: skills
