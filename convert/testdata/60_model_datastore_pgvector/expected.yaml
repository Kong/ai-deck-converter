_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /ai/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-ai
        paths:
          - /ai/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - id: b124d805-1130-5e11-b37b-67786376922c
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: semantic
        slots: 10000
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://env/openai-key}'
          description: gpt-4o
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: semantic-pgvector
            name: gpt-4o
            provider: openai
          route_type: llm/v1/chat
      vectordb:
        dimensions: 1024
        distance_metric: cosine
        pgvector:
          database: kong-pgvector
          host: pg.internal
          password: '{vault://env/pg-password}'
          port: 5432
          ssl_required: true
          ssl_verify: true
          user: postgres
        strategy: pgvector
        threshold: 0.7
    route: openai-chat
    model: semantic-pgvector
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: b124d805-1130-5e11-b37b-67786376922c
      route_type: llm/v1/models
    route: models
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: b124d805-1130-5e11-b37b-67786376922c
      route_type: llm/v1/models
    route: models-ai
ai_models:
  - name: semantic-pgvector
