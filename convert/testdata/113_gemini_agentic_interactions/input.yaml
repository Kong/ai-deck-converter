# The Gemini Interactions API on the public Gemini endpoints. A target with no
# project_id and location_id gets only the public routes.
model_providers:
  - name: gemini-prod
    type: gemini
    config:
      auth:
        type: basic
        headers:
          - name: Authorization
            value: "{vault://ai/gemini-token}"
models:
  - name: gemini-agentic
    type: model
    capabilities: [agentic]
    formats: [{type: gemini}]
    config:
      route: {paths: [/ai]}
    targets:
      - name: gemini-2.5-pro
        provider: gemini-prod
        config: {type: gemini}
