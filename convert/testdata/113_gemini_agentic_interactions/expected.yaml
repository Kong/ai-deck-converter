_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: gemini-responses
        paths:
          - /ai/v1/interactions
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: gemini-beta-responses
        paths:
          - /ai/v1beta/interactions
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-ai
        paths:
          - /ai/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: gemini-responses
  - id: d465b851-bfa5-566a-aa10-759c94f02a99
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: gemini
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/gemini-token}'
          description: gemini-2.5-pro
          logging:
            log_payloads: false
            log_statistics: true
          model:
            name: gemini-2.5-pro
            options:
              upstream_url: https://generativelanguage.googleapis.com/v1/interactions
            provider: gemini
          route_type: llm/v1/responses
    route: gemini-responses
    model: gemini-agentic
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: gemini-beta-responses
  - id: c24cc1d4-21d4-505c-b2a0-35daa9ffb896
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: gemini
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/gemini-token}'
          description: gemini-2.5-pro
          logging:
            log_payloads: false
            log_statistics: true
          model:
            name: gemini-2.5-pro
            options:
              upstream_url: https://generativelanguage.googleapis.com/v1beta/interactions
            provider: gemini
          route_type: llm/v1/responses
    route: gemini-beta-responses
    model: gemini-agentic
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: d465b851-bfa5-566a-aa10-759c94f02a99
          - plugin_id: c24cc1d4-21d4-505c-b2a0-35daa9ffb896
      route_type: llm/v1/models
    route: models
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: d465b851-bfa5-566a-aa10-759c94f02a99
          - plugin_id: c24cc1d4-21d4-505c-b2a0-35daa9ffb896
      route_type: llm/v1/models
    route: models-ai
ai_models:
  - name: gemini-agentic
