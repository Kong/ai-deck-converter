# A classifier block with every field. The data plane record gets each field
# without a change. The auth header becomes header_name and header_value. The
# vault reference stays as it is.
model_providers:
  - name: anthropic
    type: anthropic
    config:
      auth:
        type: basic
        headers:
          - name: x-api-key
            value: "{vault://env/anthropic-key}"
models:
  - name: auto
    type: model
    capabilities: [generate]
    formats: [{type: anthropic}]
    config:
      route: {paths: [/auto]}
      balancer:
        algorithm: intelligent
        cost_quality_tradeoff: cost
        classifier:
          type: custom
          url: http://kev.internal:8009
          format: /decide/v1/systemone
          name: kev-latest
          timeout: 2000
          context_window: 8192
          auth:
            type: basic
            headers:
              - name: x-api-key
                value: "{vault://env/classifier-api-key}"
    targets:
      - name: claude-haiku-4-5
        provider: anthropic
      - name: claude-sonnet-4-6
        provider: anthropic
