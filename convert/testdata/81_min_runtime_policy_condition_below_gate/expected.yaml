_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /ai/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/openai-token}'
          description: gpt-4o
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: guarded-gpt
            name: gpt-4o
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: guarded-gpt
  - name: ai-prompt-guard
    config:
      allow_patterns:
        - ^fine
    route: openai-chat
    model: guarded-gpt
ai_models:
  - name: guarded-gpt
