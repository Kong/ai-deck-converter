_format_version: "3.0"
services:
  - name: upstream-mcp
    url: https://upstream.example.com/mcp
    routes:
      - name: upstream-mcp-route
        paths:
          - /mcp/upstream
        plugins:
          - name: ai-mcp-proxy
            config:
              include_consumer_groups: true
              logging:
                log_audits: false
                log_payloads: false
                log_statistics: true
              mode: upstream-server
              tools: []
              tools_cache_ttl_seconds: 300
          - name: pre-function
            config:
              access:
                - |
                  local addr = ngx.var.server_addr or ""
                  if addr:sub(1, 5) ~= "unix:" then
                    return ngx.exit(ngx.HTTP_NOT_FOUND)
                  end
            tags:
              - aigw-generated:mcp-toolset-gate
