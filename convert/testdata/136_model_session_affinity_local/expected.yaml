_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /ai/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: lowest-latency
        latency_strategy: tpot
      conversation_state:
        enabled: true
        strategy: local
        ttl: 3600
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            header_name: Authorization
            header_value: Bearer sk-test
          description: gpt-4o
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: gpt-4o
            name: gpt-4o
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: gpt-4o
ai_models:
  - name: gpt-4o
