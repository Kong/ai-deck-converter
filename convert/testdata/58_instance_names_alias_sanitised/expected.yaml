_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /ai/chat/completions
        methods:
          - POST
        strip_path: false
plugins:
  - name: ai-model-selector
    instance_name: ai-model-selector.openai-chat
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - name: ai-proxy-advanced
    instance_name: ai-proxy-advanced.openai-gpt-4o-mini.openai-chat
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://env/openai-token}'
          description: gpt-4o-mini
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: '@openai/gpt-4o-mini'
            name: gpt-4o-mini
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: '@openai/gpt-4o-mini'
  - name: ai-proxy-advanced
    instance_name: ai-proxy-advanced.anthropic-claude-opus-4-6.openai-chat
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            header_name: x-api-key
            header_value: '{vault://env/anthropic-token}'
          description: claude-opus-4-6
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: '@anthropic/claude-opus-4-6'
            name: claude-opus-4-6
            options:
              anthropic_version: "2023-06-01"
            provider: anthropic
          route_type: llm/v1/chat
    route: openai-chat
    model: '@anthropic/claude-opus-4-6'
ai_models:
  - name: '@openai/gpt-4o-mini'
  - name: '@anthropic/claude-opus-4-6'
