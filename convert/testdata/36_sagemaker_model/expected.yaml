_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /ai/chat/completions
        methods:
          - POST
        strip_path: false
plugins:
  - name: ai-model-selector
    config:
      body_path: model
      max_request_body_size: 8388608
      source: body
    route: openai-chat
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            aws_access_key_id: '{vault://env/aws-key-id}'
            aws_secret_access_key: '{vault://env/aws-secret}'
            aws_session_token: '{vault://env/aws-session-token}'
          description: anthropic.claude-3-5-sonnet
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: '@sagemaker/claude-3-5-sonnet'
            name: anthropic.claude-3-5-sonnet
            options:
              sagemaker:
                aws_assume_role_arn: arn:aws:iam::123:role/sagemaker
                aws_region: us-east-1
                aws_role_session_name: kong-session
                aws_sts_endpoint_url: sts.example.test
                target_container_hostname: container-1
                target_model: model-1
                target_variant: variant-1
            provider: sagemaker
          route_type: llm/v1/chat
    route: openai-chat
    model: '@sagemaker/claude-3-5-sonnet'
ai_models:
  - name: '@sagemaker/claude-3-5-sonnet'
