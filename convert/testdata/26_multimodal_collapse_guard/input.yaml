# A single multimodal Bedrock model. Its embeddings and image endpoints share
# /invoke but carry different genai_categories. The single ai-proxy-advanced on
# that route serves one category. The converter keeps the first capability and
# warns/skips image. Video survives on its own async-invoke routes. Under -strict
# the collision is fatal. See convertModels in convert/model.go.
model_providers:
  - name: bedrock-prod
    type: bedrock
    display_name: Bedrock Prod
    config:
      auth:
        type: aws
        access_key_id: "{vault://ai/aws-access-key-id}"
        secret_access_key: "{vault://ai/aws-secret-access-key}"
models:
  - display_name: Nova Omni
    name: nova-omni
    type: model
    capabilities: [embeddings, image, video]
    formats: [{type: bedrock}]
    config:
      route:
        paths: [/ai]
        model:
          values: ["@bedrock/nova-omni"]
    targets:
      - name: amazon.nova-omni-v1:0
        provider: bedrock-prod
        config: {type: bedrock, region: us-east-1}
    policies: []
    access:
      acls: {allow: [], deny: []}
  # Routes follow the pair order, so generate claims /invoke before
  # embeddings. /invoke is the only endpoint of embeddings, so embeddings
  # warns. converse still serves generate.
  - name: nova-chat
    type: model
    capabilities: [embeddings, generate]
    formats: [{type: bedrock}]
    config:
      route: {paths: [/chat]}
    targets:
      - name: amazon.nova-pro-v1:0
        provider: bedrock-prod
        config: {type: bedrock, region: us-east-1}
