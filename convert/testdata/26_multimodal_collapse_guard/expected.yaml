_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: bedrock-invoke
        paths:
          - ~/ai/model/(?<model_name>[^/]+)/invoke(?:-with-response-stream)?
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: bedrock-converse
        paths:
          - ~/chat/model/(?<model_name>[^/]+)/converse(?:-stream)?
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: bedrock-invoke-2
        paths:
          - ~/chat/model/(?<model_name>[^/]+)/invoke(?:-with-response-stream)?
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: bedrock-chat
        paths:
          - /chat/openai/v1/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: bedrock-messages
        paths:
          - /chat/anthropic/v1/messages
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-ai
        paths:
          - /ai/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-chat
        paths:
          - /chat/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - path_pattern: model/([^/]+)/
          source: path
    route: bedrock-invoke
  - id: c1112046-3c9d-5a1b-9621-e24590c2825d
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/embeddings
      llm_format: bedrock
      targets:
        - auth:
            aws_access_key_id: '{vault://ai/aws-access-key-id}'
            aws_secret_access_key: '{vault://ai/aws-secret-access-key}'
          description: amazon.nova-omni-v1:0
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: '@bedrock/nova-omni'
            name: amazon.nova-omni-v1:0
            options:
              bedrock:
                aws_region: us-east-1
            provider: bedrock
          route_type: llm/v1/embeddings
    route: bedrock-invoke
    model: '@bedrock/nova-omni'
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - path_pattern: model/([^/]+)/
          source: path
    route: bedrock-converse
  - id: e618e5d4-45cd-5099-b8bc-ba7ef903968f
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
