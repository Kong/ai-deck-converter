_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-batches
        paths:
          - /ai/batches
        methods:
          - GET
          - POST
        strip_path: false
      - name: openai-files
        paths:
          - /ai/files
        methods:
          - GET
          - POST
          - DELETE
        strip_path: false
plugins:
  - name: rate-limiting
    instance_name: rate-limiting
    config:
      minute: 1000
      policy: local
  - name: ai-proxy-advanced
    instance_name: ai-proxy-advanced.openai-batches
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      model_name_header: false
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://env/openai-key}'
          description: batch-api
          logging:
            log_payloads: false
            log_statistics: false
          model:
            name: batch-api
            provider: openai
          route_type: llm/v1/batches
    route: openai-batches
  - name: ai-proxy-advanced
    instance_name: ai-proxy-advanced.openai-files
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      model_name_header: false
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://env/openai-key}'
          description: files-api
          logging:
            log_payloads: false
            log_statistics: true
          model:
            name: files-api
            provider: openai
          route_type: llm/v1/files
    route: openai-files
  - name: ai-prompt-guard
    instance_name: ai-prompt-guard.openai-files
    config:
      allow_patterns:
        - ^safe
    route: openai-files
ai_models:
  - name: openai-batch-api
  - name: openai-files-api
