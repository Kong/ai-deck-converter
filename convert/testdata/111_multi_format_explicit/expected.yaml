_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /cohere/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: cohere-rerank
        paths:
          - /cohere/v2/rerank
        methods:
          - POST
          - OPTIONS
        strip_path: false
  - name: ai-gateway-websocket
    url: ws://ai-gateway.upstream.local
    routes:
      - name: openai-realtime
        paths:
          - /mixed/realtime
        protocols:
          - ws
          - wss
        strip_path: false
      - name: gemini-realtime
        paths:
          - /gemini-only/realtime
        protocols:
          - ws
          - wss
        strip_path: false
plugins:
  - name: ai-proxy-advanced
    protocols:
      - ws
      - wss
    config:
      balancer:
        algorithm: round-robin
      genai_category: realtime/generation
      llm_format: openai
      targets:
        - description: gpt-realtime
          logging:
            log_payloads: false
            log_statistics: true
          model:
            name: gpt-realtime
            provider: openai
          route_type: realtime/v1/realtime
    route: openai-realtime
    tags:
      - ai-gateway-realtime-model:mixed
  - name: ai-proxy-advanced
    protocols:
      - ws
      - wss
    config:
      balancer:
        algorithm: round-robin
      genai_category: realtime/generation
      llm_format: gemini
      targets:
        - auth:
            header_name: x-goog-api-key
            header_value: '{vault://ai/gemini-key}'
          description: gemini-live-2.5-flash
          logging:
            log_payloads: false
            log_statistics: true
          model:
            name: gemini-live-2.5-flash
            provider: gemini
          route_type: realtime/v1/realtime
    route: gemini-realtime
    tags:
      - ai-gateway-realtime-model:gemini-only
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - description: rerank-v3.5
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: cohere-and-openai
            name: rerank-v3.5
            provider: cohere
          route_type: llm/v1/chat
        - description: gpt-5.4
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: cohere-and-openai
            name: gpt-5.4
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: cohere-and-openai
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: cohere-rerank
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: cohere
      targets:
        - description: rerank-v3.5
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: cohere-and-openai
            name: rerank-v3.5
            provider: cohere
          route_type: llm/v1/chat
    route: cohere-rerank
    model: cohere-and-openai
ai_models:
  - name: mixed
  - name: gemini-only
  - name: cohere-and-openai
