_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /cohere/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: cohere-rerank
        paths:
          - /cohere/v2/rerank
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-cohere
        paths:
          - /cohere/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-gemini-only
        paths:
          - /gemini-only/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-mixed
        paths:
          - /mixed/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
  - name: ai-gateway-websocket
    url: ws://ai-gateway.upstream.local
    routes:
      - name: openai-realtime
        paths:
          - /mixed/realtime
        protocols:
          - ws
          - wss
        strip_path: false
      - name: gemini-realtime
        paths:
          - /gemini-only/realtime
        protocols:
          - ws
          - wss
        strip_path: false
plugins:
  - id: eb745df6-95cd-5dea-9dfc-8513f8c1e48d
    name: ai-proxy-advanced
    protocols:
      - ws
      - wss
    config:
      balancer:
        algorithm: round-robin
      genai_category: realtime/generation
      llm_format: openai
      targets:
        - description: gpt-realtime
          logging:
            log_payloads: false
            log_statistics: true
          model:
            name: gpt-realtime
            provider: openai
          route_type: realtime/v1/realtime
    route: openai-realtime
    tags:
      - ai-gateway-realtime-model:mixed
  - id: 61c1814c-7f17-52d7-b05c-73853962749b
    name: ai-proxy-advanced
    protocols:
      - ws
      - wss
    config:
      balancer:
        algorithm: round-robin
      genai_category: realtime/generation
      llm_format: gemini
      targets:
        - auth:
            header_name: x-goog-api-key
            header_value: '{vault://ai/gemini-key}'
          description: gemini-live-2.5-flash
          logging:
            log_payloads: false
            log_statistics: true
          model:
            name: gemini-live-2.5-flash
            provider: gemini
          route_type: realtime/v1/realtime
    route: gemini-realtime
    tags:
      - ai-gateway-realtime-model:gemini-only
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - id: 7698c1ac-9002-5281-a2f7-02f0cb7cd47c
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - description: rerank-v3.5
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: cohere-and-openai
            name: rerank-v3.5
            provider: cohere
          route_type: llm/v1/chat
        - description: gpt-5.4
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: cohere-and-openai
            name: gpt-5.4
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: cohere-and-openai
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: cohere-rerank
  - id: e86c8a74-9101-5847-b2fc-02291ec2e147
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: cohere
      targets:
        - description: rerank-v3.5
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: cohere-and-openai
            name: rerank-v3.5
            provider: cohere
          route_type: llm/v1/chat
    route: cohere-rerank
    model: cohere-and-openai
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 61c1814c-7f17-52d7-b05c-73853962749b
          - plugin_id: 7698c1ac-9002-5281-a2f7-02f0cb7cd47c
          - plugin_id: e86c8a74-9101-5847-b2fc-02291ec2e147
          - plugin_id: eb745df6-95cd-5dea-9dfc-8513f8c1e48d
      route_type: llm/v1/models
    route: models
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 7698c1ac-9002-5281-a2f7-02f0cb7cd47c
          - plugin_id: e86c8a74-9101-5847-b2fc-02291ec2e147
      route_type: llm/v1/models
    route: models-cohere
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 61c1814c-7f17-52d7-b05c-73853962749b
      route_type: llm/v1/models
    route: models-gemini-only
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: eb745df6-95cd-5dea-9dfc-8513f8c1e48d
      route_type: llm/v1/models
    route: models-mixed
ai_models:
  - name: mixed
  - name: gemini-only
  - name: cohere-and-openai
