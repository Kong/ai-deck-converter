_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: gemini-enterprise-responses
        paths:
          - ~/ai/v1/projects/(?<project_id>[^/]+)/locations/(?<location_id>[^/]+)/interactions
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: gemini-enterprise-beta-responses
        paths:
          - ~/ai/v1beta1/projects/(?<project_id>[^/]+)/locations/(?<location_id>[^/]+)/interactions
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-ai
        paths:
          - /ai/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: gemini-enterprise-responses
  - id: da20f7b2-4688-5c16-95e2-55d86839a506
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: gemini
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/gemini-token}'
          description: custom-endpoint
          logging:
            log_payloads: false
            log_statistics: true
          model:
            name: custom-endpoint
            options:
              gemini:
                api_endpoint: https://gemini.internal.example.com
                location_id: europe-west4
                project_id: my-project
              upstream_url: https://gemini.internal.example.com/v1/projects/my-project/locations/europe-west4/interactions
            provider: gemini
          route_type: llm/v1/responses
    route: gemini-enterprise-responses
    model: gemini-agentic
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: gemini-enterprise-beta-responses
  - id: bb4a92ac-24f9-5cce-abb6-be676f9bd4f4
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: gemini
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/gemini-token}'
          description: custom-endpoint
          logging:
            log_payloads: false
            log_statistics: true
          model:
            name: custom-endpoint
            options:
              gemini:
                api_endpoint: https://gemini.internal.example.com
                location_id: europe-west4
                project_id: my-project
              upstream_url: https://gemini.internal.example.com/v1beta1/projects/my-project/locations/europe-west4/interactions
            provider: gemini
          route_type: llm/v1/responses
    route: gemini-enterprise-beta-responses
    model: gemini-agentic
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: da20f7b2-4688-5c16-95e2-55d86839a506
          - plugin_id: bb4a92ac-24f9-5cce-abb6-be676f9bd4f4
      route_type: llm/v1/models
    route: models
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: da20f7b2-4688-5c16-95e2-55d86839a506
          - plugin_id: bb4a92ac-24f9-5cce-abb6-be676f9bd4f4
      route_type: llm/v1/models
    route: models-ai
ai_models:
  - name: gemini-agentic
