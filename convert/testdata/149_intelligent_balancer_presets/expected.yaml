_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: typesafe-decisions
        paths:
          - ~/classifier/v1/systemone
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: anthropic-messages
        paths:
          - /cost/v1/messages
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: anthropic-messages-2
        paths:
          - /balanced/v1/messages
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: anthropic-messages-3
        paths:
          - /quality/v1/messages
        methods:
          - POST
          - OPTIONS
        strip_path: false
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: typesafe-decisions
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: typesafe
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://env/typesafe-token}'
          description: jev-latest
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: task-classifier
            name: jev-latest
            provider: typesafe
          route_type: llm/v1/chat
    route: typesafe-decisions
    model: task-classifier
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: anthropic-messages
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: intelligent
        classifier:
          auth:
            header_name: Authorization
            header_value: '{vault://env/typesafe-token}'
          context_window: 32768
          name: jev-latest
          provider: typesafe
          type: model
        cost_quality_tradeoff: 0.25
        strategy: weighted
      genai_category: text/generation
      llm_format: anthropic
      targets:
        - auth:
            header_name: x-api-key
            header_value: '{vault://env/anthropic-key}'
          description: claude-haiku-4-5
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: auto-cost
            name: claude-haiku-4-5
            options:
              anthropic_version: "2023-06-01"
            provider: anthropic
          route_type: llm/v1/chat
        - auth:
            header_name: x-api-key
            header_value: '{vault://env/anthropic-key}'
          description: claude-opus-4-6
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: auto-cost
            name: claude-opus-4-6
            options:
              anthropic_version: "2023-06-01"
            provider: anthropic
          route_type: llm/v1/chat
    route: anthropic-messages
    model: auto-cost
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: anthropic-messages-2
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: intelligent
        classifier:
          auth:
            header_name: Authorization
            header_value: '{vault://env/typesafe-token}'
          context_window: 32768
          name: jev-latest
          provider: typesafe
          timeout: 5000
          type: model
        cost_quality_tradeoff: 0.5
        retries: 2
        strategy: weighted
      genai_category: text/generation
      llm_format: anthropic
      targets:
        - auth:
            header_name: x-api-key
            header_value: '{vault://env/anthropic-key}'
          description: claude-haiku-4-5
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: auto-balanced
            name: claude-haiku-4-5
            options:
              anthropic_version: "2023-06-01"
            provider: anthropic
          route_type: llm/v1/chat
        - auth:
            header_name: x-api-key
            header_value: '{vault://env/anthropic-key}'
          description: claude-opus-4-6
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: auto-balanced
            name: claude-opus-4-6
            options:
              anthropic_version: "2023-06-01"
            provider: anthropic
          route_type: llm/v1/chat
    route: anthropic-messages-2
    model: auto-balanced
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: anthropic-messages-3
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: intelligent
        classifier:
          auth:
            header_name: Authorization
            header_value: '{vault://env/typesafe-token}'
          context_window: 32768
          name: jev-latest
          provider: typesafe
          type: model
        cost_quality_tradeoff: 0.75
        strategy: weighted
      genai_category: text/generation
      llm_format: anthropic
      targets:
        - auth:
            header_name: x-api-key
            header_value: '{vault://env/anthropic-key}'
          description: claude-haiku-4-5
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: auto-quality
            name: claude-haiku-4-5
            options:
              anthropic_version: "2023-06-01"
            provider: anthropic
          route_type: llm/v1/chat
        - auth:
            header_name: x-api-key
            header_value: '{vault://env/anthropic-key}'
          description: claude-opus-4-6
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: auto-quality
            name: claude-opus-4-6
            options:
              anthropic_version: "2023-06-01"
            provider: anthropic
          route_type: llm/v1/chat
    route: anthropic-messages-3
    model: auto-quality
ai_models:
  - name: task-classifier
  - name: auto-cost
  - name: auto-balanced
  - name: auto-quality
