- code: CONFIG_FIELD_INVALID
  reason: MCP server "hashing-failover" target 1 is a failover target, which consistent-hashing does not support
  source:
    kind: mcp_server
    name: hashing-failover
    fields:
      - config.targets[1].failover
  severity: ERROR
- code: CONFIG_FIELD_INVALID
  reason: MCP server "only-failover" has only failover targets; at least one target must not be a failover target
  source:
    kind: mcp_server
    name: only-failover
    fields:
      - config.targets
  severity: ERROR
- code: CONFIG_FIELD_INVALID
  reason: MCP server "repeated-address" target 1 repeats the address "a.internal:443" of target 0
  source:
    kind: mcp_server
    name: repeated-address
    fields:
      - config.targets[1].address
  severity: ERROR
- code: MISSING_REQUIRED_CONFIG_FIELD
  reason: MCP server "no-hash-header" uses consistent-hashing without config.balancer.hash_on_header
  source:
    kind: mcp_server
    name: no-hash-header
    fields:
      - config.balancer.hash_on_header
  severity: ERROR
- code: CONFIG_FIELD_INVALID
  reason: MCP server "url-with-balancer" sets config.balancer, which requires config.targets
  source:
    kind: mcp_server
    name: url-with-balancer
    fields:
      - config.balancer
  severity: ERROR
- code: CONFIG_FIELD_INVALID
  reason: MCP server "bad-protocol" has unsupported config.protocol "grpc"; use http or https
  source:
    kind: mcp_server
    name: bad-protocol
    fields:
      - config.protocol
  severity: ERROR
- code: CONFIG_FIELD_INVALID
  reason: MCP server "bad-path" config.path "mcp" must start with /
  source:
    kind: mcp_server
    name: bad-path
    fields:
      - config.path
  severity: ERROR
- code: CONFIG_FIELD_INVALID
  reason: MCP server "tool-host" sets tools[0].host, which bypasses config.targets
  source:
    kind: mcp_server
    name: tool-host
    fields:
      - tools[0].host
  severity: ERROR
- code: CONFIG_FIELD_INVALID
  reason: MCP server "listener-targets" has type listener, which does not support config.targets
  source:
    kind: mcp_server
    name: listener-targets
    fields:
      - config.targets
  severity: ERROR
- code: CONFIG_FIELD_IGNORED
  reason: MCP server "ignored-hash-header" sets config.balancer.hash_on_header, which only consistent-hashing uses
  source:
    kind: mcp_server
    name: ignored-hash-header
    fields:
      - config.balancer.hash_on_header
  severity: WARNING
