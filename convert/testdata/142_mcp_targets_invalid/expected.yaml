_format_version: "3.0"
services:
  - name: ignored-hash-header
    host: ignored-hash-header-upstream
    protocol: https
    routes:
      - name: ignored-hash-header-route
        paths:
          - /mcp/ignored-hash-header
        plugins:
          - name: ai-mcp-proxy
            config:
              include_consumer_groups: true
              logging:
                log_audits: false
                log_payloads: false
                log_statistics: true
              mode: passthrough-listener
              tools: []
upstreams:
  - name: ignored-hash-header-upstream
    algorithm: round-robin
    healthchecks:
      active:
        type: tcp
        healthy:
          interval: 10
          successes: 2
        unhealthy:
          interval: 10
          tcp_failures: 3
          timeouts: 3
      passive:
        type: tcp
        unhealthy:
          tcp_failures: 3
          timeouts: 3
    targets:
      - target: a.internal:443
