        methods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        strip_path: false
      - name: openai-videos-2
        paths:
          - /one/videos
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-one
        paths:
          - /one/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-two
        paths:
          - /two/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: openai-videos-lifecycle
        paths:
          - /two/videos
        methods:
          - GET
          - DELETE
        strip_path: false
        tags:
          - aigw:video-lifecycle
      - name: openai-videos-lifecycle-2
        paths:
          - /one/videos
        methods:
          - GET
          - DELETE
        strip_path: false
        tags:
          - aigw:video-lifecycle
  - name: ai-gateway-websocket
    url: ws://ai-gateway.upstream.local
    routes:
      - name: openai-realtime
        paths:
          - /one/realtime
        protocols:
          - ws
          - wss
        strip_path: false
consumers:
  - username: anonymous
    custom_id: anonymous
    plugins:
      - name: request-termination
        enabled: true
        config:
          message: Unauthorized
          status_code: 401
