_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /two/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-responses
        paths:
          - /two/responses
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-audio-speech
        paths:
          - /two/audio/speech
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-audio-transcribe
        paths:
          - /two/audio/transcriptions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-audio-translate
        paths:
          - /two/audio/translations
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-embeddings
        paths:
          - /two/embeddings
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-images
        paths:
          - /two/images/generations
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-skills
        paths:
          - /two/skills
        methods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        strip_path: false
      - name: openai-videos
        paths:
          - /two/videos
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-chat-2
        paths:
          - /one/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-responses-2
        paths:
          - /one/responses
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-audio-speech-2
