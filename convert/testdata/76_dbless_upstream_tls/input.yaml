agents:
  - type: a2a
    name: booking-agent
    config:
      url: https://booking-agent.internal:8443/a2a
      route: {name: booking-route, paths: [/agents/booking]}
      certificates: [upstream-client]
      ca_certificates: [internal-root-ca, partner-root-ca]

mcp_servers:
  - type: passthrough-listener
    name: vendor-mcp
    upstream_url: https://vendor-mcp.example.com/mcp
    config:
      route: {name: vendor-mcp-route, paths: [/mcp/vendor]}
      certificates: [upstream-client]
      ca_certificates: [internal-root-ca]
    tools: []

certificates:
  - name: upstream-client
    cert: |
      -----BEGIN CERTIFICATE-----
      MIIBrsBgNVBAMMCnVwc3RyZWFtLTE=
      -----END CERTIFICATE-----
    key: |
      -----BEGIN PRIVATE KEY-----
      MIIBVAIBADANBgkqhkiG9w0BAQEFAA==
      -----END PRIVATE KEY-----

ca_certificates:
  - name: internal-root-ca
    cert: |
      -----BEGIN CERTIFICATE-----
      MIIBinternalrootca
      -----END CERTIFICATE-----
  - name: partner-root-ca
    cert: |
      -----BEGIN CERTIFICATE-----
      MIIBpartnerrootca
      -----END CERTIFICATE-----
