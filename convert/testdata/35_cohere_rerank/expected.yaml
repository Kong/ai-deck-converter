_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: cohere-rerank
        paths:
          - /cohere/v2/rerank
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-cohere
        paths:
          - /cohere/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: cohere-rerank
  - id: 87baa315-8a7c-54dd-af7d-5eced1f79f86
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: cohere
      targets:
        - auth:
            header_name: Authorization
            header_value: Bearer ${COHERE_API_KEY}
          description: command-a-plus-05-2026
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: cohere
            name: command-a-plus-05-2026
            options:
              cohere:
                api_version: v2
                embedding_input_type: classification
                wait_for_model: false
            provider: cohere
          route_type: llm/v1/chat
    route: cohere-rerank
    model: cohere
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 87baa315-8a7c-54dd-af7d-5eced1f79f86
      route_type: llm/v1/models
    route: models
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 87baa315-8a7c-54dd-af7d-5eced1f79f86
      route_type: llm/v1/models
    route: models-cohere
ai_models:
  - name: cohere
