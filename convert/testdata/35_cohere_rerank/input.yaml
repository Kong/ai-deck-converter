model_providers:
  - name: cohere-prod
    type: cohere
    config:
      auth:
        type: basic
        headers:
          - name: Authorization
            value: Bearer ${COHERE_API_KEY}
models:
  - type: model
    name: cohere
    capabilities: [rerank]
    formats: [{type: cohere}]
    config:
      route: {paths: [/cohere], model: {path_aliases: [cohere]}}
    targets:
      - name: command-a-plus-05-2026
        provider: cohere-prod
        config:
          type: cohere
          api_version: v2
          embedding_input_type: classification
          wait_for_model: false