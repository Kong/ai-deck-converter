_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /shared/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-shared
        paths:
          - /shared/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - id: eb686c8f-d177-5774-b80e-38376bb02731
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - description: gpt-4o
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: first
            name: gpt-4o
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: first
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: eb686c8f-d177-5774-b80e-38376bb02731
      route_type: llm/v1/models
    route: models
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: eb686c8f-d177-5774-b80e-38376bb02731
      route_type: llm/v1/models
    route: models-shared
ai_models:
  - name: first
