# Bedrock serves the OpenAI Responses API beside its native
# RetrieveAndGenerate, so "agentic" emits a route for each (KOKO-4642).
# The generate capability's own OpenAI/Anthropic-compatible routes already
# appear in every other bedrock case, so this one declares agentic alone.
model_providers:
  - name: bedrock-prod
    type: bedrock
    display_name: Bedrock Prod
    config:
      auth:
        type: aws
        access_key_id: "{vault://ai/aws-access-key-id}"
        secret_access_key: "{vault://ai/aws-secret-access-key}"
models:
  - display_name: Claude Bedrock
    name: claude-bedrock
    type: model
    capabilities: [agentic]
    formats: [{type: bedrock}]
    config:
      route: {paths: [/ai]}
    targets:
      - name: anthropic.claude-3-5-sonnet
        provider: bedrock-prod
        config: {type: bedrock, region: us-east-1, max_tokens: 1024}
    policies: []
    access:
      acls: {allow: [], deny: []}
