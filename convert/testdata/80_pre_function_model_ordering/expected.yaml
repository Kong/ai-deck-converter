_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /ai/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-ai
        paths:
          - /ai/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    ordering:
      before:
        access:
          - pre-function
          - request-validator
    route: openai-chat
  - id: 4b5a9080-64b3-5090-a636-a8c4f8d6f6b7
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://env/openai-key}'
          description: gpt-4o
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: '@kong/gpt-4o'
            name: gpt-4o
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: '@kong/gpt-4o'
  - id: 5739013c-7e15-5e4c-a8e7-e09e39decc08
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://env/openai-key}'
          description: gpt-4o
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: '@kong/gpt-4o-alias'
            name: gpt-4o
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: '@kong/gpt-4o-alias'
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 4b5a9080-64b3-5090-a636-a8c4f8d6f6b7
          - plugin_id: 5739013c-7e15-5e4c-a8e7-e09e39decc08
      route_type: llm/v1/models
    route: models
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 4b5a9080-64b3-5090-a636-a8c4f8d6f6b7
          - plugin_id: 5739013c-7e15-5e4c-a8e7-e09e39decc08
      route_type: llm/v1/models
    route: models-ai
  - name: pre-function
    config:
      access:
        - |
          local model = ngx.ctx.ai_model
          return kong.response.exit(200, { selected_model = model and model.name or ngx.null })
    route: openai-chat
    model: '@kong/gpt-4o'
  - name: pre-function
    config:
      access:
        - |
          local model = ngx.ctx.ai_model
          return kong.response.exit(200, { selected_model = model and model.name or ngx.null })
    route: openai-chat
    model: '@kong/gpt-4o-alias'
  - name: request-validator
    config:
      body_schema: '[{"type":"object"}]'
    route: openai-chat
    model: '@kong/gpt-4o'
  - name: request-validator
    config:
      body_schema: '[{"type":"object"}]'
    route: openai-chat
    model: '@kong/gpt-4o-alias'
ai_models:
  - name: '@kong/gpt-4o'
    tags:
      - ai-gateway-model-alias-group:@kong/gpt-4o
  - name: '@kong/gpt-4o-alias'
    tags:
      - ai-gateway-model-alias-group:@kong/gpt-4o
