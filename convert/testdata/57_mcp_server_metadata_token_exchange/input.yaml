identity_providers:
  - display_name: Okta OIDC (token exchange)
    name: okta-oidc-te
    type: openid-connect
    config:
      issuer: https://dev-123456.okta.com/oauth2/default
      client_id: [mcp-client]
      client_secret: ["{vault://ai-vault/okta-client-secret}"]
      client_auth: [client_secret_post]
      cache_tokens_salt: pepper
      token_exchange:
        subject_token_issuers:
          - issuer: https://dev-123456.okta.com/oauth2/default
            conditions:
              has_audience: [mcp-api]
            verify_signature: true
        request:
          audience: [mcp-api]
        cache:
          enabled: true
          ttl: 3600

mcp_servers:
  # No metadata -> compiles to openid-connect, token_exchange PRESERVED.
  # (The metadata variant is a hard error, covered by the unit test
  # aigw2-mcp-token-exchange_test.go, since ai-mcp-oauth2 cannot represent
  # token_exchange and dropping it silently would remove a security control.)
  - type: conversion-listener
    display_name: MCP no metadata
    name: mcp-no-metadata
    config:
      route:
        paths: [/mcp/no-meta]
    access:
      identity_providers: [okta-oidc-te]
    tools:
      - name: echo
        description: echo
        method: GET
        path: /anything
        scheme: https
        host: httpbin.internal
