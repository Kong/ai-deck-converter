_format_version: "3.0"
services:
  - name: mcp-no-metadata
    host: localhost
    routes:
      - name: mcp-no-metadata-route
        paths:
          - /mcp/no-meta
        plugins:
          - name: ai-mcp-proxy
            config:
              include_consumer_groups: true
              logging:
                log_audits: false
                log_payloads: false
                log_statistics: true
              mode: conversion-listener
              tools:
                - description: echo
                  host: httpbin.internal
                  method: GET
                  name: echo
                  path: /anything
                  scheme: https
          - name: openid-connect
            config:
              cache_tokens_salt: pepper
              client_auth:
                - client_secret_post
              client_id:
                - mcp-client
              client_secret:
                - '{vault://ai-vault/okta-client-secret}'
              issuer: https://dev-123456.okta.com/oauth2/default
              token_exchange:
                cache:
                  enabled: true
                  ttl: 3600
                request:
                  audience:
                    - mcp-api
                subject_token_issuers:
                  - conditions:
                      has_audience:
                        - mcp-api
                    issuer: https://dev-123456.okta.com/oauth2/default
                    verify_signature: true
