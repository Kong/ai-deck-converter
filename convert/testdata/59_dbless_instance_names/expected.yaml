_format_version: "3.0"
_transform: false
services:
  - id: 947a4e23-b483-5a65-8165-da9aed24565b
    name: ai-gateway
    url: http://ai-gateway.upstream.local
    host: ai-gateway.upstream.local
    port: 80
    protocol: http
routes:
  - id: 8ae36805-da7a-55b9-b056-72bde6bb937d
    name: openai-chat
    service:
      id: 947a4e23-b483-5a65-8165-da9aed24565b
    paths:
      - /ai/chat/completions
    methods:
      - POST
    protocols:
      - http
      - https
    strip_path: false
plugins:
  - id: 17fa8192-4b9f-5b5a-8379-20ad8bc836a7
    name: ai-model-selector
    instance_name: ai-model-selector.openai-chat
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route:
      id: 8ae36805-da7a-55b9-b056-72bde6bb937d
  - id: f3adc007-171c-5519-8763-3a0eef79bde3
    name: ai-proxy-advanced
    instance_name: ai-proxy-advanced.openai-gpt-4o-mini.openai-chat
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://env/openai-token}'
          description: gpt-4o-mini
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: '@openai/gpt-4o-mini'
            name: gpt-4o-mini
            provider: openai
          route_type: llm/v1/chat
    route:
      id: 8ae36805-da7a-55b9-b056-72bde6bb937d
    model:
      id: 8aa73fd3-27dc-54f2-9e4f-d8cccce25331
ai_models:
  - id: 8aa73fd3-27dc-54f2-9e4f-d8cccce25331
    name: '@openai/gpt-4o-mini'
