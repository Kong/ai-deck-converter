_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /mantle-openai/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-responses
        paths:
          - /mantle-openai/responses
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-embeddings
        paths:
          - /mantle-openai/embeddings
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-chat-2
        paths:
          - /mantle-openai/v1/chat/completions
          - /mantle-openai/openai/v1/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-responses-2
        paths:
          - /mantle-openai/v1/responses
          - /mantle-openai/openai/v1/responses
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: anthropic-messages
        paths:
          - /mantle-anthropic/v1/messages
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-mantle-anthropic
        paths:
          - /mantle-anthropic/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-mantle-openai
        paths:
          - /mantle-openai/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - id: 70ef45fa-98b8-57e5-8453-10b31bb78455
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - description: gpt-5.2
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: mantle-openai
            name: gpt-5.2
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: mantle-openai
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-responses
  - id: f137f4d4-b7b6-5cf9-b998-2224e9d2b34b
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - description: gpt-5.2
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: mantle-openai
            name: gpt-5.2
            provider: openai
          route_type: llm/v1/responses
    route: openai-responses
    model: mantle-openai
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-embeddings
  - id: 0da04dcc-7f29-5a06-b4f2-3652e4ffaf85
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/embeddings
      llm_format: openai
      targets:
        - description: gpt-5.2
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: mantle-openai
            name: gpt-5.2
            provider: openai
          route_type: llm/v1/embeddings
    route: openai-embeddings
    model: mantle-openai
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat-2
  - id: a7a6a454-18bf-5eaf-96be-5afe6dfdd5a8
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            aws_access_key_id: '{vault://ai/aws-access-key-id}'
            aws_secret_access_key: '{vault://ai/aws-secret-access-key}'
          description: openai.gpt-oss-120b
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: mantle-openai
            name: openai.gpt-oss-120b
            options:
              bedrock:
                aws_region: us-east-1
                endpoint_type: mantle
                mantle_openai_path_prefix: /v1
            provider: bedrock
          route_type: llm/v1/chat
    route: openai-chat-2
    model: mantle-openai
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-responses-2
  - id: 5cd03ac2-c690-51fc-83b4-b43043776f09
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            aws_access_key_id: '{vault://ai/aws-access-key-id}'
            aws_secret_access_key: '{vault://ai/aws-secret-access-key}'
          description: openai.gpt-oss-120b
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: mantle-openai
            name: openai.gpt-oss-120b
            options:
              bedrock:
                aws_region: us-east-1
                endpoint_type: mantle
                mantle_openai_path_prefix: /v1
            provider: bedrock
          route_type: llm/v1/responses
    route: openai-responses-2
    model: mantle-openai
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: anthropic-messages
  - id: 4fb1dc5c-31c4-53a6-8990-46cc8a8470fe
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: anthropic
      targets:
        - auth:
            aws_access_key_id: '{vault://ai/aws-access-key-id}'
            aws_secret_access_key: '{vault://ai/aws-secret-access-key}'
          description: anthropic.claude-sonnet-4-5
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: mantle-anthropic
            name: anthropic.claude-sonnet-4-5
            options:
              anthropic_version: bedrock-2023-05-31
              bedrock:
                aws_region: us-east-1
                endpoint_type: mantle
                mantle_openai_path_prefix: auto_detect
            provider: bedrock
          route_type: llm/v1/chat
    route: anthropic-messages
    model: mantle-anthropic
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 70ef45fa-98b8-57e5-8453-10b31bb78455
          - plugin_id: f137f4d4-b7b6-5cf9-b998-2224e9d2b34b
          - plugin_id: 0da04dcc-7f29-5a06-b4f2-3652e4ffaf85
          - plugin_id: a7a6a454-18bf-5eaf-96be-5afe6dfdd5a8
          - plugin_id: 5cd03ac2-c690-51fc-83b4-b43043776f09
          - plugin_id: 4fb1dc5c-31c4-53a6-8990-46cc8a8470fe
      route_type: llm/v1/models
    route: models
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 4fb1dc5c-31c4-53a6-8990-46cc8a8470fe
      route_type: llm/v1/models
    route: models-mantle-anthropic
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 70ef45fa-98b8-57e5-8453-10b31bb78455
          - plugin_id: f137f4d4-b7b6-5cf9-b998-2224e9d2b34b
          - plugin_id: 0da04dcc-7f29-5a06-b4f2-3652e4ffaf85
          - plugin_id: a7a6a454-18bf-5eaf-96be-5afe6dfdd5a8
          - plugin_id: 5cd03ac2-c690-51fc-83b4-b43043776f09
      route_type: llm/v1/models
    route: models-mantle-openai
ai_models:
  - name: mantle-openai
  - name: mantle-anthropic
