- code: ROUTING_CONFLICT
  reason: route "openai-responses-lifecycle" serves requests addressed by a stored ID, which carry no model, so every target on it shares one balancer pool. Target "gpt-5.2" of model "mantle-openai" and target "openai.gpt-oss-120b" of model "mantle-openai" resolve to different providers, but a stored ID exists only on the provider that created it, so Kong can send such a request to a provider that does not have it.
  source:
    kind: model
    name: mantle-openai
    fields:
      - config.route
  severity: WARNING
- code: BEHAVIOR_MAY_DIFFER
  reason: 'model "mantle-openai" target "openai.gpt-oss-120b": the data plane does not accept this target for capability "embeddings" with llm_format "openai". The routes of this capability will not fail over to it.'
  source:
    kind: model
    name: mantle-openai
    fields:
      - capabilities[2]
      - targets[1]
  severity: WARNING
- code: CONFIG_FIELD_INVALID
  reason: 'model "mantle-unserved": no target can serve capability "image" with llm_format "openai"'
  source:
    kind: model
    name: mantle-unserved
    fields:
      - capabilities[1]
  severity: ERROR
