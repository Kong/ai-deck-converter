# A mantle target serves only llm/v1/chat, llm/v1/responses, and llm/v1/files.
# It needs the openai or anthropic format.
# The embeddings route of mantle-openai has only the openai target.
# No target of mantle-unserved serves image. The model fails.
model_providers:
  - name: openai-prod
    type: openai
    config:
      auth:
        type: bearer
        token: "{vault://ai/openai-key}"
  - name: bedrock-prod
    type: bedrock
    config:
      auth:
        type: aws
        access_key_id: "{vault://ai/aws-access-key-id}"
        secret_access_key: "{vault://ai/aws-secret-access-key}"
models:
  - name: mantle-openai
    type: model
    capabilities: [generate, agentic, embeddings]
    formats: [{type: openai}]
    config:
      route: {paths: [/mantle-openai]}
    targets:
      - name: gpt-5.2
        provider: openai-prod
      - name: openai.gpt-oss-120b
        provider: bedrock-prod
        config: {type: bedrock, region: us-east-1, endpoint_type: mantle}
  - name: mantle-anthropic
    type: model
    capabilities: [generate]
    formats: [{type: anthropic}]
    config:
      route: {paths: [/mantle-anthropic]}
    targets:
      - name: anthropic.claude-sonnet-4-5
        provider: bedrock-prod
        config: {type: bedrock, region: us-east-1, endpoint_type: mantle}
  - name: mantle-unserved
    type: model
    capabilities: [generate, image]
    formats: [{type: openai}]
    config:
      route: {paths: [/mantle-unserved]}
    targets:
      - name: openai.gpt-oss-120b
        provider: bedrock-prod
        config: {type: bedrock, region: us-east-1, endpoint_type: mantle}
