- code: BEHAVIOR_MAY_DIFFER
  reason: MCP server "secure-flights-mcp-oauth" sets access.acls, but no plugin on its route identifies a consumer or consumer group. The acl plugin has nothing to match and denies every request. Add a key-auth or openid-connect auth strategy to access.auth_strategies.
  source:
    kind: mcp_server
    name: secure-flights-mcp-oauth
    fields:
      - access.acls
  severity: WARNING
- code: BEHAVIOR_MAY_DIFFER
  reason: MCP server "secure-flights-mcp-consumer" sets access.acls, but no plugin on its route identifies a consumer or consumer group. The acl plugin has nothing to match and denies every request. Add a key-auth or openid-connect auth strategy to access.auth_strategies.
  source:
    kind: mcp_server
    name: secure-flights-mcp-consumer
    fields:
      - access.acls
  severity: WARNING
