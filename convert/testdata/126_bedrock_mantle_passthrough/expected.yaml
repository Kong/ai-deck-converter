_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: bedrock-passthrough
        paths:
          - /mantle-passthrough
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-mantle-passthrough
        paths:
          - /mantle-passthrough/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
plugins:
  - id: 221fb025-ba28-524f-bc26-de1cab26f84e
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            aws_access_key_id: '{vault://ai/aws-access-key-id}'
            aws_secret_access_key: '{vault://ai/aws-secret-access-key}'
          description: openai.gpt-oss-120b
          logging:
            log_payloads: false
            log_statistics: true
          model:
            name: openai.gpt-oss-120b
            options:
              bedrock:
                aws_region: us-east-1
                endpoint_type: mantle
                mantle_openai_path_prefix: /v1
            provider: bedrock
          route_type: passthrough
    route: bedrock-passthrough
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 221fb025-ba28-524f-bc26-de1cab26f84e
      route_type: llm/v1/models
    route: models
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 221fb025-ba28-524f-bc26-de1cab26f84e
      route_type: llm/v1/models
    route: models-mantle-passthrough
ai_models:
  - name: mantle-passthrough
