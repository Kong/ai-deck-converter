# A mantle target serves the passthrough format.
model_providers:
  - name: bedrock-prod
    type: bedrock
    config:
      auth:
        type: aws
        access_key_id: "{vault://ai/aws-access-key-id}"
        secret_access_key: "{vault://ai/aws-secret-access-key}"
models:
  - name: mantle-passthrough
    type: api
    formats: [{type: passthrough}]
    config:
      route: {paths: [/mantle-passthrough]}
    targets:
      - name: openai.gpt-oss-120b
        provider: bedrock-prod
        config: {type: bedrock, region: us-east-1, endpoint_type: mantle}
