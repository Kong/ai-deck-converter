model_providers:
  - name: openai
    type: openai
custom_policies:
  - name: early-streamer
    type: streaming
    schema: |
      return {
        name = "early-streamer",
        fields = {},
      }
    handler: |
      return {
        PRIORITY = 1000,
        VERSION = "1.0.0",
      }
policies:
  - name: early-instance
    type: early-streamer
    config: {}
models:
  # The custom plugin's priority outranks ai-model-selector. The converter
  # cannot reorder it, so it warns instead.
  - type: model
    name: guarded
    capabilities: [generate]
    formats: [{type: openai}]
    targets:
      - name: gpt-4o
        provider: openai
        config: {type: openai}
    policies: [early-instance]
    config:
      route:
        paths: [/ai]
