# At 2.1, "*" leaves out the skills capability and the typesafe format,
# which need 2.2. The converter gives no issue, because "*" causes the
# result.
models:
  - name: everything
    type: model
    capabilities: ["*"]
    formats: [{type: "*"}]
    config:
      route: {paths: [/ai]}
    targets:
      - name: gpt-5.4
        provider: openai-prod
model_providers:
  - name: openai-prod
    type: openai
    config:
      auth:
        type: bearer
        token: "{vault://ai/openai-key}"
