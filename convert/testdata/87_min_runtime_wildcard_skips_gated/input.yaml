# Runtime 2.1 leaves skills out of the API wildcard.
models:
  - name: everything
    type: model
    capabilities: ["*"]
    formats: [{type: "*"}]
    config:
      route: {paths: [/ai]}
    targets:
      - name: gpt-5.4
        provider: openai-prod
  - name: jobs
    type: api
    capabilities: ["*"]
    formats: [{type: "*"}]
    config:
      route: {paths: [/jobs]}
    targets:
      - name: gpt-5.4
        provider: openai-prod
model_providers:
  - name: openai-prod
    type: openai
    config:
      auth:
        type: bearer
        token: "{vault://ai/openai-key}"
