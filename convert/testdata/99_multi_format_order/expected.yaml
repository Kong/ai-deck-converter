_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /ai/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: anthropic-messages
        paths:
          - /ai/v1/messages
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: anthropic-skills
        paths:
          - /ai/v1/skills
        methods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-ai
        paths:
          - /ai/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - id: 820dd6e2-8df9-5c5b-a3d5-bcf670ccc247
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - description: claude-sonnet-4-5
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: ordered
            name: claude-sonnet-4-5
            options:
              anthropic_version: "2023-06-01"
            provider: anthropic
          route_type: llm/v1/chat
    route: openai-chat
    model: ordered
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: anthropic-messages
  - id: 90a1b264-a143-53aa-b526-5c96e157ce53
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: anthropic
      targets:
        - description: claude-sonnet-4-5
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: ordered
            name: claude-sonnet-4-5
            options:
              anthropic_version: "2023-06-01"
            provider: anthropic
          route_type: llm/v1/chat
    route: anthropic-messages
    model: ordered
  - id: dd14bf2b-2aef-54b9-98f9-44d24f93fa92
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: anthropic
      model_name_header: false
      targets:
        - description: claude-sonnet-4-5
          logging:
            log_payloads: false
            log_statistics: false
          model:
            model_alias: ordered
            name: claude-sonnet-4-5
            options:
              anthropic_version: "2023-06-01"
            provider: anthropic
          route_type: llm/v1/skills
    route: anthropic-skills
    model: ordered
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 820dd6e2-8df9-5c5b-a3d5-bcf670ccc247
          - plugin_id: 90a1b264-a143-53aa-b526-5c96e157ce53
          - plugin_id: dd14bf2b-2aef-54b9-98f9-44d24f93fa92
      route_type: llm/v1/models
    route: models
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 820dd6e2-8df9-5c5b-a3d5-bcf670ccc247
          - plugin_id: 90a1b264-a143-53aa-b526-5c96e157ce53
          - plugin_id: dd14bf2b-2aef-54b9-98f9-44d24f93fa92
      route_type: llm/v1/models
    route: models-ai
ai_models:
  - name: ordered
