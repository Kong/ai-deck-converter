_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /keys/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-chat-2
        paths:
          - /oidc/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-chat-3
        paths:
          - /open/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
  - name: budget-status
    host: localhost
    routes:
      - name: budget-status
        paths:
          - /budgets
        methods:
          - GET
        plugins:
          - name: key-auth
            config:
              anonymous: anonymous
              key_names:
                - x-api-key
          - name: openid-connect
            config:
              anonymous: anonymous
              issuer: https://dev-123456.okta.com/oauth2/default
          - name: ai-proxy-advanced
            config:
              route_type: llm/v1/budgets
consumers:
  - username: anonymous
    custom_id: anonymous
    plugins:
      - name: request-termination
        enabled: true
        config:
          message: Unauthorized
          status_code: 401
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 50000000
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      max_request_body_size: 50000000
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/openai-token}'
          description: gpt-5.4
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: keys
            name: gpt-5.4
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: keys
  - name: ai-model-selector
    config:
      max_request_body_size: 50000000
      sources:
        - body_path: model
          source: body
    route: openai-chat-2
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      max_request_body_size: 50000000
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/openai-token}'
          description: gpt-5.4
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: oidc
            name: gpt-5.4
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat-2
    model: oidc
  - name: ai-model-selector
    config:
      max_request_body_size: 50000000
      sources:
        - body_path: model
          source: body
    route: openai-chat-3
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      max_request_body_size: 50000000
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/openai-token}'
          description: gpt-5.4
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: open
            name: gpt-5.4
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat-3
    model: open
  - name: key-auth
    config:
      key_names:
        - x-api-key
    route: openai-chat
  - name: openid-connect
    config:
      anonymous: anonymous
      issuer: https://dev-123456.okta.com/oauth2/default
    route: openai-chat-2
  - name: key-auth
    config:
      anonymous: anonymous
      key_names:
        - x-api-key
    route: openai-chat-2
ai_models:
  - name: keys
  - name: oidc
  - name: open
