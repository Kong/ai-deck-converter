_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /ai/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-ai
        paths:
          - /ai/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
consumers:
  - username: gregs-dev
    custom_id: dev-001
    groups:
      - name: premium-users
    keyauth_credentials:
      - key: secret-abc
        ttl: 3600
    plugins:
      - name: http-log
        config:
          http_endpoint: https://logs.internal/ingest
    tags:
      - tier:gold
consumer_groups:
  - name: premium-users
plugins:
  - name: rate-limiting
    config:
      minute: 1000
      policy: local
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - id: 5d587cb8-26e8-59db-a6e9-e995ee3e4199
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://env/openai-key}'
          description: gpt-4o
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: guarded-gpt
            name: gpt-4o
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: guarded-gpt
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - access:
              allow:
                - premium-users
            plugin_id: 5d587cb8-26e8-59db-a6e9-e995ee3e4199
      route_type: llm/v1/models
    route: models
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - access:
              allow:
                - premium-users
            plugin_id: 5d587cb8-26e8-59db-a6e9-e995ee3e4199
      route_type: llm/v1/models
    route: models-ai
  - name: ai-prompt-guard
    config:
      allow_patterns:
        - ^safe
    route: openai-chat
    model: guarded-gpt
  - name: http-log
    config:
      http_endpoint: https://logs.internal/ingest
    route: openai-chat
    model: guarded-gpt
  - name: acl
    config:
      allow:
        - premium-users
      include_consumer_groups: true
    route: openai-chat
    model: guarded-gpt
vaults:
  - prefix: env-vault
    name: env
    description: Environment secrets
    config:
      prefix: KONG_
ai_models:
  - name: guarded-gpt
    tags:
      - env:prod
      - team:ai-platform
