- code: CONFIG_FIELD_INVALID
  reason: MCP server "both" sets both upstream_url and config.targets; use one
  source:
    kind: mcp_server
    name: both
    fields:
      - upstream_url
      - config.targets
  severity: ERROR
- code: UNSUPPORTED_IN_MIN_RUNTIME_VERSION
  reason: config.targets requires minimum runtime version "2.4", but the configured minimum is "2.3"
  source:
    kind: mcp_server
    name: gated
    fields:
      - config.targets
  severity: ERROR
