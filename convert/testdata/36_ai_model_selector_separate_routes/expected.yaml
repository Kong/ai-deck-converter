_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /ai-default-alias/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-chat-2
        paths:
          - /ai-body-alias/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-chat-3
        paths:
          - /ai-headers-alias/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-chat-4
        paths:
          - /ai-path-alias/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-ai-body-alias
        paths:
          - /ai-body-alias/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-ai-default-alias
        paths:
          - /ai-default-alias/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-ai-headers-alias
        paths:
          - /ai-headers-alias/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-ai-path-alias
        paths:
          - /ai-path-alias/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - id: 7ac8c137-f428-5963-82fc-6b819697fb45
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      response_streaming: allow
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/openai-token}'
          description: gpt-5.2
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: gpt-5-2-default-alias-config
            name: gpt-5.2
            options:
              max_tokens: 1024
              temperature: 1
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: gpt-5-2-default-alias-config
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: my-model-alias
          source: body
    route: openai-chat-2
  - id: 7d351682-ce98-5820-89ff-785327bf53c5
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      response_streaming: allow
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/openai-token}'
          description: gpt-5.2
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: my-body-alias-value
            name: gpt-5.2
            options:
              max_tokens: 1024
              temperature: 1
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat-2
    model: my-body-alias-value
  - name: ai-model-selector
    config:
      sources:
        - header_name: my-model-alias
          source: header
    route: openai-chat-3
  - id: 006f9177-d143-5b04-9031-fe71186cd1e6
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      response_streaming: allow
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/openai-token}'
          description: gpt-5.2
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: my-model-alias-header-value
            name: gpt-5.2
            options:
              max_tokens: 1024
              temperature: 1
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat-3
    model: my-model-alias-header-value
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat-4
  - id: 0441f68d-3e67-5f93-a299-05d5fddd7667
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      response_streaming: allow
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/openai-token}'
          description: gpt-5.2
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: my-model-path-alias-value
            name: gpt-5.2
            options:
              max_tokens: 1024
              temperature: 1
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat-4
    model: my-model-path-alias-value
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 006f9177-d143-5b04-9031-fe71186cd1e6
          - plugin_id: 0441f68d-3e67-5f93-a299-05d5fddd7667
          - plugin_id: 7ac8c137-f428-5963-82fc-6b819697fb45
          - plugin_id: 7d351682-ce98-5820-89ff-785327bf53c5
      route_type: llm/v1/models
    route: models
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 7d351682-ce98-5820-89ff-785327bf53c5
      route_type: llm/v1/models
    route: models-ai-body-alias
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 7ac8c137-f428-5963-82fc-6b819697fb45
      route_type: llm/v1/models
    route: models-ai-default-alias
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 006f9177-d143-5b04-9031-fe71186cd1e6
      route_type: llm/v1/models
    route: models-ai-headers-alias
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 0441f68d-3e67-5f93-a299-05d5fddd7667
      route_type: llm/v1/models
    route: models-ai-path-alias
ai_models:
  - name: gpt-5-2-default-alias-config
  - name: my-body-alias-value
  - name: my-model-alias-header-value
  - name: my-model-path-alias-value
