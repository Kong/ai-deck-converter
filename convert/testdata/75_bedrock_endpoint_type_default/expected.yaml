_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /ai/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-ai
        paths:
          - /ai/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - id: 1e494187-2f5f-5dd7-858a-dc79a70ec7d5
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            aws_access_key_id: '{vault://ai/aws-access-key-id}'
            aws_secret_access_key: '{vault://ai/aws-secret-access-key}'
          description: anthropic.claude-3-5-sonnet
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: claude-bedrock
            name: anthropic.claude-3-5-sonnet
            options:
              anthropic_version: bedrock-2023-05-31
              bedrock:
                aws_region: us-east-1
              max_tokens: 1024
            provider: bedrock
          route_type: llm/v1/chat
    route: openai-chat
    model: claude-bedrock
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 1e494187-2f5f-5dd7-858a-dc79a70ec7d5
      route_type: llm/v1/models
    route: models
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 1e494187-2f5f-5dd7-858a-dc79a70ec7d5
      route_type: llm/v1/models
    route: models-ai
ai_models:
  - name: claude-bedrock
