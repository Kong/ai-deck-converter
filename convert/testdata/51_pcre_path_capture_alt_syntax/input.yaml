# PCRE path model extraction authored with the alternative named-capture
# spellings Konnect also accepts on input: "(?P<name>...)" and "(?'name'...)".
# Both must be detected and normalized to the "(?P<name>...)" form Konnect
# accepts on the emitted route paths and pcre_pattern. Regression for KOKO-4312
# / #150.
models:
  - name: alt-syntax-model
    type: model
    capabilities: [generate]
    formats:
      - type: openai
    config:
      route:
        paths:
          - '~/openai/(?P<openai_model>[^:/]+)'
          - "~/alternative/path/(?'openai_model'[^:/]+)"
        model:
          path:
            path_param: openai_model
      max_request_body_size: 2097152
    targets:
      - name: gpt-4o
        provider: openai-prod
        config:
          type: openai
    policies: []
    access:
      acls: {allow: [], deny: []}
model_providers:
  - name: openai-prod
    type: openai
    display_name: OpenAI Prod
    config:
      auth:
        type: basic
        headers:
          - name: Authorization
            value: "{vault://ai/openai-token}"
