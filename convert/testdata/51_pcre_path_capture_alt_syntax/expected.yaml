_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - ~/openai/(?P<openai_model>[^:/]+)/chat/completions
          - ~/alternative/path/(?P<openai_model>[^:/]+)/chat/completions
        methods:
          - POST
        strip_path: false
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - pcre_capture_name: openai_model
          pcre_pattern: ~/openai/(?P<openai_model>[^:/]+)
          source: path
        - pcre_capture_name: openai_model
          pcre_pattern: ~/alternative/path/(?P<openai_model>[^:/]+)
          source: path
    route: openai-chat
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      max_request_body_size: 2097152
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/openai-token}'
          description: gpt-4o
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: alt-syntax-model
            name: gpt-4o
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: alt-syntax-model
ai_models:
  - name: alt-syntax-model
