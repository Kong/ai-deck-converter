_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: gemini-enterprise-responses
        paths:
          - ~/ai/v1/projects/(?<project_id>[^/]+)/locations/(?<location_id>[^/]+)/interactions
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: gemini-enterprise-beta-responses
        paths:
          - ~/ai/v1beta1/projects/(?<project_id>[^/]+)/locations/(?<location_id>[^/]+)/interactions
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-ai
        paths:
          - /ai/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: gemini-enterprise-responses
  - id: 2c057547-fc75-58a9-b43f-99fcb3746dcf
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: gemini
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/gemini-token}'
          description: regional
          logging:
            log_payloads: false
            log_statistics: true
          model:
            name: regional
            options:
              gemini:
                location_id: us-central1
                project_id: my-project
              upstream_url: https://us-central1-aiplatform.googleapis.com/v1/projects/my-project/locations/us-central1/interactions
            provider: gemini
          route_type: llm/v1/responses
    route: gemini-enterprise-responses
    model: gemini-agentic
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: gemini-enterprise-beta-responses
  - id: 83207e9a-6cc8-566a-bb67-ea1e5c947a33
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: gemini
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/gemini-token}'
          description: regional
          logging:
            log_payloads: false
            log_statistics: true
          model:
            name: regional
            options:
              gemini:
                location_id: us-central1
                project_id: my-project
              upstream_url: https://us-central1-aiplatform.googleapis.com/v1beta1/projects/my-project/locations/us-central1/interactions
            provider: gemini
          route_type: llm/v1/responses
    route: gemini-enterprise-beta-responses
    model: gemini-agentic
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 2c057547-fc75-58a9-b43f-99fcb3746dcf
          - plugin_id: 83207e9a-6cc8-566a-bb67-ea1e5c947a33
      route_type: llm/v1/models
    route: models
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 2c057547-fc75-58a9-b43f-99fcb3746dcf
          - plugin_id: 83207e9a-6cc8-566a-bb67-ea1e5c947a33
      route_type: llm/v1/models
    route: models-ai
ai_models:
  - name: gemini-agentic
