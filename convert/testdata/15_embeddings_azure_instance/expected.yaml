_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /ai/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-ai
        paths:
          - /ai/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - id: 78f1e6f5-2e3d-5cd1-8597-4c1dc593cb32
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: semantic
        slots: 10000
      embeddings:
        auth:
          header_name: api-key
          header_value: '{vault://env/azure-embed-key}'
        model:
          name: text-embedding-ada-002
          options:
            azure:
              instance: my-azure-instance
          provider: azure
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://env/openai-key}'
          description: gpt-4o
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: semantic-lb
            name: gpt-4o
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: semantic-lb
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 78f1e6f5-2e3d-5cd1-8597-4c1dc593cb32
      route_type: llm/v1/models
    route: models
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 78f1e6f5-2e3d-5cd1-8597-4c1dc593cb32
      route_type: llm/v1/models
    route: models-ai
ai_models:
  - name: semantic-lb
