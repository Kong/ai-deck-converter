_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /auth/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-responses
        paths:
          - /auth/responses
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-audio-speech
        paths:
          - /auth/audio/speech
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-audio-transcribe
        paths:
          - /auth/audio/transcriptions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-audio-translate
        paths:
          - /auth/audio/translations
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-embeddings
        paths:
          - /auth/embeddings
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-images
        paths:
          - /auth/images/generations
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-videos
        paths:
          - /auth/videos
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-videos-lifecycle
        paths:
          - /auth/videos
        methods:
          - GET
          - DELETE
        strip_path: false
        tags:
          - aigw:video-lifecycle
consumers:
  - username: anonymous
    custom_id: anonymous
    plugins:
      - name: request-termination
        enabled: true
        config:
          message: Unauthorized
          status_code: 401
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/openai-token}'
          description: gpt-5.6
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: two-auth-strategies
            name: gpt-5.6
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: two-auth-strategies
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
