    username: token-vault-credential-manager-anonymous
    custom_id: token-vault-credential-manager-anonymous
plugins:
  - id: 566a0511-1863-5aa6-b34b-ea4d6afed819
    name: ai-mcp-proxy
    config:
      auth:
        provider: token_vault
        token_vault:
          credential:
            outbound:
              location: header
              name: x-api-key
              prefix: ""
          directory: my-directory
          provider: anthropic
          storage:
            backend: konnect
            current_version: v1
            keys:
              - key: '{vault://hcv/vault-enc-key}'
                version: v1
      include_consumer_groups: true
      logging:
        log_audits: false
        log_payloads: false
        log_statistics: true
      mode: passthrough-listener
      tools:
        - description: Get a report
          name: report
    route:
      id: b0d3e53d-2a03-51d9-886a-95a81bf161d7
  - id: fd304aa3-69b9-58cd-a501-d3f33f7b14f1
    name: openid-connect
    config:
      client_id:
        - 0oa1b2c3d4e5f6g7h8i9
      issuer: https://dev-123456.okta.com
    route:
      id: b0d3e53d-2a03-51d9-886a-95a81bf161d7
  - id: 8090a9c8-dcde-52c6-8a5b-777d70893ab8
    name: token-vault-callback-handler
    config:
      directory: my-directory
      storage:
        backend: konnect
        current_version: v1
        keys:
          - key: '{vault://hcv/vault-enc-key}'
            version: v1
    route:
