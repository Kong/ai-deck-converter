    service:
      id: 947a4e23-b483-5a65-8165-da9aed24565b
    paths:
      - /ai/v1/messages
    methods:
      - POST
      - OPTIONS
    protocols:
      - http
      - https
    strip_path: false
  - id: b0d3e53d-2a03-51d9-886a-95a81bf161d7
    name: tools-a-route
    service:
      id: 13704072-a3fe-518c-8a11-c4c8f57f62dc
