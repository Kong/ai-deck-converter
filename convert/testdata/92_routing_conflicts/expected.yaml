_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /selector/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-chat-2
        paths:
          - /split/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-chat-3
        paths:
          - /split/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
  - name: flights-mcp
    url: https://flights-mcp.example.com/mcp
    routes:
      - name: flights-mcp-route
        paths:
          - /mcp/flights
        plugins:
          - name: ai-mcp-proxy
            config:
              include_consumer_groups: true
              logging:
                log_audits: false
                log_payloads: false
                log_statistics: true
              mode: passthrough-listener
              tools: []
  - name: flights-writer
    url: https://flights.internal/api
    routes:
      - name: flights-writer-route
        paths:
          - /mcp/flights
        methods:
          - PUT
  - name: booking-reader
    url: https://booking.internal/api
    routes:
      - name: booking-reader-route
        paths:
          - /agents/booking
        methods:
          - GET
  - name: booking-writer
    url: https://booking.internal/api
    routes:
      - name: booking-writer-route
        paths:
          - /agents/booking
        methods:
          - PUT
  - name: hosts-specific
    url: https://hosts.internal/api
    routes:
      - name: hosts-specific-route
        paths:
          - /agents/hosts
        hosts:
          - api.example.com
  - name: hosts-any
    url: https://hosts.internal/api
    routes:
      - name: hosts-any-route
        paths:
          - /agents/hosts
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
        - header_name: x-model
          source: header
    route: openai-chat
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - description: gpt-5
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: selector-body
            name: gpt-5
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: selector-body
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - description: gpt-5
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: selector-header
            name: gpt-5
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: selector-header
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat-2
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - description: gpt-5
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: split-open
            name: gpt-5
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat-2
    model: split-open
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat-3
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - description: gpt-5
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: split-secured-a
            name: gpt-5
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat-3
    model: split-secured-a
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - description: gpt-5
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: split-secured-b
            name: gpt-5
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat-3
    model: split-secured-b
  - name: key-auth
    config:
      key_names:
        - x-api-key
    route: openai-chat-3
ai_models:
  - name: selector-body
  - name: selector-header
  - name: split-open
  - name: split-secured-a
  - name: split-secured-b
