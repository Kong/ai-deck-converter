model_providers:
  - name: openai
    type: openai
auth_strategies:
  - name: keys
    type: key-auth
    config:
      key_names: [x-api-key]
models:
  # The later model with the alias gpt is left out.
  - name: alias-first
    capabilities: [generate]
    targets: [{name: gpt-5, provider: openai}]
    config: {route: {paths: [/alias-first], model: {values: [gpt]}}}
  - name: alias-second
    capabilities: [generate]
    targets: [{name: gpt-5, provider: openai}]
    config: {route: {paths: [/alias-second], model: {values: [gpt]}}}
  # Both models share one route. They read the model name from different
  # sources.
  - name: selector-body
    capabilities: [generate]
    targets: [{name: gpt-5, provider: openai}]
    config: {route: {paths: [/selector]}}
  - name: selector-header
    capabilities: [generate]
    targets: [{name: gpt-5, provider: openai}]
    config: {route: {paths: [/selector], model: {header: {header_param: x-model}}}}
  # Different auth strategies split one base path into two equal routes.
  # The two secured models share the later route, so each one gets an issue.
  - name: split-open
    capabilities: [generate]
    targets: [{name: gpt-5, provider: openai}]
    config: {route: {paths: [/split]}}
  - name: split-secured-a
    capabilities: [generate]
    access: {auth_strategies: [keys]}
    targets: [{name: gpt-5, provider: openai}]
    config: {route: {paths: [/split]}}
  - name: split-secured-b
    capabilities: [generate]
    access: {auth_strategies: [keys]}
    targets: [{name: gpt-5, provider: openai}]
    config: {route: {paths: [/split]}}
mcp_servers:
  - type: passthrough-listener
    name: flights-mcp
    upstream_url: https://flights-mcp.example.com/mcp
    config: {route: {paths: [/mcp/flights]}}
    tools: []
agents:
  # flights-mcp sets no methods, so it also matches PUT.
  - type: http
    name: flights-writer
    config:
      url: https://flights.internal/api
      route: {paths: [/mcp/flights], methods: [PUT]}
  # These agents set different methods, so they do not conflict.
  - type: http
    name: booking-reader
    config:
      url: https://booking.internal/api
      route: {paths: [/agents/booking], methods: [GET]}
  - type: http
    name: booking-writer
    config:
      url: https://booking.internal/api
      route: {paths: [/agents/booking], methods: [PUT]}
  # The later route sets no hosts, so it also matches api.example.com.
  - type: http
    name: hosts-specific
    config:
      url: https://hosts.internal/api
      route: {paths: [/agents/hosts], hosts: [api.example.com]}
  - type: http
    name: hosts-any
    config:
      url: https://hosts.internal/api
      route: {paths: [/agents/hosts]}
