- code: ROUTING_CONFLICT
  reason: model "selector-header" and model "selector-body" share the route "openai-chat", but read the model name from different sources. The order of the ai-model-selector sources decides the model for a request that names a model in more than one source.
  source:
    kind: model
    name: selector-header
    fields:
      - config.route.model
  severity: WARNING
