- code: ROUTING_CONFLICT
  reason: model "alias-second" uses the alias "gpt", but model "alias-first" already uses it. The data plane requires a unique name for each ai_models entry.
  source:
    kind: model
    name: alias-second
    fields:
      - config.route.model.values
  severity: ERROR
- code: ROUTING_CONFLICT
  reason: model "selector-header" and model "selector-body" share the route "openai-chat-2", but read the model name from different sources. The order of the ai-model-selector sources decides the model for a request that names a model in more than one source.
  source:
    kind: model
    name: selector-header
    fields:
      - config.route.model
  severity: WARNING
