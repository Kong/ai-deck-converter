models:
  - type: model
    name: chat
    capabilities: [generate]
    formats: [{type: openai}]
    targets:
      - {name: gpt-4o, provider: openai-main, config: {type: openai}}

model_providers:
  - name: openai-main
    type: openai
    config:
      auth:
        header_name: Authorization
        header_value: Bearer sk-test

certificates:
  - name: upstream-tls
    cert: |
      -----BEGIN CERTIFICATE-----
      MIIBrsBgNVBAMMCnVwc3RyZWFtLTE=
      -----END CERTIFICATE-----
    key: |
      -----BEGIN PRIVATE KEY-----
      MIIBVAIBADANBgkqhkiG9w0BAQEFAA==
      -----END PRIVATE KEY-----
    labels:
      env: prod
      team: ai-platform
  - name: dual-algorithm
    cert: |
      -----BEGIN CERTIFICATE-----
      MIIBrsBgNVBAMMCmR1YWwtcnNhLTE=
      -----END CERTIFICATE-----
    key: |
      -----BEGIN PRIVATE KEY-----
      MIIBVAIBADANBgkqhkiG9w0BAQEFAB==
      -----END PRIVATE KEY-----
    cert_alt: |
      -----BEGIN CERTIFICATE-----
      MIIBrsBgNVBAMMC2R1YWwtZWNkc2E=
      -----END CERTIFICATE-----
    key_alt: |
      -----BEGIN EC PRIVATE KEY-----
      MHcCAQEEIQDkZmVjZHNhLWtleS0x
      -----END EC PRIVATE KEY-----
  - name: vault-referenced
    cert: "{vault://env-vault/cert}"
    key: "{vault://env-vault/key}"
