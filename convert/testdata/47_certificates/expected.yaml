_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - id: a7c1ab55-a97e-5888-87f3-dffdc67fbe83
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - description: gpt-4o
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: chat
            name: gpt-4o
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: chat
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: a7c1ab55-a97e-5888-87f3-dffdc67fbe83
      route_type: llm/v1/models
    route: models
certificates:
  - cert: |
      -----BEGIN CERTIFICATE-----
      MIIBrsBgNVBAMMCnVwc3RyZWFtLTE=
      -----END CERTIFICATE-----
    key: |
      -----BEGIN PRIVATE KEY-----
      MIIBVAIBADANBgkqhkiG9w0BAQEFAA==
      -----END PRIVATE KEY-----
    tags:
      - env:prod
      - team:ai-platform
  - cert: |
      -----BEGIN CERTIFICATE-----
      MIIBrsBgNVBAMMCmR1YWwtcnNhLTE=
      -----END CERTIFICATE-----
    key: |
      -----BEGIN PRIVATE KEY-----
      MIIBVAIBADANBgkqhkiG9w0BAQEFAB==
      -----END PRIVATE KEY-----
    cert_alt: |
      -----BEGIN CERTIFICATE-----
      MIIBrsBgNVBAMMC2R1YWwtZWNkc2E=
      -----END CERTIFICATE-----
    key_alt: |
