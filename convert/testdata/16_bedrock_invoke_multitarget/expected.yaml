_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: bedrock-invoke
        paths:
          - ~/ai/model/(?<model_name>[^/]+)/invoke(?:-with-response-stream)?
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-ai
        paths:
          - /ai/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - path_pattern: model/([^/]+)/
          source: path
    route: bedrock-invoke
  - id: cd6c9f1e-debd-51d7-b84d-f1c22ccd644b
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/embeddings
      llm_format: bedrock
      targets:
        - auth:
            aws_access_key_id: '{vault://ai/aws-access-key-id}'
            aws_secret_access_key: '{vault://ai/aws-secret-access-key}'
          description: amazon.titan-embed-text-v2:0
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: titan-embed-text-v2
            name: amazon.titan-embed-text-v2:0
            options:
              bedrock:
                aws_region: us-east-1
                embeddings_normalize: true
            provider: bedrock
          route_type: llm/v1/embeddings
    route: bedrock-invoke
    model: titan-embed-text-v2
  - id: 124d6707-f48b-539c-a11b-05c0dc202012
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: image/generation
      llm_format: bedrock
      targets:
        - auth:
            aws_access_key_id: '{vault://ai/aws-access-key-id}'
            aws_secret_access_key: '{vault://ai/aws-secret-access-key}'
          description: amazon.nova-canvas-v1:0
          logging:
            log_payloads: false
            log_statistics: false
          model:
            model_alias: nova-canvas-image
            name: amazon.nova-canvas-v1:0
            options:
              bedrock:
                aws_region: us-east-1
            provider: bedrock
          route_type: image/v1/images/generations
    route: bedrock-invoke
    model: nova-canvas-image
  - id: 3cda2386-178b-53ad-a7c2-a3545f0c5533
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: bedrock
      targets:
        - auth:
            aws_access_key_id: '{vault://ai/aws-access-key-id}'
            aws_secret_access_key: '{vault://ai/aws-secret-access-key}'
          description: amazon.nova-sonic-v1:0
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: nova-sonic-audio
            name: amazon.nova-sonic-v1:0
            options:
              bedrock:
                aws_region: us-east-1
            provider: bedrock
          route_type: llm/v1/chat
    route: bedrock-invoke
    model: nova-sonic-audio
  - id: f263b353-1807-551f-be31-0050b57e7011
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: video/generation
      llm_format: bedrock
      targets:
        - auth:
            aws_access_key_id: '{vault://ai/aws-access-key-id}'
            aws_secret_access_key: '{vault://ai/aws-secret-access-key}'
          description: amazon.nova-reel-v1:1
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: nova-reel-video
            name: amazon.nova-reel-v1:1
            options:
              bedrock:
                aws_region: us-east-1
                video_output_s3_uri: s3://kong/nova-reel/
            provider: bedrock
          route_type: video/v1/videos/generations
    route: bedrock-invoke
    model: nova-reel-video
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: cd6c9f1e-debd-51d7-b84d-f1c22ccd644b
          - plugin_id: 124d6707-f48b-539c-a11b-05c0dc202012
          - plugin_id: 3cda2386-178b-53ad-a7c2-a3545f0c5533
          - plugin_id: f263b353-1807-551f-be31-0050b57e7011
      route_type: llm/v1/models
    route: models
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: cd6c9f1e-debd-51d7-b84d-f1c22ccd644b
          - plugin_id: 124d6707-f48b-539c-a11b-05c0dc202012
          - plugin_id: 3cda2386-178b-53ad-a7c2-a3545f0c5533
          - plugin_id: f263b353-1807-551f-be31-0050b57e7011
      route_type: llm/v1/models
    route: models-ai
ai_models:
  - name: titan-embed-text-v2
  - name: nova-canvas-image
  - name: nova-sonic-audio
  - name: nova-reel-video
