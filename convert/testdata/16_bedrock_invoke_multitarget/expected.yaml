_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: bedrock-invoke
        paths:
          - ~/ai/model/(?<model_name>[^/]+)/invoke(?:-with-response-stream)?
        methods:
          - GET
          - POST
        strip_path: false
      - name: bedrock-videos
        paths:
          - /ai
        methods:
          - POST
        strip_path: false
      - name: bedrock-videos-lifecycle
        paths:
          - /ai
          - ~/ai/.+
        methods:
          - GET
          - DELETE
        strip_path: false
        tags:
          - aigw:video-lifecycle
plugins:
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/embeddings
      llm_format: bedrock
      targets:
        - auth:
            aws_access_key_id: '{vault://ai/aws-access-key-id}'
            aws_secret_access_key: '{vault://ai/aws-secret-access-key}'
          description: amazon.titan-embed-text-v2:0
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: '@bedrock/titan-embed-text-v2'
            name: amazon.titan-embed-text-v2:0
            options:
              bedrock:
                aws_region: us-east-1
                embeddings_normalize: true
            provider: bedrock
          route_type: llm/v1/embeddings
    route: bedrock-invoke
    model: titan-embed-text-v2
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: image/generation
      llm_format: bedrock
      targets:
        - auth:
            aws_access_key_id: '{vault://ai/aws-access-key-id}'
            aws_secret_access_key: '{vault://ai/aws-secret-access-key}'
          description: amazon.nova-canvas-v1:0
          logging:
            log_payloads: false
            log_statistics: false
          model:
            model_alias: '@bedrock/nova-canvas'
            name: amazon.nova-canvas-v1:0
            options:
              bedrock:
                aws_region: us-east-1
            provider: bedrock
          route_type: image/v1/images/generations
    route: bedrock-invoke
    model: nova-canvas-image
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: bedrock
      targets:
        - auth:
            aws_access_key_id: '{vault://ai/aws-access-key-id}'
            aws_secret_access_key: '{vault://ai/aws-secret-access-key}'
          description: amazon.nova-sonic-v1:0
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: '@bedrock/nova-sonic'
            name: amazon.nova-sonic-v1:0
            options:
              bedrock:
                aws_region: us-east-1
            provider: bedrock
          route_type: llm/v1/chat
    route: bedrock-invoke
    model: nova-sonic-audio
  - name: ai-model-selector
    config:
      body_path: model
      max_request_body_size: 8388608
      source: body
    route: bedrock-videos
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: video/generation
      llm_format: openai
      targets:
        - auth:
            aws_access_key_id: '{vault://ai/aws-access-key-id}'
            aws_secret_access_key: '{vault://ai/aws-secret-access-key}'
          description: amazon.nova-reel-v1:1
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: '@bedrock/nova-reel'
            name: amazon.nova-reel-v1:1
            options:
              bedrock:
                aws_region: us-east-1
                video_output_s3_uri: s3://kong/nova-reel/
            provider: bedrock
          route_type: video/v1/videos/generations
    route: bedrock-videos
    model: nova-reel-video
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: video/generation
      llm_format: openai
      model_name_header: false
      targets:
        - auth:
            aws_access_key_id: '{vault://ai/aws-access-key-id}'
            aws_secret_access_key: '{vault://ai/aws-secret-access-key}'
          description: amazon.nova-reel-v1:1
          logging:
            log_payloads: false
            log_statistics: true
          model:
            name: amazon.nova-reel-v1:1
            options:
              bedrock:
                aws_region: us-east-1
                video_output_s3_uri: s3://kong/nova-reel/
            provider: bedrock
          route_type: video/v1/videos/generations
    route: bedrock-videos-lifecycle
ai_models:
  - name: titan-embed-text-v2
    alias: '@bedrock/titan-embed-text-v2'
  - name: nova-canvas-image
    alias: '@bedrock/nova-canvas'
  - name: nova-sonic-audio
    alias: '@bedrock/nova-sonic'
  - name: nova-reel-video
    alias: '@bedrock/nova-reel'
