_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-passthrough
        paths:
          - /ai
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-ai
        paths:
          - /ai/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
plugins:
  - id: cfd58aac-0f6a-5128-adc6-652db08153d5
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      response_streaming: allow
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/openai-token}'
          description: gpt-5.2
          logging:
            log_payloads: false
            log_statistics: true
          model:
            name: gpt-5.2
            options:
              max_tokens: 1024
              temperature: 1
            provider: openai
          route_type: passthrough
    route: openai-passthrough
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: cfd58aac-0f6a-5128-adc6-652db08153d5
      route_type: llm/v1/models
    route: models
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: cfd58aac-0f6a-5128-adc6-652db08153d5
      route_type: llm/v1/models
    route: models-ai
ai_models:
  - id: 5b3e8cba-2cb7-4fd4-888e-20a6727230f2
    name: gpt-5-2
