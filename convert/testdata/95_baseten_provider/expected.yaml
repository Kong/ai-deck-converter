_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /baseten/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-baseten
        paths:
          - /baseten/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - id: 981b264a-1e5a-55bc-93c8-00cad8b04030
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            header_name: Authorization
            header_value: Bearer {vault://ai/baseten-token}
          description: deepseek-ai/DeepSeek-V4-Pro-0813
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: baseten-chat
            name: deepseek-ai/DeepSeek-V4-Pro-0813
            provider: baseten
          route_type: llm/v1/chat
        - auth:
            header_name: Authorization
            header_value: Bearer {vault://ai/baseten-token}
          description: my-served-model
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: baseten-chat
            name: my-served-model
            options:
              upstream_url: https://model-abc123.api.baseten.co/environments/production/sync/v1/chat/completions
            provider: baseten
          route_type: llm/v1/chat
    route: openai-chat
    model: baseten-chat
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 981b264a-1e5a-55bc-93c8-00cad8b04030
      route_type: llm/v1/models
    route: models
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 981b264a-1e5a-55bc-93c8-00cad8b04030
      route_type: llm/v1/models
    route: models-baseten
ai_models:
  - name: baseten-chat
