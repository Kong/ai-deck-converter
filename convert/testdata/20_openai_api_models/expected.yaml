_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-batches
        paths:
          - /ai/batches
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-files
        paths:
          - /ai/files
        methods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-ai
        paths:
          - /ai/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
plugins:
  - id: 69bb641c-2b97-5944-bb79-b775b5e2a797
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      model_name_header: false
      response_streaming: deny
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://env/openai-key}'
          description: batch-api
          logging:
            log_payloads: false
            log_statistics: false
          model:
            name: batch-api
            provider: openai
          route_type: llm/v1/batches
    route: openai-batches
  - id: 5c7bebfe-d8cd-5892-9576-3573a7dd3fb5
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      max_request_body_size: 536870912
      model_name_header: false
      response_streaming: deny
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://env/openai-key}'
          description: files-api
          logging:
            log_payloads: false
            log_statistics: true
          model:
            name: files-api
            provider: openai
          route_type: llm/v1/files
    route: openai-files
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 5c7bebfe-d8cd-5892-9576-3573a7dd3fb5
          - plugin_id: 69bb641c-2b97-5944-bb79-b775b5e2a797
      route_type: llm/v1/models
    route: models
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 5c7bebfe-d8cd-5892-9576-3573a7dd3fb5
          - plugin_id: 69bb641c-2b97-5944-bb79-b775b5e2a797
      route_type: llm/v1/models
    route: models-ai
ai_models:
  - name: openai-batch-api
  - name: openai-files-api
