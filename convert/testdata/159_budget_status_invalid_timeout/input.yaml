budget_status:
  enabled: true
  options:
    timeout: 50
models:
  - name: openai-gpt-5-4
    type: model
    capabilities: [generate]
    formats:
      - type: openai
    config:
      route:
        paths: [/ai]
    targets:
      - name: gpt-5.4
        provider: openai-prod
        config:
          type: openai
    access:
      auth_strategies: [team-keys]
model_providers:
  - name: openai-prod
    type: openai
    config:
      auth:
        type: basic
        headers:
          - name: Authorization
            value: "{vault://ai/openai-token}"
auth_strategies:
  - name: team-keys
    type: key-auth
    config:
      key_names: [x-api-key]
