agents:
  - name: booking
    type: a2a
    display_name: Booking
    config:
      targets:
        - address: booking-1.internal:8080
          weight: 200
        - address: booking-2.internal:8080
          failover: true
      balancer:
        algorithm: consistent-hashing
        hash_on_header: X-Session
      route:
        paths: [/booking]
  - name: plain
    type: http
    display_name: Plain
    config:
      targets:
        - address: a.internal:80
      balancer:
        algorithm: lowest-latency
      route:
        paths: [/plain]
  - name: nobalancer
    type: http
    display_name: No balancer
    config:
      targets:
        - address: c.internal:80
      route:
        paths: [/nobalancer]
