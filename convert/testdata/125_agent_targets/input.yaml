agents:
  - name: booking
    type: a2a
    display_name: Booking
    config:
      targets:
        - address: booking-1.internal:8443
          weight: 200
        - address: booking-2.internal:8443
      balancer:
        algorithm: consistent-hashing
        hash_on_header: X-Session
      path: /a2a
      route:
        paths: [/booking]
  - name: plain
    type: http
    display_name: Plain
    config:
      protocol: http
      targets:
        - address: a.internal:80
      balancer:
        algorithm: lowest-latency
      route:
        paths: [/plain]
  - name: nobalancer
    type: http
    display_name: No balancer
    config:
      targets:
        - address: c.internal:443
      route:
        paths: [/nobalancer]
  - name: failover
    type: http
    display_name: Failover
    config:
      targets:
        - address: primary.internal:443
        - address: backup.internal:443
          failover: true
      balancer:
        algorithm: least-connections
      route:
        paths: [/failover]
