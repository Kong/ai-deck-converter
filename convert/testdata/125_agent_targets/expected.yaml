_format_version: "3.0"
services:
  - name: booking
    host: booking-upstream
    protocol: https
    path: /a2a
    routes:
      - name: booking-route
        paths:
          - /booking
        plugins:
          - name: ai-a2a-proxy
            config:
              logging:
                log_payloads: false
                log_statistics: true
                max_payload_size: 1048576
  - name: plain
    host: plain-upstream
    protocol: http
    routes:
      - name: plain-route
        paths:
          - /plain
  - name: nobalancer
    host: nobalancer-upstream
    protocol: https
    routes:
      - name: nobalancer-route
        paths:
          - /nobalancer
  - name: failover
    host: failover-upstream
    protocol: https
    routes:
      - name: failover-route
        paths:
          - /failover
upstreams:
  - name: booking-upstream
    algorithm: consistent-hashing
    hash_on: header
    hash_on_header: X-Session
    healthchecks:
      active:
        type: tcp
        healthy:
          interval: 10
          successes: 2
        unhealthy:
          interval: 10
          tcp_failures: 3
          timeouts: 3
      passive:
        type: tcp
        unhealthy:
          tcp_failures: 3
          timeouts: 3
    targets:
      - target: booking-1.internal:8443
        weight: 200
      - target: booking-2.internal:8443
  - name: plain-upstream
    algorithm: latency
    healthchecks:
      active:
        type: tcp
        healthy:
          interval: 10
          successes: 2
        unhealthy:
          interval: 10
          tcp_failures: 3
          timeouts: 3
      passive:
        type: tcp
        unhealthy:
          tcp_failures: 3
          timeouts: 3
    targets:
      - target: a.internal:80
  - name: nobalancer-upstream
    algorithm: round-robin
    healthchecks:
      active:
        type: tcp
        healthy:
          interval: 10
          successes: 2
        unhealthy:
          interval: 10
          tcp_failures: 3
          timeouts: 3
      passive:
        type: tcp
        unhealthy:
          tcp_failures: 3
          timeouts: 3
    targets:
      - target: c.internal:443
  - name: failover-upstream
    algorithm: least-connections
    healthchecks:
      active:
        type: tcp
        healthy:
          interval: 10
          successes: 2
        unhealthy:
          interval: 10
          tcp_failures: 3
          timeouts: 3
      passive:
        type: tcp
        unhealthy:
          tcp_failures: 3
          timeouts: 3
    targets:
      - target: primary.internal:443
      - target: backup.internal:443
        failover: true
