_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /open/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
  - name: budget-status
    host: localhost
    routes:
      - name: budget-status
        paths:
          - /budgets
        methods:
          - GET
        plugins:
          - name: ai-proxy-advanced
            config:
              route_type: llm/v1/budgets
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 50000000
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      max_request_body_size: 50000000
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/openai-token}'
          description: gpt-5.4
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: open
            name: gpt-5.4
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: open
ai_models:
  - name: open
