_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /working/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-working
        paths:
          - /working/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - id: 17f5c4b9-9fd8-5eb3-9576-9781ed0822c0
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - description: gpt-4o
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: working
            name: gpt-4o
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: working
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 17f5c4b9-9fd8-5eb3-9576-9781ed0822c0
      route_type: llm/v1/models
    route: models
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: 17f5c4b9-9fd8-5eb3-9576-9781ed0822c0
      route_type: llm/v1/models
    route: models-working
ai_models:
  - name: working
