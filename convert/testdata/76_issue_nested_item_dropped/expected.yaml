_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /chat/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
  - name: tools
    host: localhost
    routes:
      - name: tools-route
        paths:
          - /mcp
        plugins:
          - name: ai-mcp-proxy
            config:
              include_consumer_groups: true
              logging:
                log_audits: false
                log_payloads: false
                log_statistics: true
              mode: conversion-listener
              tools:
                - description: A described tool
                  name: described
consumers:
  - username: alice
    keyauth_credentials:
      - key: '{vault://env/alice-key}'
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - description: gpt-4o
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: chat
            name: gpt-4o
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: chat
ai_models:
  - name: chat
