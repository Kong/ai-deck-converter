# ai-proxy-advanced writes the response in body_filter after these transformers
# would. Kong cannot order a plugin per phase, so the converter moves a
# model-scoped transformer below ai-proxy-advanced with a cloned plugin.
models:
  - type: model
    name: transformed-gpt
    capabilities: [generate]
    formats: [{type: openai}]
    targets:
      - name: gpt-4o
        provider: openai-main
        config: {type: openai}
    policies: [plain-body, advanced-body]
    config:
      route:
        paths: [/ai]
        model:
          values: [transformed-gpt]

model_providers:
  - type: openai
    name: openai-main
    config:
      auth:
        type: basic
        headers: [{name: Authorization, value: "{vault://env/openai-key}"}]

policies:
  - type: response-transformer
    name: plain-body
    config:
      remove:
        json: [service_tier]
      add:
        headers: ["X-Plain:yes"]
  - type: response-transformer-advanced
    name: advanced-body
    config:
      replace:
        json: ["model:replaced"]
      add:
        headers: ["X-Advanced:yes"]
