_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-files
        paths:
          - /mantle-files/v1/files
          - /mantle-files/openai/v1/files
        methods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-mantle-files
        paths:
          - /mantle-files/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
plugins:
  - id: ad258040-0677-5c8c-892f-4c69acca6305
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      model_name_header: false
      targets:
        - auth:
            aws_access_key_id: '{vault://ai/aws-access-key-id}'
            aws_secret_access_key: '{vault://ai/aws-secret-access-key}'
          description: openai.gpt-oss-120b
          logging:
            log_payloads: false
            log_statistics: true
          model:
            name: openai.gpt-oss-120b
            options:
              bedrock:
                aws_region: us-east-1
                endpoint_type: mantle
                mantle_openai_path_prefix: /v1
            provider: bedrock
          route_type: llm/v1/files
    route: openai-files
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: ad258040-0677-5c8c-892f-4c69acca6305
      route_type: llm/v1/models
    route: models
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: ad258040-0677-5c8c-892f-4c69acca6305
      route_type: llm/v1/models
    route: models-mantle-files
ai_models:
  - name: mantle-files
