_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /chat/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-chat
        paths:
          - /chat/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - id: a7c1ab55-a97e-5888-87f3-dffdc67fbe83
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - description: gpt-4o
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: chat
            name: gpt-4o
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: chat
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: a7c1ab55-a97e-5888-87f3-dffdc67fbe83
      route_type: llm/v1/models
    route: models
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: a7c1ab55-a97e-5888-87f3-dffdc67fbe83
      route_type: llm/v1/models
    route: models-chat
  - name: ai-prompt-guard
    config:
      deny_patterns:
        - .*secret.*
    route: openai-chat
    model: chat
ai_models:
  - name: chat
