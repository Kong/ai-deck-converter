_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /ai/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
routes:
  - name: budget-status
    paths:
      - /budgets
    plugins:
      - name: key-auth
        config:
          key_names:
            - x-api-key
      - name: ai-budget-status
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 50000000
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      max_request_body_size: 50000000
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/openai-token}'
          description: gpt-5.4
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: openai-gpt-5-4
            name: gpt-5.4
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: openai-gpt-5-4
  - name: key-auth
    config:
      key_names:
        - x-api-key
    route: openai-chat
ai_models:
  - name: openai-gpt-5-4
