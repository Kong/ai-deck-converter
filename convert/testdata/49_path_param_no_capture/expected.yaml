_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /v1/chat/completions/chat/completions
          - /v1/embeddings/chat/completions
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: openai-embeddings
        paths:
          - /v1/chat/completions/embeddings
          - /v1/embeddings/embeddings
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: models
        paths:
          - /v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-v1-chat-completions
        paths:
          - /v1/chat/completions/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
      - name: models-v1-embeddings
        paths:
          - /v1/embeddings/v1/models
        methods:
          - GET
        protocols:
          - http
          - https
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - id: f7363f34-c785-5d5f-9d9e-a0272f4aaca6
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      max_request_body_size: 8388608
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/openai-token}'
          description: gpt-4o
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: my-model-alias
            name: gpt-4o
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: my-model-alias
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-embeddings
  - id: c3811699-ae94-5631-b55d-5295cbc8f7be
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/embeddings
      llm_format: openai
      max_request_body_size: 8388608
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/openai-token}'
          description: gpt-4o
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: my-model-alias
            name: gpt-4o
            provider: openai
          route_type: llm/v1/embeddings
    route: openai-embeddings
    model: my-model-alias
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: c3811699-ae94-5631-b55d-5295cbc8f7be
          - plugin_id: f7363f34-c785-5d5f-9d9e-a0272f4aaca6
      route_type: llm/v1/models
    route: models
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: c3811699-ae94-5631-b55d-5295cbc8f7be
          - plugin_id: f7363f34-c785-5d5f-9d9e-a0272f4aaca6
      route_type: llm/v1/models
    route: models-v1-chat-completions
  - name: ai-proxy-advanced
    config:
      models:
        sources:
          - plugin_id: c3811699-ae94-5631-b55d-5295cbc8f7be
          - plugin_id: f7363f34-c785-5d5f-9d9e-a0272f4aaca6
      route_type: llm/v1/models
    route: models-v1-embeddings
ai_models:
  - name: my-model-alias
