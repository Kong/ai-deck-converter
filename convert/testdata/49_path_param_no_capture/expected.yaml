_format_version: "3.0"
services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /v1/chat/completions/chat/completions
          - /v1/embeddings/chat/completions
        methods:
          - POST
        strip_path: false
      - name: openai-embeddings
        paths:
          - /v1/chat/completions/embeddings
          - /v1/embeddings/embeddings
        methods:
          - POST
        strip_path: false
plugins:
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-chat
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      max_request_body_size: 8388608
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/openai-token}'
          description: gpt-4o
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: my-model-alias
            name: gpt-4o
            provider: openai
          route_type: llm/v1/chat
    route: openai-chat
    model: my-model-alias
  - name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route: openai-embeddings
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/embeddings
      llm_format: openai
      max_request_body_size: 8388608
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/openai-token}'
          description: gpt-4o
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: my-model-alias
            name: gpt-4o
            provider: openai
          route_type: llm/v1/embeddings
    route: openai-embeddings
    model: my-model-alias
ai_models:
  - name: my-model-alias
