# A key-auth strategy with principals enabled and a principals_cache pepper.
# The pepper config passes through to the key-auth plugin unchanged.
auth_strategies:
  - display_name: Key Auth
    name: key-auth-principals
    type: key-auth
    config:
      principals:
        enabled: true
        directory: my-directory
      principals_cache:
        pepper: '{vault://env/principals-cache-pepper}'
models:
  - display_name: OpenAI Prod - GPT-5.4
    name: openai-gpt-5-4
    type: model
    capabilities: [generate]
    formats:
      - type: openai
    config:
      route:
        paths: [/ai]
    targets:
      - name: gpt-5.4
        provider: openai-prod
        config:
          type: openai
    access:
      auth_strategies: [key-auth-principals]
model_providers:
  - name: openai-prod
    type: openai
    display_name: OpenAI Prod
    config:
      auth:
        type: basic
        headers:
          - name: Authorization
            value: "{vault://ai/openai-token}"
