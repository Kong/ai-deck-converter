datastores:
  - name: vault-konnect-prod
    type: token-vault
    config:
      directory: my-directory
      current_version: v1
      keys:
        - version: v1
          key: "{vault://hcv/vault-enc-key}"

mcp_servers:
  - name: github-tools
    datastores: [{name: vault-konnect-prod}]
    token_vault:
      provider: github
      subject_token_type: api_key
      credential:                        # lowered to auth.token_vault.credential (pr6)
        inbound:                         # the MCP client token arrives on Authorization
          location: header
          name: Authorization
          prefix: "Bearer "
        outbound:
          location: header
          name: Authorization
          prefix: "Bearer "
      # storage block omitted - datastore populates it
      cache: # optional and per-consumer
        redis:
          host: redis.internal
          port: 6379
