_format_version: "3.0"
_transform: false
services:
  - id: 947a4e23-b483-5a65-8165-da9aed24565b
    name: ai-gateway
    url: http://ai-gateway.upstream.local
    host: ai-gateway.upstream.local
    port: 80
    protocol: http
routes:
  - id: 52c3553f-4cf4-5d0f-a934-7e32ed395aa8
    name: openai-decisions
    service:
      id: 947a4e23-b483-5a65-8165-da9aed24565b
    paths:
      - /ai-decisions/decisions
    methods:
      - POST
      - OPTIONS
    protocols:
      - http
      - https
    strip_path: false
plugins:
  - id: 17fa8192-4b9f-5b5a-8379-20ad8bc836a7
    name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route:
      id: 52c3553f-4cf4-5d0f-a934-7e32ed395aa8
  - id: f3adc007-171c-5519-8763-3a0eef79bde3
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/openai-token}'
          description: gpt-6-luna
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: gpt-6-luna-decisions
            name: gpt-6-luna
            provider: openai
          route_type: llm/v1/decisions
    route:
      id: 52c3553f-4cf4-5d0f-a934-7e32ed395aa8
    model:
      id: 4a01ae32-0f6d-5750-ba6d-55849ed6cce9
ai_models:
  - id: 4a01ae32-0f6d-5750-ba6d-55849ed6cce9
    name: gpt-6-luna-decisions
