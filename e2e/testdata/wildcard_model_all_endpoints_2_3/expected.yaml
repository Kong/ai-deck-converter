plugins:
  - id: 17fa8192-4b9f-5b5a-8379-20ad8bc836a7
    name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route:
      id: 8ae36805-da7a-55b9-b056-72bde6bb937d
  - id: f3adc007-171c-5519-8763-3a0eef79bde3
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - description: gpt-5.4
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: every-endpoint
            name: gpt-5.4
            provider: openai
          route_type: llm/v1/chat
        - auth:
            header_name: api-key
            header_value: e2e-fake-azure-key
          description: gpt-5-4
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: every-endpoint
            name: gpt-5-4
            options:
              azure_api_version: "2024-10-21"
              azure_deployment_id: gpt-5-4
              azure_instance: kong-e2e
            provider: azure
          route_type: llm/v1/chat
        - auth:
            header_name: x-api-key
            header_value: e2e-fake-anthropic-key
          description: claude-sonnet-4-5
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: every-endpoint
            name: claude-sonnet-4-5
            options:
              anthropic_version: "2023-06-01"
            provider: anthropic
          route_type: llm/v1/chat
        - description: command-r
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: every-endpoint
            name: command-r
            provider: cohere
          route_type: llm/v1/chat
        - description: mistral-large
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: every-endpoint
            name: mistral-large
            options:
              mistral_format: openai
            provider: mistral
          route_type: llm/v1/chat
        - description: llama-3
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: every-endpoint
            name: llama-3
            options:
              llama2_format: openai
              upstream_url: http://llama.e2e.local:8080/v1/chat/completions
            provider: llama2
          route_type: llm/v1/chat
        - auth:
            header_name: x-goog-api-key
            header_value: e2e-fake-gemini-key
          description: gemini-2.5-pro
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: every-endpoint
            name: gemini-2.5-pro
            provider: gemini
          route_type: llm/v1/chat
        - auth:
            aws_access_key_id: e2e-fake-access-key-id
            aws_secret_access_key: e2e-fake-secret-access-key
          description: amazon.nova-pro-v1:0
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: every-endpoint
            name: amazon.nova-pro-v1:0
            options:
              bedrock:
                aws_region: us-east-1
            provider: bedrock
          route_type: llm/v1/chat
        - description: hf-zephyr
