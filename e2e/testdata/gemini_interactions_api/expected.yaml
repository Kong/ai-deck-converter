_format_version: "3.0"
_transform: false
services:
  - id: 947a4e23-b483-5a65-8165-da9aed24565b
    name: ai-gateway
    url: http://ai-gateway.upstream.local
    host: ai-gateway.upstream.local
    port: 80
    protocol: http
routes:
  - id: d13c1734-7773-5150-a0c3-4e7816185423
    name: gemini-responses
    service:
      id: 947a4e23-b483-5a65-8165-da9aed24565b
    paths:
      - /gemini/v1/interactions
    methods:
      - GET
      - POST
      - OPTIONS
    protocols:
      - http
      - https
    strip_path: false
  - id: c1264434-e7f1-576d-ba87-6d40613b3401
    name: gemini-beta-responses
    service:
      id: 947a4e23-b483-5a65-8165-da9aed24565b
    paths:
      - /gemini/v1beta/interactions
    methods:
      - GET
      - POST
      - OPTIONS
    protocols:
      - http
      - https
    strip_path: false
  - id: d9a05919-b5fa-5cc5-bd04-e46b5ddc0cc5
    name: gemini-enterprise-responses
    service:
      id: 947a4e23-b483-5a65-8165-da9aed24565b
    paths:
      - ~/gemini/v1/projects/(?<project_id>[^/]+)/locations/(?<location_id>[^/]+)/interactions
    methods:
      - GET
      - POST
      - OPTIONS
    protocols:
      - http
      - https
    strip_path: false
  - id: 724a665f-6f8b-5076-8ab1-a438d7025c2e
    name: gemini-enterprise-beta-responses
    service:
      id: 947a4e23-b483-5a65-8165-da9aed24565b
    paths:
      - ~/gemini/v1beta1/projects/(?<project_id>[^/]+)/locations/(?<location_id>[^/]+)/interactions
    methods:
      - GET
      - POST
      - OPTIONS
    protocols:
      - http
      - https
    strip_path: false
plugins:
  - id: 17fa8192-4b9f-5b5a-8379-20ad8bc836a7
    name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route:
      id: d13c1734-7773-5150-a0c3-4e7816185423
  - id: f3adc007-171c-5519-8763-3a0eef79bde3
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: gemini
      targets:
        - auth:
            header_name: x-goog-api-key
            header_value: e2e-fake-gemini-key
          description: gemini-2.5-pro
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: gemini-agentic
            name: gemini-2.5-pro
            provider: gemini
          route_type: llm/v1/responses
    route:
