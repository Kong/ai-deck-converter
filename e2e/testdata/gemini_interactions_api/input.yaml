# The Gemini Interactions API: a gemini model with the agentic capability
# gets the Gemini interactions routes for a public target and the Gemini
# Enterprise routes for a target with a full gcp_environment, v1 and beta.
# Each target has route_type llm/v1/responses in the gemini format.
models:
  - name: gemini-agentic
    type: model
    capabilities: [agentic]
    formats: [{type: gemini}]
    config:
      route: {paths: [/gemini]}
    targets:
      - name: gemini-2.5-pro
        provider: gemini-prod
        config: {type: gemini}
      - name: gemini-2.5-pro-enterprise
        provider: gemini-prod
        config:
          type: gemini
          gcp_environment:
            api_endpoint: https://us-central1-aiplatform.googleapis.com
            project_id: my-project
            location_id: us-central1
model_providers:
  - name: gemini-prod
    type: gemini
    config:
      auth:
        type: basic
        headers: [{name: x-goog-api-key, value: e2e-fake-gemini-key}]
