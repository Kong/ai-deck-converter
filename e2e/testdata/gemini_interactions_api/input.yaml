# The Gemini Interactions API: a gemini model with the agentic capability
# gets the Gemini and Gemini Enterprise interactions routes, v1 and beta.
# Each target has route_type llm/v1/responses in the gemini format.
models:
  - name: gemini-agentic
    type: model
    capabilities: [agentic]
    formats: [{type: gemini}]
    config:
      route: {paths: [/gemini]}
    targets:
      - name: gemini-2.5-pro
        provider: gemini-prod
model_providers:
  - name: gemini-prod
    type: gemini
    config:
      auth:
        type: basic
        headers: [{name: x-goog-api-key, value: e2e-fake-gemini-key}]
