_format_version: "3.0"
_transform: false
services:
  - id: 241af9b7-9306-529b-997b-c86240493d60
    name: vendor
    url: http://host.docker.internal:18087/mcp
    host: host.docker.internal
    port: 18087
    protocol: http
    path: /mcp
  - id: 7970f0af-ce3f-5521-b15b-c02090fb7ef8
    name: claims
    url: http://host.docker.internal:18087/mcp
    host: host.docker.internal
    port: 18087
    protocol: http
    path: /mcp
  - id: 22b7ecbb-f15d-5ff9-9e63-107e087179ea
    name: reports
    url: http://host.docker.internal:18088
    host: host.docker.internal
    port: 18088
    protocol: http
routes:
  - id: 1949b1d0-ad0e-51d8-8006-2fd707e7eb2f
    name: vendor-route
    service:
      id: 241af9b7-9306-529b-997b-c86240493d60
    paths:
      - /mcp/vendor
      - /mcp/vendor/.well-known/oauth-protected-resource
    protocols:
      - http
      - https
  - id: eb80dd89-4bf0-57bb-af51-d412da34ccc4
    name: claims-route
    service:
      id: 7970f0af-ce3f-5521-b15b-c02090fb7ef8
    paths:
      - /mcp/claims
      - /mcp/claims/.well-known/oauth-protected-resource
    protocols:
      - http
      - https
  - id: ec9415ea-8a9e-54c0-98f8-ccf706691acd
    name: reports-route
    service:
      id: 22b7ecbb-f15d-5ff9-9e63-107e087179ea
    paths:
      - /mcp/reports
      - /mcp/reports/.well-known/oauth-protected-resource
    protocols:
      - http
      - https
plugins:
  - id: 85c0bd6c-91d6-515f-80d0-d1fabd279191
    name: ai-mcp-proxy
    config:
      include_consumer_groups: true
      logging:
        log_audits: false
        log_payloads: false
        log_statistics: true
      mode: passthrough-listener
      tools: []
    route:
      id: 1949b1d0-ad0e-51d8-8006-2fd707e7eb2f
  - id: 414d6db3-7deb-5f03-9895-57ef8bdb4ff4
    name: acl
    config:
      allow:
        - mcp-allowed
      include_consumer_groups: true
    route:
      id: 1949b1d0-ad0e-51d8-8006-2fd707e7eb2f
  - id: f9517cee-088d-559f-8598-9ed32a347924
    name: openid-connect
    config:
      auth_methods:
        - bearer
      authenticated_groups_claim:
        - groups
      issuer: http://host.docker.internal:18090
      protected_resource_metadata:
        authorization_servers:
          - http://host.docker.internal:18090
        metadata_endpoint: /mcp/vendor/.well-known/oauth-protected-resource
        resource: http://localhost/mcp/vendor
      upstream_access_token_header: null
    route:
      id: 1949b1d0-ad0e-51d8-8006-2fd707e7eb2f
  - id: 6b624042-a0e9-529e-aa3d-da8cfcb978e1
    name: ai-mcp-proxy
    config:
      access_token_claim_field: email
      acl_attribute_type: oauth_access_token
      default_acl:
        - allow:
            - alice@example.com
      logging:
        log_audits: false
        log_payloads: false
        log_statistics: true
      mode: passthrough-listener
      tools: []
    route:
      id: eb80dd89-4bf0-57bb-af51-d412da34ccc4
  - id: e44c0ca4-f023-55bc-99f9-d1ff98c67a59
    name: openid-connect
    config:
      auth_methods:
        - bearer
      authenticated_groups_claim:
        - groups
      issuer: http://host.docker.internal:18090
      protected_resource_metadata:
        authorization_servers:
          - http://host.docker.internal:18090
        metadata_endpoint: /mcp/claims/.well-known/oauth-protected-resource
        resource: http://localhost/mcp/claims
      upstream_access_token_header: null
    route:
      id: eb80dd89-4bf0-57bb-af51-d412da34ccc4
  - id: f72d8dc5-9056-5949-8dec-a39f087834de
    name: ai-mcp-proxy
    config:
      include_consumer_groups: true
      logging:
        log_audits: false
        log_payloads: false
        log_statistics: true
      mode: conversion-listener
      tools:
        - description: List reports
          method: GET
          name: list-reports
          path: reports
    route:
      id: ec9415ea-8a9e-54c0-98f8-ccf706691acd
  - id: faee02a6-8c08-5aed-b827-aad05d6a0b8c
    name: openid-connect
    config:
      auth_methods:
        - bearer
      authenticated_groups_claim:
        - groups
      issuer: http://host.docker.internal:18090
      protected_resource_metadata:
        authorization_servers:
          - http://host.docker.internal:18090
        metadata_endpoint: /mcp/reports/.well-known/oauth-protected-resource
        resource: http://localhost/mcp/reports
      upstream_access_token_header: null
    route:
      id: ec9415ea-8a9e-54c0-98f8-ccf706691acd
