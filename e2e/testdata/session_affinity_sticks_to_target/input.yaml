# Two targets behind a round-robin balancer with session affinity. The harness
# rewrites both upstream_url values to its mock servers.
models:
  - display_name: Sticky model
    name: sticky-model
    type: model
    enabled: true
    capabilities: [ generate ]
    formats:
      - type: openai
    config:
      route:
        paths: [ /sticky ]
      balancer:
        algorithm: round-robin
        session_affinity:
          enabled: true
          storage:
            type: local
    targets:
      - name: target-a
        provider: openai-prod
        config:
          type: openai
          upstream_url: http://host.docker.internal:1
      - name: target-b
        provider: openai-prod
        config:
          type: openai
          upstream_url: http://host.docker.internal:2
model_providers:
  - name: openai-prod
    type: openai
    display_name: OpenAI Prod
    config:
      auth:
        type: basic
        headers:
          - name: Authorization
            value: "{vault://ai/openai-token}"
