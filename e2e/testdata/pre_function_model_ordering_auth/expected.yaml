_format_version: "3.0"
_transform: false
services:
  - id: 947a4e23-b483-5a65-8165-da9aed24565b
    name: ai-gateway
    url: http://ai-gateway.upstream.local
    host: ai-gateway.upstream.local
    port: 80
    protocol: http
routes:
  - id: 8ae36805-da7a-55b9-b056-72bde6bb937d
    name: openai-chat
    service:
      id: 947a4e23-b483-5a65-8165-da9aed24565b
    paths:
      - /ai-auth-ordering-probe/chat/completions
    methods:
      - POST
      - OPTIONS
    protocols:
      - http
      - https
    strip_path: false
consumers:
  - id: aaf5d390-0039-5f1f-ae42-fc9efb2681d0
    username: ordering-probe-user
plugins:
  - id: 17fa8192-4b9f-5b5a-8379-20ad8bc836a7
    name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    ordering:
      before:
        access:
          - pre-function
      after:
        access:
          - key-auth
    route:
      id: 8ae36805-da7a-55b9-b056-72bde6bb937d
  - id: f3adc007-171c-5519-8763-3a0eef79bde3
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/openai-token}'
          description: gpt-4o
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: auth-ordering-probe-alias
            name: gpt-4o
            provider: openai
          route_type: llm/v1/chat
    route:
      id: 8ae36805-da7a-55b9-b056-72bde6bb937d
    model:
      id: 9cf02bae-79d7-5f1b-a217-70a5be250097
  - id: e18572f7-545a-5e86-9d5d-e1bad613b300
    name: pre-function
    config:
      access:
        - |
          local model = ngx.ctx.ai_model
          return kong.response.exit(200, { selected_model = model and model.name or ngx.null })
    route:
      id: 8ae36805-da7a-55b9-b056-72bde6bb937d
    model:
      id: 9cf02bae-79d7-5f1b-a217-70a5be250097
  - id: b90f64de-6509-53c4-921f-8953bb636ad6
    name: key-auth
    config:
      key_names:
        - x-api-key
    route:
      id: 8ae36805-da7a-55b9-b056-72bde6bb937d
ai_models:
  - id: 9cf02bae-79d7-5f1b-a217-70a5be250097
    name: auth-ordering-probe-alias
keyauth_credentials:
  - id: dd2b10eb-90b0-5041-81b6-9adf222847e0
    key: ordering-probe-secret
    consumer: aaf5d390-0039-5f1f-ae42-fc9efb2681d0
