mcp_servers:
  # A passthrough MCP server whose upstream credential is resolved per request
  # via Kong's Token Vault. Until a caller enrolls (bearer-token exchange
  # returns x_kong_enrollment_required), the plugin serves the virtual
  # `token_vault_authenticate` / `token_vault_check_authentication_status`
  # tools instead of the upstream's real tools; once enrolled, the exchanged
  # credential is applied to the proxied requests. The cache shares exchanged
  # credentials across nodes.
  - type: passthrough-listener
    display_name: Vaulted Vendor MCP
    name: vaulted-vendor-mcp
    upstream_url: http://host.docker.internal:18081
    datastores: [{name: vault-konnect-prod}]
    token_vault:
      directory: my-directory
      provider: my-upstream-provider
      cache:
        redis:
          host: mcp-tv-redis
          port: 6379
          database: 0
    config:
      route: {name: vaulted-vendor-route, paths: [/mcp/vaulted]}
    tools: []
