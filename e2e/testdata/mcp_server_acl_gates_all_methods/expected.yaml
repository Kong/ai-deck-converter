    name: ai-mcp-proxy
    config:
      include_consumer_groups: true
      logging:
        log_audits: false
        log_payloads: false
        log_statistics: true
      mode: conversion-listener
      server:
        forward_client_headers: true
      tools:
        - description: List reports
          method: GET
          name: list-reports
          path: reports
