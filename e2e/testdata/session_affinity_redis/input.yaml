# One model with redis session affinity. The storage keeps the nested API blocks
# that the plugin schema flattens. The harness rewrites the targets and the
# redis address.
models:
  - display_name: Sticky redis model
    name: sticky-redis-model
    type: model
    enabled: true
    capabilities: [ generate ]
    formats:
      - type: openai
    config:
      route:
        paths: [ /sticky-redis ]
      balancer:
        algorithm: round-robin
        session_affinity:
          enabled: true
          storage:
            type: redis
            host: redis.internal
            port: 6379
            keepalive:
              pool_size: 256
              backlog: 20
    targets:
      - name: target-a
        provider: openai-prod
        config:
          type: openai
          upstream_url: http://host.docker.internal:1
      - name: target-b
        provider: openai-prod
        config:
          type: openai
          upstream_url: http://host.docker.internal:2
model_providers:
  - name: openai-prod
    type: openai
    display_name: OpenAI Prod
    config:
      auth:
        type: basic
        headers:
          - name: Authorization
            value: "{vault://ai/openai-token}"
