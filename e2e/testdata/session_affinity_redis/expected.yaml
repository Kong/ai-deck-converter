_format_version: "3.0"
_transform: false
services:
  - id: 947a4e23-b483-5a65-8165-da9aed24565b
    name: ai-gateway
    url: http://ai-gateway.upstream.local
    host: ai-gateway.upstream.local
    port: 80
    protocol: http
routes:
  - id: 8ae36805-da7a-55b9-b056-72bde6bb937d
    name: openai-chat
    service:
      id: 947a4e23-b483-5a65-8165-da9aed24565b
    paths:
      - /sticky-redis/chat/completions
    methods:
      - POST
      - OPTIONS
    protocols:
      - http
      - https
    strip_path: false
plugins:
  - id: 17fa8192-4b9f-5b5a-8379-20ad8bc836a7
    name: ai-model-selector
    config:
      max_request_body_size: 50000000
      sources:
        - body_path: model
          source: body
    route:
      id: 8ae36805-da7a-55b9-b056-72bde6bb937d
  - id: f3adc007-171c-5519-8763-3a0eef79bde3
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      conversation_state:
        enabled: true
        redis:
          host: redis.internal
          keepalive_backlog: 20
          keepalive_pool_size: 256
          port: 6379
        strategy: redis
      genai_category: text/generation
      llm_format: openai
      max_request_body_size: 50000000
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/openai-token}'
          description: target-a
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: sticky-redis-model
            name: target-a
            options:
              upstream_url: http://host.docker.internal:1
            provider: openai
          route_type: llm/v1/chat
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/openai-token}'
          description: target-b
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: sticky-redis-model
            name: target-b
            options:
              upstream_url: http://host.docker.internal:2
            provider: openai
          route_type: llm/v1/chat
    route:
      id: 8ae36805-da7a-55b9-b056-72bde6bb937d
    model:
      id: 901b49bd-1ab1-5d65-a100-0f6671807a5c
ai_models:
  - id: 901b49bd-1ab1-5d65-a100-0f6671807a5c
    name: sticky-redis-model
