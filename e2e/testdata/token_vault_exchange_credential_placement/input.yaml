models:
  - name: claude
    type: model
    capabilities: [generate]
    formats:
      - type: anthropic
    config:
      route:
        paths: [/explicit]
    targets:
      - name: claude-sonnet
        provider: anthropic-vault
        config:
          type: anthropic
  - name: gpt
    type: model
    capabilities: [generate]
    formats:
      - type: openai
    config:
      route:
        paths: [/defaults]
    targets:
      - name: gpt-5.2
        provider: openai-vault
        config:
          type: openai

model_providers:
  - name: anthropic-vault
    type: anthropic
    datastores: [{name: vault-konnect-prod}]
    token_vault:
      provider: anthropic
      subject_token_type: api_key
      credential:
        inbound:
          location: header
          name: x-api-key
          prefix: ""
        outbound:
          location: header
          name: x-api-key
          prefix: ""
  - name: openai-vault
    type: openai
    datastores: [{name: vault-konnect-prod}]
    token_vault:
      provider: openai
