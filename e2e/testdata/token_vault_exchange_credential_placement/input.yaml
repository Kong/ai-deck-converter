# Two vaulted providers drive token-vault-exchange on two model routes.
# anthropic-vault pins every credential lever: the subject token type, an
# x-api-key inbound placement with no prefix, and the same outbound. openai-vault
# omits them all, so the plugin defaults and the vault's bearer-method
# advertisement decide. The callback route comes from the datastore.
