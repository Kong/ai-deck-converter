      - POST
      - OPTIONS
    protocols:
      - http
      - https
    strip_path: false
  - id: bb559a54-dc17-5c0f-b946-b0d9c5cebd7a
    name: anthropic-messages
    service:
      id: 947a4e23-b483-5a65-8165-da9aed24565b
    paths:
      - /mantle-vpc-anthropic/v1/messages
    methods:
      - POST
      - OPTIONS
    protocols:
      - http
      - https
    strip_path: false
  - id: b433d478-0f40-5518-b6bb-815583936241
    name: openai-files
    service:
      id: 947a4e23-b483-5a65-8165-da9aed24565b
