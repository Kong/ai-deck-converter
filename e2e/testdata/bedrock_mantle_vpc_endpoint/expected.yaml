    name: openai-chat
    service:
      id: 947a4e23-b483-5a65-8165-da9aed24565b
    paths:
      - /mantle-vpc-openai/chat/completions
    methods:
      - POST
      - OPTIONS
    protocols:
      - http
      - https
    strip_path: false
  - id: 1a3f650c-2709-5e79-a792-7ffd18243fbf
    name: openai-responses
    service:
      id: 947a4e23-b483-5a65-8165-da9aed24565b
