_format_version: "3.0"
_transform: false
services:
  - id: 947a4e23-b483-5a65-8165-da9aed24565b
    name: ai-gateway
    url: http://ai-gateway.upstream.local
    host: ai-gateway.upstream.local
    port: 80
    protocol: http
routes:
  - id: 8ae36805-da7a-55b9-b056-72bde6bb937d
    name: openai-chat
    service:
      id: 947a4e23-b483-5a65-8165-da9aed24565b
    paths:
      - /ai-ordering-probe/chat/completions
    methods:
      - POST
    protocols:
      - http
      - https
    strip_path: false
plugins:
  - id: 17fa8192-4b9f-5b5a-8379-20ad8bc836a7
    name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - body_path: model
          source: body
    route:
      id: 8ae36805-da7a-55b9-b056-72bde6bb937d
  - id: f3adc007-171c-5519-8763-3a0eef79bde3
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/openai-token}'
          description: gpt-4o
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: ordering-probe-alias-one
            name: gpt-4o
            provider: openai
          route_type: llm/v1/chat
    route:
      id: 8ae36805-da7a-55b9-b056-72bde6bb937d
    model:
      id: 59d0dfe0-0ba4-5e7d-aea2-2b0c4e0c2cac
  - id: fe4129f3-2075-5492-8b59-90def2cf73ab
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: openai
      targets:
        - auth:
            header_name: Authorization
            header_value: '{vault://ai/openai-token}'
          description: gpt-4o
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: ordering-probe-alias-two
            name: gpt-4o
            provider: openai
          route_type: llm/v1/chat
    route:
      id: 8ae36805-da7a-55b9-b056-72bde6bb937d
    model:
      id: 5b33a0d9-1bc4-51f3-a699-3aef2f6c1913
  - id: b87bf838-6a66-5b0b-a095-d1f788cb8ba9
    name: pre-function
    config:
      access:
        - |
          local model = ngx.ctx.ai_model
          return kong.response.exit(200, { selected_model = model and model.name or ngx.null })
    ordering:
      before:
        access:
          - ai-proxy-advanced
      after:
        access:
          - ai-model-selector
    route:
      id: 8ae36805-da7a-55b9-b056-72bde6bb937d
    model:
      id: 59d0dfe0-0ba4-5e7d-aea2-2b0c4e0c2cac
  - id: 3bf0455b-d140-5afe-b82a-4939a79d1dd4
    name: pre-function
    config:
      access:
        - |
          local model = ngx.ctx.ai_model
          return kong.response.exit(200, { selected_model = model and model.name or ngx.null })
    ordering:
      before:
        access:
          - ai-proxy-advanced
      after:
        access:
          - ai-model-selector
    route:
      id: 8ae36805-da7a-55b9-b056-72bde6bb937d
    model:
      id: 5b33a0d9-1bc4-51f3-a699-3aef2f6c1913
ai_models:
  - id: 59d0dfe0-0ba4-5e7d-aea2-2b0c4e0c2cac
    name: ordering-probe-alias-one
    tags:
      - ai-gateway-model-alias-group:ordering-probe-alias-one
  - id: 5b33a0d9-1bc4-51f3-a699-3aef2f6c1913
    name: ordering-probe-alias-two
    tags:
      - ai-gateway-model-alias-group:ordering-probe-alias-one
