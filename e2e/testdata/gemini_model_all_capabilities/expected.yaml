_format_version: "3.0"
_transform: false
services:
  - id: 947a4e23-b483-5a65-8165-da9aed24565b
    name: ai-gateway
    url: http://ai-gateway.upstream.local
    host: ai-gateway.upstream.local
    port: 80
    protocol: http
routes:
  - id: b4a57e40-147c-502b-a080-e3102a5c3273
    name: gemini-generate
    service:
      id: 947a4e23-b483-5a65-8165-da9aed24565b
    paths:
      - ~/gemini/v1beta/models/(?<model_name>[^:/]+):(?:generateContent|streamGenerateContent)
    methods:
      - GET
      - POST
      - OPTIONS
    protocols:
      - http
      - https
    strip_path: false
  - id: 090ce054-21c9-5fd3-a8f0-e0733e5dcc43
    name: gemini-enterprise-generate
    service:
      id: 947a4e23-b483-5a65-8165-da9aed24565b
    paths:
      - ~/gemini/v1/projects/(?<project_id>[^/]+)/locations/(?<location_id>[^/]+)/publishers/(?<publisher>[^/]+)/models/(?<model_name>[^:/]+):(?:generateContent|streamGenerateContent)
    methods:
      - GET
      - POST
      - OPTIONS
    protocols:
      - http
      - https
    strip_path: false
  - id: 0b3d41ee-cd0b-51a2-ba17-192fbf50cad8
