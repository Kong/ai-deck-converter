plugins:
  - id: 17fa8192-4b9f-5b5a-8379-20ad8bc836a7
    name: ai-model-selector
    config:
      max_request_body_size: 8388608
      sources:
        - path_pattern: 'models/([%w%.%-]+):'
          source: path
    route:
      id: b4a57e40-147c-502b-a080-e3102a5c3273
  - id: b3a0cddb-c648-5385-9877-6c737aa11014
    name: ai-proxy-advanced
    config:
      balancer:
        algorithm: round-robin
      genai_category: text/generation
      llm_format: gemini
      targets:
        - auth:
            header_name: x-goog-api-key
            header_value: e2e-fake-gemini-key
          description: gemini-2.5-pro
          logging:
            log_payloads: false
            log_statistics: true
          model:
            model_alias: gemini-all-capabilities
            name: gemini-2.5-pro
            provider: gemini
          route_type: llm/v1/chat
    route:
      id: b4a57e40-147c-502b-a080-e3102a5c3273
