_format_version: "3.0"

services:
  - name: ai-gateway
    url: http://ai-gateway.upstream.local
    routes:
      - name: openai-chat
        paths:
          - /v1/chat/completions/chat/completions
        methods:
          - POST
        strip_path: false
      - name: openai-embeddings
        paths:
          - /v1/chat/completions/embeddings
        methods:
          - POST
        strip_path: false
plugins:
  - name: ai-model-selector
    config:
      body_path: model
      max_request_body_size: 8388608
      source: body
    route:
      name: openai-chat
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: consistent-hashing
        connect_timeout: 60000
        fail_timeout: 10000
        failover_criteria:
          - error
          - timeout
          - http_429
          - http_500
        hash_on_header: X-Kong-LLM-Request-ID
        read_timeout: 60000
        retries: 5
        slots: 10000
        write_timeout: 60000
      genai_category: text/generation
      llm_format: openai
      max_request_body_size: 8388608
      model_name_header: true
      response_streaming: allow
      targets:
        - auth:
            allow_override: false
          model:
            model_alias: my-model-alias
            name: gpt-4o
            provider: openai
          route_type: llm/v1/chat
          weight: 100
    route:
      name: openai-chat
  - name: ai-model-selector
    config:
      body_path: model
      max_request_body_size: 8388608
      source: body
    route:
      name: openai-embeddings
  - name: ai-proxy-advanced
    config:
      balancer:
        algorithm: consistent-hashing
        connect_timeout: 60000
        fail_timeout: 10000
        failover_criteria:
          - error
          - timeout
          - http_429
          - http_500
        hash_on_header: X-Kong-LLM-Request-ID
        read_timeout: 60000
        retries: 5
        slots: 10000
        write_timeout: 60000
      genai_category: text/embeddings
      llm_format: openai
      max_request_body_size: 8388608
      model_name_header: true
      response_streaming: allow
      targets:
        - auth:
            allow_override: false
          model:
            model_alias: my-model-alias
            name: gpt-4o
            provider: openai
          route_type: llm/v1/embeddings
          weight: 100
    route:
      name: openai-embeddings
  - name: acl
    config:
      allow:
        - consumer-alice
        - group-admins
      deny:
        - consumer-bob
        - group-blocked
    model:
      name: my-balancer-ch-model
ai-models:
  - name: my-balancer-ch-model
    alias: my-model-alias
